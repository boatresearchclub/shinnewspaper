<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ボートリサーチ | 的中率ダッシュボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg:        #0b0f14;
    --bg2:       #111720;
    --bg3:       #1a2230;
    --border:    #1e2d40;
    --accent:    #00c6ff;
    --accent2:   #ff6b35;
    --hit:       #22c55e;
    --miss:      #ef4444;
    --skip:      #6b7280;
    --text:      #e2e8f0;
    --text-muted:#64748b;
    --gold:      #f59e0b;
    --radius:    10px;
    --mono:      'JetBrains Mono', monospace;
    --sans:      'Zen Kaku Gothic New', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }

  /* ── ヘッダー ── */
  header {
    background: linear-gradient(135deg, #0d1a2a 0%, #0b1f35 100%);
    border-bottom: 1px solid var(--border);
    padding: 18px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-title {
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  .header-title h1 {
    font-size: 1.15rem;
    font-weight: 900;
    letter-spacing: 0.05em;
    color: var(--accent);
    text-transform: uppercase;
  }
  .header-title span {
    font-size: 0.75rem;
    color: var(--text-muted);
    font-family: var(--mono);
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  #last-updated {
    font-size: 0.72rem;
    font-family: var(--mono);
    color: var(--text-muted);
  }
  .btn {
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--accent);
    padding: 7px 16px;
    border-radius: 6px;
    font-size: 0.8rem;
    font-family: var(--sans);
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 700;
  }
  .btn:hover { background: var(--border); border-color: var(--accent); }
  .btn-accent {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
  }
  .btn-accent:hover { opacity: 0.85; }

  /* ── フィルターバー ── */
  .filter-bar {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 12px 32px;
    display: flex;
    gap: 16px;
    align-items: center;
    flex-wrap: wrap;
  }
  .filter-bar label {
    font-size: 0.75rem;
    color: var(--text-muted);
    font-weight: 700;
    letter-spacing: 0.06em;
  }
  .filter-bar select, .filter-bar input[type=date] {
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 0.8rem;
    font-family: var(--sans);
    cursor: pointer;
  }
  .filter-sep { width: 1px; height: 24px; background: var(--border); }

  /* ── メインレイアウト ── */
  main { padding: 28px 32px; max-width: 1400px; margin: 0 auto; }

  /* ── KPIカード ── */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 16px;
    margin-bottom: 28px;
  }
  .kpi-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 20px 18px;
    position: relative;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .kpi-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
  }
  .kpi-card.blue::before   { background: var(--accent); }
  .kpi-card.green::before  { background: var(--hit); }
  .kpi-card.orange::before { background: var(--accent2); }
  .kpi-card.gold::before   { background: var(--gold); }
  .kpi-card.gray::before   { background: var(--skip); }
  .kpi-card:hover { border-color: #2d3f55; }
  .kpi-label {
    font-size: 0.68rem;
    color: var(--text-muted);
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .kpi-value {
    font-family: var(--mono);
    font-size: 2rem;
    font-weight: 700;
    color: var(--text);
    line-height: 1;
  }
  .kpi-value.big { font-size: 2.4rem; }
  .kpi-value.hit-rate { color: var(--hit); }
  .kpi-sub {
    font-size: 0.72rem;
    color: var(--text-muted);
    margin-top: 6px;
  }

  /* ── グラフ & テーブルグリッド ── */
  .chart-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
  }
  @media (max-width: 900px) { .chart-grid { grid-template-columns: 1fr; } }
  .chart-grid-3 {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
  }
  @media (max-width: 900px) { .chart-grid-3 { grid-template-columns: 1fr; } }

  .panel {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
  }
  .panel-title {
    font-size: 0.8rem;
    font-weight: 900;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel-title .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
  }

  canvas { max-height: 240px; }

  /* ── 会場別テーブル ── */
  .venue-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.82rem;
  }
  .venue-table th {
    text-align: left;
    padding: 8px 10px;
    font-size: 0.68rem;
    color: var(--text-muted);
    letter-spacing: 0.06em;
    font-weight: 700;
    border-bottom: 1px solid var(--border);
  }
  .venue-table td {
    padding: 9px 10px;
    border-bottom: 1px solid #161e2a;
    font-family: var(--mono);
    font-size: 0.8rem;
  }
  .venue-table tr:last-child td { border-bottom: none; }
  .venue-table tr:hover td { background: #131c28; }
  .venue-name { font-family: var(--sans); font-weight: 700; color: var(--text); }
  .rate-bar-wrap { display: flex; align-items: center; gap: 8px; }
  .rate-bar { height: 6px; border-radius: 3px; flex-shrink: 0; }
  .rate-num { color: var(--hit); font-weight: 700; }
  .badge {
    font-size: 0.65rem;
    padding: 2px 7px;
    border-radius: 4px;
    font-weight: 700;
    font-family: var(--sans);
  }
  .badge.good  { background: rgba(34,197,94,0.15);  color: var(--hit); }
  .badge.warn  { background: rgba(245,158,11,0.15); color: var(--gold); }
  .badge.bad   { background: rgba(239,68,68,0.15);  color: var(--miss); }

  /* ── 直近レース一覧 ── */
  .race-log {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 20px;
  }
  .race-log-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    font-size: 0.8rem;
    font-weight: 900;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .race-log-body { max-height: 340px; overflow-y: auto; }
  .race-log-body::-webkit-scrollbar { width: 4px; }
  .race-log-body::-webkit-scrollbar-track { background: var(--bg2); }
  .race-log-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .race-row {
    display: grid;
    grid-template-columns: 90px 70px 40px 1fr auto 90px 80px 70px;
    gap: 8px;
    align-items: center;
    padding: 9px 20px;
    border-bottom: 1px solid #0f1820;
    font-size: 0.78rem;
    transition: background 0.15s;
  }
  .race-row:hover { background: #111a26; }
  .race-row.is-hit   { border-left: 2px solid var(--hit); }
  .race-row.is-miss  { border-left: 2px solid transparent; }
  .race-row.is-skip  { border-left: 2px solid var(--skip); opacity: 0.55; }
  .race-row .col-date  { color: var(--text-muted); font-family: var(--mono); font-size: 0.72rem; }
  .race-row .col-venue { font-weight: 700; }
  .race-row .col-race  { color: var(--text-muted); font-family: var(--mono); }
  .race-row .col-buys  { display: flex; flex-wrap: wrap; gap: 4px; }
  .combo-tag {
    background: var(--bg3);
    border: 1px solid var(--border);
    padding: 2px 7px;
    border-radius: 4px;
    font-size: 0.68rem;
    font-family: var(--mono);
    color: var(--text-muted);
  }
  .combo-tag.hit {
    background: rgba(34,197,94,0.12);
    border-color: var(--hit);
    color: var(--hit);
    font-weight: 700;
  }
  .race-row .col-result {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 0.85rem;
    color: var(--text);
  }
  .col-status { text-align: right; }
  .col-payout {
    font-family: var(--mono);
    font-size: 0.75rem;
    text-align: right;
    color: var(--text-muted);
  }
  .col-payout.good { color: var(--hit); font-weight: 700; }
  .col-payout.bad  { color: var(--miss); }
  .status-hit  { color: var(--hit);  font-weight: 700; font-size: 0.75rem; }
  .status-miss { color: var(--miss); font-size: 0.75rem; }
  .status-skip { color: var(--skip); font-size: 0.75rem; }
  .status-wait { color: var(--gold); font-size: 0.75rem; }

  /* ── 空状態 ── */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
    font-size: 0.85rem;
  }
  .empty strong { display: block; font-size: 1.2rem; margin-bottom: 8px; color: var(--text); }

  /* ── ローディング ── */
  #loading {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999;
    flex-direction: column;
    gap: 16px;
  }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── 移動平均ライン表示切替 ── */
  .toggle-ma { font-size: 0.72rem; color: var(--accent); cursor: pointer; margin-left: auto; }

  /* ── レスポンシブ ── */
  @media (max-width: 700px) {
    main { padding: 16px; }
    .filter-bar { padding: 10px 16px; }
    header { padding: 14px 16px; }
    .race-row { grid-template-columns: 70px 60px 30px 1fr 60px 60px 60px; }
    .race-row .col-buys { display: none; }
  }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <span style="color:var(--text-muted);font-size:.8rem">データを読み込み中...</span>
</div>

<header>
  <div class="header-title">
    <h1>BoatResearch HitTracker</h1>
    <span id="last-updated">─</span>
  </div>
  <div class="header-right">
    <button class="btn btn-accent" onclick="reloadData()">🔄 更新</button>
  </div>
</header>

<div class="filter-bar">
  <label>期間</label>
  <select id="filter-period">
    <option value="7">直近 7日</option>
    <option value="14">直近 14日</option>
    <option value="30" selected>直近 30日</option>
    <option value="90">直近 90日</option>
    <option value="0">全期間</option>
  </select>
  <div class="filter-sep"></div>
  <label>会場</label>
  <select id="filter-venue">
    <option value="">すべて</option>
  </select>
  <div class="filter-sep"></div>
  <label>見送り</label>
  <select id="filter-skip">
    <option value="exclude">除外</option>
    <option value="include">含む</option>
  </select>
  <div class="filter-sep"></div>
  <label>結果未確定</label>
  <select id="filter-unknown">
    <option value="exclude">除外</option>
    <option value="include">含む（─表示）</option>
  </select>
</div>

<main>
  <!-- KPI 1行目: 的中系 -->
  <div class="kpi-grid" id="kpi-grid" style="margin-bottom:12px">
    <div class="kpi-card blue">
      <div class="kpi-label">的中率</div>
      <div class="kpi-value big hit-rate" id="kpi-hitrate">─</div>
      <div class="kpi-sub" id="kpi-hitrate-sub">─</div>
    </div>
    <div class="kpi-card green">
      <div class="kpi-label">的中レース数</div>
      <div class="kpi-value" id="kpi-hits">─</div>
      <div class="kpi-sub" id="kpi-hits-sub">─</div>
    </div>
    <div class="kpi-card orange">
      <div class="kpi-label">買いレース数</div>
      <div class="kpi-value" id="kpi-total">─</div>
      <div class="kpi-sub" id="kpi-total-sub">─</div>
    </div>
    <div class="kpi-card gold">
      <div class="kpi-label">平均買い目点数</div>
      <div class="kpi-value" id="kpi-avgbets">─</div>
      <div class="kpi-sub">点 / レース</div>
    </div>
    <div class="kpi-card gray">
      <div class="kpi-label">見送りレース</div>
      <div class="kpi-value" id="kpi-skips">─</div>
      <div class="kpi-sub" id="kpi-skips-sub">─</div>
    </div>
  </div>
  <!-- KPI 2行目: 回収系 -->
  <div class="kpi-grid" style="grid-template-columns: repeat(3,1fr); margin-bottom:28px">
    <div class="kpi-card green" id="kpi-card-roi">
      <div class="kpi-label">回収率</div>
      <div class="kpi-value big" id="kpi-roi">─</div>
      <div class="kpi-sub" id="kpi-roi-sub">払戻データあり分</div>
    </div>
    <div class="kpi-card orange" id="kpi-card-pl">
      <div class="kpi-label">累計損益</div>
      <div class="kpi-value big" id="kpi-pl">─</div>
      <div class="kpi-sub" id="kpi-pl-sub">─</div>
    </div>
    <div class="kpi-card gold">
      <div class="kpi-label">投資総額</div>
      <div class="kpi-value" id="kpi-invest">─</div>
      <div class="kpi-sub" id="kpi-invest-sub">払戻データあり分</div>
    </div>
  </div>

  <!-- グラフ上段 -->
  <div class="chart-grid">
    <div class="panel">
      <div class="panel-title">
        <span class="dot" style="background:var(--accent)"></span>
        日別 的中率推移
        <span class="toggle-ma" id="toggle-ma" onclick="toggleMA()">移動平均: ON</span>
      </div>
      <canvas id="chart-daily"></canvas>
    </div>
    <div class="panel">
      <div class="panel-title">
        <span class="dot" style="background:var(--accent2)"></span>
        会場別 的中率
      </div>
      <canvas id="chart-venue"></canvas>
    </div>
  </div>

  <!-- グラフ下段 -->
  <div class="chart-grid-3">
    <div class="panel">
      <div class="panel-title">
        <span class="dot" style="background:var(--gold)"></span>
        レース番号別 的中率
      </div>
      <canvas id="chart-race"></canvas>
    </div>
    <div class="panel">
      <div class="panel-title">
        <span class="dot" style="background:var(--hit)"></span>
        会場別サマリー
      </div>
      <div style="overflow-y:auto;max-height:270px">
        <table class="venue-table" id="venue-table">
          <thead>
            <tr>
              <th>会場</th>
              <th>的中率</th>
              <th></th>
              <th style="text-align:right">的中/買い</th>
              <th style="text-align:right">回収率</th>
            </tr>
          </thead>
          <tbody id="venue-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- グラフ 回収率推移 -->
  <div class="chart-grid" style="margin-bottom:20px">
    <div class="panel">
      <div class="panel-title">
        <span class="dot" style="background:var(--gold)"></span>
        日別 回収率推移
        <span style="font-size:0.68rem;color:var(--text-muted);margin-left:4px">（払戻データあり分）</span>
      </div>
      <canvas id="chart-roi-daily"></canvas>
    </div>
    <div class="panel">
      <div class="panel-title">
        <span class="dot" style="background:var(--hit)"></span>
        累計損益推移
      </div>
      <canvas id="chart-pl-cumul"></canvas>
    </div>
  </div>

  <!-- 直近レース一覧 -->
  <div class="race-log">
    <div class="race-log-header">
      <span class="dot" style="width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block"></span>
      直近レース一覧
      <span style="margin-left:auto;font-size:0.72rem;color:var(--text-muted);font-weight:400" id="log-count"></span>
    </div>
    <div class="race-log-body" id="race-log-body">
      <div class="empty"><strong>データなし</strong>hit_log.json を読み込んでください</div>
    </div>
  </div>
</main>

<script>
// ════════════════════════════════════════════════════════
// データ管理
// ════════════════════════════════════════════════════════
let ALL_RECORDS = [];
let charts = {};
let showMA = true;

async function loadData() {
  try {
    // hit_log.json を同じディレクトリから読む
    const res = await fetch('hit_log.json?' + Date.now());
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    ALL_RECORDS = data.records || [];

    const upd = data.last_updated || '';
    document.getElementById('last-updated').textContent =
      upd ? '最終更新: ' + upd.replace('T', ' ') : '';

    // 会場フィルター選択肢を生成
    const venues = [...new Set(ALL_RECORDS.map(r => r.venue))].sort();
    const sel = document.getElementById('filter-venue');
    sel.innerHTML = '<option value="">すべて</option>';
    venues.forEach(v => {
      const o = document.createElement('option');
      o.value = v; o.textContent = v;
      sel.appendChild(o);
    });

    render();
  } catch(e) {
    console.error(e);
    document.getElementById('race-log-body').innerHTML =
      `<div class="empty"><strong>読み込みエラー</strong>${e.message}<br><br>
      hit_log.json と dashboard.html を同じフォルダに置いてください。<br>
      ローカルで開く場合は <code>python -m http.server</code> で起動してください。</div>`;
  }
  document.getElementById('loading').style.display = 'none';
}

function reloadData() {
  document.getElementById('loading').style.display = 'flex';
  loadData();
}

// ════════════════════════════════════════════════════════
// フィルタリング
// ════════════════════════════════════════════════════════
function getFiltered() {
  const period  = parseInt(document.getElementById('filter-period').value);
  const venue   = document.getElementById('filter-venue').value;
  const skip    = document.getElementById('filter-skip').value;
  const unknown = document.getElementById('filter-unknown').value;

  const cutoff = period > 0
    ? new Date(Date.now() - period * 86400000).toISOString().slice(0, 10)
    : '0000-00-00';

  return ALL_RECORDS.filter(r => {
    if (r.date < cutoff) return false;
    if (venue && r.venue !== venue) return false;
    if (skip === 'exclude' && r.skip) return false;
    if (unknown === 'exclude' && !r.result_known) return false;
    return true;
  });
}

// ════════════════════════════════════════════════════════
// KPI
// ════════════════════════════════════════════════════════
function updateKPI(records) {
  const eligible = records.filter(r => !r.skip && r.result_known);
  const hits     = eligible.filter(r => r.hit).length;
  const total    = eligible.length;
  const skips    = records.filter(r => r.skip).length;
  const rate     = total > 0 ? (hits / total * 100) : 0;
  const avgBets  = eligible.length > 0
    ? (eligible.reduce((s,r) => s + (r.buy_count||0), 0) / eligible.length)
    : 0;

  // 回収率（払戻データある分のみ）
  const roiEligible = eligible.filter(r => r.returns !== null && r.returns !== undefined && r.invest > 0);
  const totalInvest  = roiEligible.reduce((s,r) => s + (r.invest||0), 0);
  const totalReturns = roiEligible.reduce((s,r) => s + (r.returns||0), 0);
  const roiPct = totalInvest > 0 ? (totalReturns / totalInvest * 100) : null;

  // 累計損益（払戻データある分）
  const pl = totalInvest > 0 ? (totalReturns - totalInvest) : null;

  document.getElementById('kpi-hitrate').textContent = total > 0 ? rate.toFixed(1) + '%' : '─';
  document.getElementById('kpi-hitrate-sub').textContent = `過去 ${total} レース`;
  document.getElementById('kpi-hits').textContent = hits;
  document.getElementById('kpi-hits-sub').textContent = `/ ${total} レース`;
  document.getElementById('kpi-total').textContent = total;
  document.getElementById('kpi-total-sub').textContent = `結果確定済み`;
  document.getElementById('kpi-avgbets').textContent = avgBets.toFixed(1);
  document.getElementById('kpi-skips').textContent = skips;
  document.getElementById('kpi-skips-sub').textContent = `件 見送り`;

  // 回収率KPI
  const roiEl = document.getElementById('kpi-roi');
  if (roiPct !== null) {
    roiEl.textContent = roiPct.toFixed(1) + '%';
    roiEl.style.color = roiPct >= 100 ? 'var(--hit)' : roiPct >= 75 ? 'var(--gold)' : 'var(--miss)';
  } else {
    roiEl.textContent = '─';
    roiEl.style.color = '';
  }
  document.getElementById('kpi-roi-sub').textContent =
    roiEligible.length > 0 ? `${roiEligible.length}レース分 投資${fmtYen(totalInvest)}` : '払戻データなし';

  // 累計損益KPI
  const plEl  = document.getElementById('kpi-pl');
  const plSub = document.getElementById('kpi-pl-sub');
  if (pl !== null) {
    plEl.textContent = (pl >= 0 ? '+' : '') + fmtYen(pl);
    plEl.style.color = pl >= 0 ? 'var(--hit)' : 'var(--miss)';
    plSub.textContent = `回収 ${fmtYen(totalReturns)} / 投資 ${fmtYen(totalInvest)}`;
  } else {
    plEl.textContent = '─';
    plEl.style.color = '';
    plSub.textContent = '払戻データなし';
  }

  // 投資総額KPI
  const investEl = document.getElementById('kpi-invest');
  if (investEl) {
    investEl.textContent = totalInvest > 0 ? fmtYen(totalInvest) : '─';
    document.getElementById('kpi-invest-sub').textContent =
      totalInvest > 0 ? `回収 ${fmtYen(totalReturns)}` : '払戻データなし';
  }
}

function fmtYen(v) {
  if (v === null || v === undefined) return '─';
  return (v >= 0 ? '' : '-') + '¥' + Math.abs(Math.round(v)).toLocaleString();
}

// ════════════════════════════════════════════════════════
// 日別的中率グラフ
// ════════════════════════════════════════════════════════
function movingAvg(arr, n) {
  return arr.map((_, i) => {
    const slice = arr.slice(Math.max(0, i - n + 1), i + 1)
      .filter(v => v !== null);
    return slice.length > 0 ? slice.reduce((a,b)=>a+b,0)/slice.length : null;
  });
}

function buildDailyChart(records) {
  const byDate = {};
  records.filter(r => !r.skip && r.result_known).forEach(r => {
    if (!byDate[r.date]) byDate[r.date] = {hits:0, total:0};
    byDate[r.date].total++;
    if (r.hit) byDate[r.date].hits++;
  });

  const dates = Object.keys(byDate).sort();
  const rates = dates.map(d => byDate[d].total > 0 ?
    +(byDate[d].hits / byDate[d].total * 100).toFixed(1) : null);
  const ma5   = movingAvg(rates, 5);

  destroyChart('chart-daily');
  const ctx = document.getElementById('chart-daily').getContext('2d');
  charts['chart-daily'] = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: dates.map(d => d.slice(5)), // MM-DD
      datasets: [
        {
          label: '的中率(%)',
          data: rates,
          backgroundColor: rates.map(v =>
            v === null ? 'transparent' :
            v >= 40 ? 'rgba(34,197,94,0.55)' :
            v >= 25 ? 'rgba(0,198,255,0.4)' : 'rgba(239,68,68,0.35)'
          ),
          borderRadius: 3,
          borderSkipped: false,
          yAxisID: 'y',
        },
        {
          label: '5日移動平均',
          data: showMA ? ma5 : [],
          type: 'line',
          borderColor: '#f59e0b',
          borderWidth: 2,
          pointRadius: 0,
          tension: 0.4,
          yAxisID: 'y',
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#4a5568', font: {size:10} }, grid: { color: '#1a2230' } },
        y: {
          min: 0, max: 100,
          ticks: { color: '#4a5568', font:{size:10}, callback: v => v+'%' },
          grid: { color: '#1a2230' },
        }
      }
    }
  });
}

function toggleMA() {
  showMA = !showMA;
  document.getElementById('toggle-ma').textContent = '移動平均: ' + (showMA ? 'ON' : 'OFF');
  render();
}

// ════════════════════════════════════════════════════════
// 日別 回収率グラフ
// ════════════════════════════════════════════════════════
function buildRoiDailyChart(records) {
  const byDate = {};
  records.filter(r => !r.skip && r.result_known && r.returns !== null && r.returns !== undefined && r.invest > 0)
    .forEach(r => {
      if (!byDate[r.date]) byDate[r.date] = {invest:0, returns:0};
      byDate[r.date].invest  += r.invest;
      byDate[r.date].returns += r.returns;
    });

  const dates = Object.keys(byDate).sort();
  const rois  = dates.map(d => {
    const v = byDate[d];
    return v.invest > 0 ? +(v.returns / v.invest * 100).toFixed(1) : null;
  });

  destroyChart('chart-roi-daily');
  if (!dates.length) return;

  const ctx = document.getElementById('chart-roi-daily').getContext('2d');
  charts['chart-roi-daily'] = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: dates.map(d => d.slice(5)),
      datasets: [
        {
          label: '回収率(%)',
          data: rois,
          backgroundColor: rois.map(v =>
            v === null      ? 'transparent' :
            v >= 100        ? 'rgba(34,197,94,0.55)' :
            v >= 75         ? 'rgba(245,158,11,0.45)' : 'rgba(239,68,68,0.35)'
          ),
          borderRadius: 3,
          borderSkipped: false,
        },
        {
          label: '損益分岐(100%)',
          data: dates.map(() => 100),
          type: 'line',
          borderColor: 'rgba(100,116,139,0.5)',
          borderWidth: 1,
          borderDash: [4, 4],
          pointRadius: 0,
          tension: 0,
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#4a5568', font:{size:10} }, grid: { color: '#1a2230' } },
        y: {
          ticks: { color: '#4a5568', font:{size:10}, callback: v => v+'%' },
          grid: { color: '#1a2230' },
        }
      }
    }
  });
}

// ════════════════════════════════════════════════════════
// 累計損益グラフ
// ════════════════════════════════════════════════════════
function buildPlCumulChart(records) {
  const sorted = [...records]
    .filter(r => !r.skip && r.result_known && r.returns !== null && r.returns !== undefined && r.invest > 0)
    .sort((a,b) => a.date.localeCompare(b.date) || parseInt(a.race)-parseInt(b.race));

  if (!sorted.length) { destroyChart('chart-pl-cumul'); return; }

  let cumul = 0;
  const labels = [];
  const data   = [];
  sorted.forEach(r => {
    cumul += (r.returns - r.invest);
    labels.push(r.date.slice(5) + ' ' + r.venue + r.race + 'R');
    data.push(cumul);
  });

  destroyChart('chart-pl-cumul');
  const ctx = document.getElementById('chart-pl-cumul').getContext('2d');
  const lastVal = data[data.length - 1];
  charts['chart-pl-cumul'] = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: '累計損益(円)',
        data,
        borderColor: lastVal >= 0 ? '#22c55e' : '#ef4444',
        backgroundColor: lastVal >= 0 ? 'rgba(34,197,94,0.08)' : 'rgba(239,68,68,0.08)',
        borderWidth: 2,
        pointRadius: 0,
        tension: 0.2,
        fill: true,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      plugins: { legend: { display: false }, tooltip: {
        callbacks: {
          label: ctx => (ctx.parsed.y >= 0 ? '+' : '') + '¥' + ctx.parsed.y.toLocaleString()
        }
      }},
      scales: {
        x: { ticks: { display: false }, grid: { color: '#1a2230' } },
        y: {
          ticks: {
            color: '#4a5568', font:{size:10},
            callback: v => (v >= 0 ? '+' : '') + '¥' + v.toLocaleString()
          },
          grid: { color: '#1a2230' },
        }
      }
    }
  });
}

// ════════════════════════════════════════════════════════
// 会場別的中率グラフ
// ════════════════════════════════════════════════════════
function buildVenueChart(records) {
  const byVenue = {};
  records.filter(r => !r.skip && r.result_known).forEach(r => {
    if (!byVenue[r.venue]) byVenue[r.venue] = {hits:0, total:0};
    byVenue[r.venue].total++;
    if (r.hit) byVenue[r.venue].hits++;
  });

  const venues = Object.keys(byVenue)
    .sort((a,b) => byVenue[b].hits/byVenue[b].total - byVenue[a].hits/byVenue[a].total);
  const rates  = venues.map(v => +(byVenue[v].hits/byVenue[v].total*100).toFixed(1));

  destroyChart('chart-venue');
  const ctx = document.getElementById('chart-venue').getContext('2d');
  charts['chart-venue'] = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: venues,
      datasets: [{
        label: '的中率(%)',
        data: rates,
        backgroundColor: rates.map(v =>
          v >= 40 ? 'rgba(34,197,94,0.6)' :
          v >= 25 ? 'rgba(0,198,255,0.5)' : 'rgba(239,68,68,0.4)'
        ),
        borderRadius: 4,
      }]
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: true,
      plugins: { legend: { display: false } },
      scales: {
        x: {
          min: 0, max: 100,
          ticks: { color: '#4a5568', font:{size:10}, callback: v => v+'%' },
          grid: { color: '#1a2230' },
        },
        y: { ticks: { color: '#94a3b8', font:{size:11} }, grid: { color: '#1a2230' } },
      }
    }
  });
}

// ════════════════════════════════════════════════════════
// レース番号別グラフ
// ════════════════════════════════════════════════════════
function buildRaceChart(records) {
  const byRace = {};
  for (let i = 1; i <= 12; i++) byRace[i] = {hits:0, total:0};
  records.filter(r => !r.skip && r.result_known).forEach(r => {
    const rn = parseInt(r.race);
    if (rn >= 1 && rn <= 12) {
      byRace[rn].total++;
      if (r.hit) byRace[rn].hits++;
    }
  });

  const labels = Array.from({length:12}, (_,i) => (i+1)+'R');
  const rates  = labels.map((_,i) => {
    const d = byRace[i+1];
    return d.total > 0 ? +(d.hits/d.total*100).toFixed(1) : null;
  });

  destroyChart('chart-race');
  const ctx = document.getElementById('chart-race').getContext('2d');
  charts['chart-race'] = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: '的中率(%)',
        data: rates,
        borderColor: '#00c6ff',
        backgroundColor: 'rgba(0,198,255,0.08)',
        borderWidth: 2,
        pointBackgroundColor: rates.map(v =>
          v === null ? 'transparent' :
          v >= 40 ? '#22c55e' : v >= 25 ? '#00c6ff' : '#ef4444'
        ),
        pointRadius: 5,
        tension: 0.3,
        fill: true,
        spanGaps: true,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#4a5568', font:{size:10} }, grid: { color: '#1a2230' } },
        y: {
          min: 0, max: 100,
          ticks: { color: '#4a5568', font:{size:10}, callback: v => v+'%' },
          grid: { color: '#1a2230' },
        }
      }
    }
  });
}

// ════════════════════════════════════════════════════════
// 会場別テーブル
// ════════════════════════════════════════════════════════
function buildVenueTable(records) {
  const byVenue = {};
  records.filter(r => !r.skip && r.result_known).forEach(r => {
    if (!byVenue[r.venue]) byVenue[r.venue] = {hits:0, total:0, invest:0, returns:0, roiCount:0};
    byVenue[r.venue].total++;
    if (r.hit) byVenue[r.venue].hits++;
    if (r.returns !== null && r.returns !== undefined && r.invest > 0) {
      byVenue[r.venue].invest  += r.invest;
      byVenue[r.venue].returns += r.returns;
      byVenue[r.venue].roiCount++;
    }
  });

  const sorted = Object.entries(byVenue)
    .map(([v,d]) => ({venue:v, ...d, rate: d.hits/d.total*100,
      roi: d.invest > 0 ? d.returns/d.invest*100 : null}))
    .sort((a,b) => b.rate - a.rate);

  const tbody = document.getElementById('venue-tbody');
  tbody.innerHTML = sorted.map(row => {
    const pct = row.rate.toFixed(1);
    const cls = row.rate >= 40 ? 'good' : row.rate >= 25 ? 'warn' : 'bad';
    const barW = Math.min(100, row.rate).toFixed(0);
    const barColor = row.rate >= 40 ? '#22c55e' : row.rate >= 25 ? '#00c6ff' : '#ef4444';
    const roiStr  = row.roi !== null ? row.roi.toFixed(1) + '%' : '─';
    const roiCls  = row.roi === null ? '' : row.roi >= 100 ? 'good' : row.roi >= 75 ? 'warn' : 'bad';
    return `<tr>
      <td class="venue-name">${row.venue}</td>
      <td class="rate-num">${pct}%</td>
      <td>
        <div class="rate-bar-wrap">
          <div class="rate-bar" style="width:${barW}px;background:${barColor}"></div>
        </div>
      </td>
      <td style="text-align:right;color:var(--text-muted)">
        <span class="badge ${cls}">${row.hits}/${row.total}</span>
      </td>
      <td style="text-align:right">
        <span class="badge ${roiCls}">${roiStr}</span>
      </td>
    </tr>`;
  }).join('');
}

// ════════════════════════════════════════════════════════
// 直近レース一覧
// ════════════════════════════════════════════════════════
function buildRaceLog(records) {
  const sorted = [...records].sort((a,b) => {
    const ds = b.date.localeCompare(a.date);
    if (ds !== 0) return ds;
    return parseInt(b.race) - parseInt(a.race);
  }).slice(0, 200);

  document.getElementById('log-count').textContent = `${sorted.length}件表示`;

  if (!sorted.length) {
    document.getElementById('race-log-body').innerHTML =
      '<div class="empty"><strong>データなし</strong></div>';
    return;
  }

  const html = sorted.map(r => {
    const isSkip = r.skip;
    const isHit  = r.hit && !isSkip;
    const isMiss = !isHit && !isSkip && r.result_known;
    const rowCls = isHit ? 'is-hit' : isSkip ? 'is-skip' : 'is-miss';

    const result = r.result || '';
    const buyTags = (r.buy_list || []).slice(0, 10).map(b => {
      const norm = b.replace(/=/g,'-');
      const isMatch = result && norm === result.replace(/=/g,'-');
      return `<span class="combo-tag${isMatch?' hit':''}">${norm}</span>`;
    }).join('');
    const more = (r.buy_list||[]).length > 10
      ? `<span class="combo-tag">+${(r.buy_list.length-10)}</span>` : '';

    const statusLabel = isSkip ? '<span class="status-skip">見送</span>'
      : !r.result_known ? '<span class="status-wait">待機中</span>'
      : isHit ? '<span class="status-hit">✓ 的中</span>'
      : '<span class="status-miss">✗ 外れ</span>';

    // 回収率列
    let payoutHtml = '<span style="color:var(--text-muted)">─</span>';
    if (!isSkip && r.result_known && r.returns !== null && r.returns !== undefined) {
      const roi = r.invest > 0 ? (r.returns / r.invest * 100).toFixed(0) : null;
      const cls = (r.returns > 0) ? 'good' : 'bad';
      payoutHtml = roi !== null
        ? `<span class="col-payout ${cls}">${roi}%<br><small>¥${r.returns.toLocaleString()}</small></span>`
        : `<span class="col-payout ${cls}">¥${r.returns.toLocaleString()}</span>`;
    }

    return `<div class="race-row ${rowCls}">
      <span class="col-date">${r.date}</span>
      <span class="col-venue">${r.venue}</span>
      <span class="col-race">${r.race}R</span>
      <span class="col-buys">${buyTags}${more}</span>
      <span class="col-result">${result || '─'}</span>
      <span class="col-status">${statusLabel}</span>
      ${payoutHtml}
    </div>`;
  }).join('');

  document.getElementById('race-log-body').innerHTML = html;
}

// ════════════════════════════════════════════════════════
// チャート破棄
// ════════════════════════════════════════════════════════
function destroyChart(id) {
  if (charts[id]) { charts[id].destroy(); delete charts[id]; }
}

// ════════════════════════════════════════════════════════
// 全体レンダリング
// ════════════════════════════════════════════════════════
function render() {
  const filtered = getFiltered();
  updateKPI(filtered);
  buildDailyChart(filtered);
  buildVenueChart(filtered);
  buildRaceChart(filtered);
  buildVenueTable(filtered);
  buildRaceLog(filtered);
  buildRoiDailyChart(filtered);
  buildPlCumulChart(filtered);
}

// ── イベント登録 ──
['filter-period','filter-venue','filter-skip','filter-unknown'].forEach(id => {
  document.getElementById(id).addEventListener('change', render);
});

// ── 起動 ──
loadData();
</script>
</body>
</html>
