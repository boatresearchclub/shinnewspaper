<!-- ===== 変更 3: buildTopVenueChips() 関数を置き換え ===== -->
<script>
// 既存の buildTopVenueChips() をこの新版に差し替えてください

function buildTopVenueChips() {
  const area = document.getElementById('top-venue-chips');
  if (!area) return;
  const venues = VENUE_LIST.filter(v => ALL_DATA && ALL_DATA[v] != null);
  if (venues.length === 0) {
    area.innerHTML = '<span style="color:var(--text3);font-size:12px">本日の開催情報なし</span>';
    return;
  }

  const gradeClass = { SG: 'cg-sg', G1: 'cg-g1', G2: 'cg-g2', G3: 'cg-g3', '一般': 'cg-ippan' };

  area.innerHTML = venues.map(v => {
    const finished = isVenueFinished(ALL_DATA[v]);
    const baseStyle = finished
      ? 'opacity:0.4;filter:grayscale(0.6);cursor:default;pointer-events:none;'
      : '';

    // RACE_INDEX_DATA からグレード・タイトル・期間を取得
    const info   = (RACE_INDEX_DATA && RACE_INDEX_DATA.venues)
                   ? (RACE_INDEX_DATA.venues[v] || null)
                   : null;
    const grade  = info ? (info.grade  || '一般') : '';
    const title  = info ? (info.title  || '')    : '';
    const period = info ? (info.period || '')    : '';
    const day    = info ? (info.day    || '')    : '';

    const gcls   = gradeClass[grade] || 'cg-ippan';

    // グレードバッジ（一般でも表示）
    const gradeBadge = grade
      ? `<span class="chip-grade ${gcls}">${grade}</span>`
      : '';

    // タイトル（長い場合は省略）
    const titleBadge = title
      ? `<span class="chip-title" title="${title}">${title}</span>`
      : '';

    // 開催期間＋日次
    const periodBadge = (period || day)
      ? `<span class="chip-period">${period}${day ? '&nbsp;' + day : ''}</span>`
      : '';

    return `
      <span class="top-venue-chip" onclick="jumpToVenue('${v}')" style="${baseStyle}">
        <span class="chip-name">${v}</span>
        ${gradeBadge}
        ${titleBadge}
        ${periodBadge}
      </span>`;
  }).join('');
}
</script>
