<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>競艇予想 — Boat Research Club</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6f8fb;
  --bg2: #ffffff;
  --bg3: #f0f5ff;
  --bg4: #e7eefc;
  --border: rgba(0, 40, 90, 0.12);
  --border2: rgba(0, 40, 90, 0.20);
  --text: #0b1220;
  --text2: #3d4a63;
  --text3: #6c7a94;
  --accent: #0066ff;
  --accent2: #1a7dff;
  --gold: #ffb300;
  --green: #00b86b;
  --green2: #d9f6ea;
  --red: #ff3b3b;
  --red2: #ffe1e1;
  --orange: #ff7a00;
  --orange2: #fff1e0;
  --radius: 10px;
  --radius-sm: 6px;
  --mono: 'JetBrains Mono', monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; }
body {
  font-family: 'Noto Sans JP', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
}
.site-header {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 0 1.25rem;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1rem; letter-spacing: .03em; }
.logo-icon { width: 30px; height: 30px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.header-meta { font-size: 12px; color: var(--text2); text-align: right; }
.header-meta strong { color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 1.25rem 1rem; }

/* TABS */
.tab-bar { display: flex; gap: 4px; margin-bottom: 1rem; border-bottom: 1px solid var(--border); }
.tab-btn { padding: 7px 16px; font-size: 13px; font-family: 'Noto Sans JP', sans-serif; background: none; border: none; color: var(--text3); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .15s, border-color .15s; font-weight: 500; }
.tab-btn:hover { color: var(--text2); }
.tab-btn.active { color: var(--accent2); border-bottom-color: var(--accent); }


/* VENUE TABS */
.sticky-nav-venue { overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; display: flex; border-bottom: 1px solid var(--border); }
.sticky-nav-venue::-webkit-scrollbar { display: none; }
#venue-tabs { overflow-x: auto; scrollbar-width: none; flex-wrap: nowrap; gap: 2px; display: flex; }
#venue-tabs::-webkit-scrollbar { display: none; }
.vtab { flex-shrink: 0; padding: 6px 10px 8px; font-size: 12px; font-family: 'Noto Sans JP', sans-serif; background: none; border: none; color: var(--text3); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .15s, border-color .15s; font-weight: 500; white-space: nowrap; }
.vtab:hover { color: var(--text2); }
.vtab.loaded { color: var(--text2); font-weight: 700; }
.vtab.active { color: var(--accent2) !important; border-bottom-color: var(--accent); }

/* RACE BAR */
.sticky-nav { position: sticky; top: 52px; z-index: 90; background: var(--bg2); border-bottom: 1px solid var(--border); box-shadow: 0 2px 8px rgba(0,40,90,0.06); }
.sticky-nav-race { overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.sticky-nav-race::-webkit-scrollbar { display: none; }
.sticky-nav-race-inner { display: flex; gap: 4px; padding: 5px 10px; min-width: max-content; }
.race-btn { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 8px; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; transition: border-color .15s, background .15s; min-width: 48px; flex-shrink: 0; position: relative; }
.race-btn::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: transparent; border-radius: var(--radius-sm) var(--radius-sm) 0 0; transition: background .15s; }
.race-btn:hover { border-color: var(--border2); background: var(--bg3); }
.race-btn.active { border-color: var(--accent); background: var(--bg3); }
.race-btn.active::before { background: var(--accent); }
.race-btn-no { font-size: 12px; font-weight: 700; color: var(--text); }
.race-btn-time { font-size: 9px; color: var(--text3); }

/* DETAIL PANEL */
.detail-panel { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 1.25rem; box-shadow: 0 6px 18px rgba(0,40,90,0.08); }
.bt-head-simple { display: grid; grid-template-columns: 44px 90px 45px 72px; gap: 6px; padding: .4rem 1.25rem; font-size: 11px; color: var(--text3); font-weight: 700; letter-spacing: .08em; border-bottom: 1px solid var(--border); background: var(--bg3); }
.detail-panel .bt-row { grid-template-columns: 44px 90px 45px 72px; }
.bt-row { display: grid; grid-template-columns: 44px 90px 45px 72px; gap: 6px; padding: .75rem 1.25rem; align-items: center; border-bottom: 1px solid var(--border); font-size: 13px; transition: background .12s; }
.bt-row:last-child { border-bottom: none; }
.bt-row:hover { background: var(--bg3); }
.bt-row.top1 { background: rgba(79,124,255,.05); }
.bt-grade { font-size: 11px; color: var(--text3); }

/* BOAT CIRCLES */
.boat-circle { width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
.b1 { background: #ffffff; color: #111; border: 1px solid rgba(0,0,0,0.15); }
.b2 { background: #000000; color: #fff; }
.b3 { background: #e60012; color: #fff; }
.b4 { background: #0066cc; color: #fff; }
.b5 { background: #ffcc00; color: #111; }
.b6 { background: #00a651; color: #fff; }

/* GRADE TAGS */
.grade-tag { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 10px; font-weight: 700; }
.ga1 { background: rgba(79,124,255,.2); color: var(--accent2); }
.ga2 { background: rgba(79,124,255,.1); color: #8aabff; }
.gb1 { background: var(--bg4); color: var(--text2); }
.gb2 { background: rgba(255,90,90,.1); color: #ff8a8a; }

/* INSUFFICIENT BANNER */
.insufficient-banner { display: flex; align-items: center; gap: 7px; padding: .55rem 1.25rem; background: rgba(255,122,0,0.08); border-bottom: 1px solid rgba(255,122,0,0.18); font-size: 12px; color: var(--orange); line-height: 1.4; }

/* TENJI */
.tenji-section { margin-top: 1rem; border-top: 1px solid var(--border); padding: 0.875rem 0.75rem; }
.tenji-title { font-size: 0.78rem; font-weight: 700; color: var(--text3); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 6px; }
.tenji-badge { font-size: 10px; background: var(--accent); color: #fff; border-radius: 4px; padding: 1px 5px; }
.tenji-badge.waiting { background: var(--text3); }
.tenji-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; font-family: var(--mono); }
.tenji-table th { text-align: center; color: var(--text3); font-weight: 500; font-size: 0.72rem; padding: 3px 6px; border-bottom: 1px solid var(--border); }
.tenji-table td { text-align: center; padding: 5px 6px; border-bottom: 1px solid var(--border); color: var(--text); }
.tenji-table td:nth-child(2) { text-align: left; font-family: 'Noto Sans JP', sans-serif; font-size: 0.8rem; }
.tenji-table tr:last-child td { border-bottom: none; }
.tenji-table tr:hover td { background: var(--bg3); }
.tenji-best { color: var(--red); font-weight: 700; }
.tenji-rank1 { color: var(--accent); font-weight: 700; }
.tenji-waiting { text-align: center; color: var(--text3); font-size: 0.8rem; padding: 0.75rem 0; }
.tenji-delta-plus  { color: #22c55e; font-size: 11px; font-weight: 600; }
.tenji-delta-minus { color: #ef4444; font-size: 11px; font-weight: 600; }
.tenji-tilt { font-size: 0.72rem; color: var(--text3); }

/* COMMENT */
.comment-section { border-top: 1px solid var(--border); padding: 0.875rem 0.75rem 0.5rem; }
.comment-title { font-size: 0.78rem; font-weight: 700; color: var(--text3); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 6px; }
.comment-badge { font-size: 10px; background: var(--green); color: #fff; border-radius: 4px; padding: 1px 5px; }
.comment-row { display: grid; grid-template-columns: 28px 5.5em 1fr; gap: 6px 8px; align-items: baseline; font-size: 0.82rem; padding: 5px 0; border-bottom: 1px solid var(--border); }
.comment-row:last-child { border-bottom: none; }
.comment-name { font-weight: 600; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.8rem; }
.comment-text { color: var(--text); font-size: 0.8rem; line-height: 1.5; }
.comment-empty { color: var(--text3); font-size: 0.8rem; font-style: italic; }
.comment-keyword { display: inline-block; background: var(--orange2); color: var(--orange); border-radius: 3px; font-size: 10px; font-weight: 700; padding: 0 4px; margin-right: 3px; vertical-align: middle; }
.comment-keyword.good { background: var(--green2); color: var(--green); }
.comment-keyword.bad  { background: var(--red2); color: var(--red); }

/* BUY */
.buy-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 1.25rem; border-top: 1px solid var(--border); background: var(--bg3); }
@media (max-width: 480px) { .buy-grid { grid-template-columns: 1fr; } }
.buy-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: .875rem 1rem; box-shadow: 0 6px 18px rgba(0,40,90,0.08); }
.buy-card-title { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text3); margin-bottom: 10px; }
.buy-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--border); }
.buy-row:last-child { border-bottom: none; }
.buy-label { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; min-width: 30px; text-align: center; }
.bl-honmei { background: rgba(61,214,140,.15); color: var(--green); }
.bl-taikou { background: rgba(245,200,66,.12); color: var(--gold); }
.bl-ana, .bl-gyaku { background: rgba(255,90,90,.1); color: #ff8a8a; }
.buy-combo { font-family: var(--mono); font-size: 15px; font-weight: 500; flex: 1; letter-spacing: 2px; }
.buy-weight { display: flex; gap: 2px; }
.wdot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.wdot.empty { background: var(--bg4); }

.scenario-bar { padding: .75rem 1.25rem; border-bottom: 1px solid var(--border); font-size: 13px; display: flex; align-items: center; gap: 10px; }
.scenario-bar.safe { background: rgba(61,214,140,.07); border-left: 3px solid var(--green); }
.scenario-bar.warn { background: rgba(255,90,90,.07); border-left: 3px solid var(--red); }
.scenario-bar.mix  { background: rgba(79,124,255,.07); border-left: 3px solid var(--accent); }


/* 過去レース（締め切り済み）*/
.race-btn.past { opacity: 0.38; filter: grayscale(0.4); }
.race-btn.past .race-btn-no { color: var(--text3); }

/* 更新ボタン */
#refresh-btn {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--bg3);
  color: var(--accent);
  border: 1px solid var(--border2);
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.2s, background 0.2s;
  flex-shrink: 0;
}
#refresh-btn:active { transform: scale(0.9); }
@keyframes spin { to { transform: rotate(360deg); } }
#refresh-btn.spinning { animation: spin 0.7s linear infinite; color: var(--accent2); }

/* TOAST */
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(60px); background: var(--bg3); border: 1px solid var(--border2); border-radius: var(--radius); padding: .625rem 1.25rem; font-size: 13px; transition: transform .3s ease; z-index: 200; pointer-events: none; }
.toast.show { transform: translateX(-50%) translateY(0); }

#buy-panel, #comment-panel { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 1.25rem; box-shadow: 0 6px 18px rgba(0,40,90,0.08); }

/* ── MOBILE RESPONSIVE ── */
@media (max-width: 600px) {
  html { font-size: 14px; }

  .container { padding: 0.75rem 0.5rem; }

  /* 確率テーブルをスマホ幅に収める */
  .prob-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .prob-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
  .prob-table th, .prob-table td { padding: 4px 4px !important; white-space: nowrap; }
  .prob-table .col-name { max-width: 5em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ヘッダタイトル・バッジ行 */
  .status-badges { display: flex; flex-wrap: wrap; gap: 4px; padding: 0.4rem 0.75rem; border-bottom: 1px solid var(--border); }
  .status-badges > span { font-size: 10px !important; }

  /* シナリオバー */
  .scenario-header { padding: 0.6rem 0.75rem !important; gap: 6px !important; }
  .scenario-header .scenario-bar { font-size: 12px !important; padding: 4px 8px !important; }
  .scenario-header .mode-desc { font-size: 11px !important; }

  /* 3連単グリッドをシングルカラムに */
  .buy3-inner { grid-template-columns: 1fr !important; }

  /* buy-card */
  .buy-card { padding: 0.625rem 0.75rem; }
  .buy-combo { font-size: 14px !important; letter-spacing: 1px !important; }
  .buy-grid { padding: 0.75rem !important; gap: 8px !important; }

  /* detail panel */
  .bt-head-simple, .bt-row { padding: 0.4rem 0.75rem !important; }
  .bt-row { font-size: 12px; }
}
</style>
</head>

    <div class="logo-icon">⛵</div>

  </div>
  <div style="display:flex;align-items:center;gap:10px">
    <div class="header-meta" id="header-meta"></div>
    <button id="refresh-btn" onclick="doRefresh()" title="更新">↻</button>
  </div>

</div>

<div class="toast" id="toast"></div>

function buildTenjiSection(rno, boats){
  const SLUG = {
    "桐生":"kiryu","戸田":"toda","江戸川":"edogawa","平和島":"heiwajima",
    "多摩川":"tamagawa","浜名湖":"hamanako","蒲郡":"gamagori","常滑":"tokoname",
    "津":"tsu","三国":"mikuni","びわこ":"biwako","住之江":"suminoe",
    "尼崎":"amagasaki","鳴門":"naruto","丸亀":"marugame","児島":"kojima",
    "宮島":"miyajima","徳山":"tokuyama","下関":"shimonoseki","若松":"wakamatsu",
    "芦屋":"ashiya","福岡":"fukuoka","唐津":"karatsu","大村":"omura"
  };
  const slug = SLUG[DATA.venue] || DATA.venue;
  const key  = tenjiKey(slug, DATA.date, rno);
  const cached = _tenjiCache[key];

  if(cached === undefined || cached === null){
    return `<div class="tenji-section">
      <div class="tenji-title">オリジナル展示 <span class="tenji-badge waiting">未取得</span></div>
      <div class="tenji-waiting">展示データなし（締め切り前 or 取得待ち）</div>
    </div>`;
  }

  const lap1vals   = boats.map(b=>cached[b.boat]?.lap1).filter(v=>v!=null);
  const mawarivals = boats.map(b=>cached[b.boat]?.mawari).filter(v=>v!=null);
  const chokuvals  = boats.map(b=>cached[b.boat]?.chokusen).filter(v=>v!=null);
  const tenjivals  = boats.map(b=>cached[b.boat]?.tenji).filter(v=>v!=null);
  const bestLap1   = lap1vals.length   ? Math.min(...lap1vals)   : null;
  const bestMawari = mawarivals.length ? Math.min(...mawarivals) : null;
  const bestChoku  = chokuvals.length  ? Math.min(...chokuvals)  : null;
  const bestTenji  = tenjivals.length  ? Math.min(...tenjivals)  : null;
  const fetched = cached["__fetched_at"] || "";
  const rows = boats.map(bt => {
    const bn = bt.boat;
    const t  = cached[bn];
    if(!t) return `<tr><td>${bn}</td><td>${bt.name}</td><td colspan="5">—</td></tr>`;
    const f = (v, best) => v==null ? '—' : `<span class="${v===best?'tenji-best':''}">${v.toFixed(2)}</span>`;
    const rankCls = t.tenji_rank===1 ? 'tenji-rank1' : '';
    const tilt = t.tilt != null ? `<span class="tenji-tilt">${t.tilt>0?'+':''}${t.tilt}</span>` : '';
    return `<tr>
      <td><span class="boat-circle b${bn}" style="width:22px;height:22px;font-size:11px;line-height:22px;display:inline-flex;align-items:center;justify-content:center">${bn}</span></td>
      <td>${bt.name}</td>
      <td>${f(t.lap1, bestLap1)}</td>
      <td>${f(t.mawari, bestMawari)}</td>
      <td>${f(t.chokusen, bestChoku)}</td>
      <td><span class="${rankCls}">${f(t.tenji, bestTenji)}</span></td>
      <td>${tilt}</td>
    </tr>`;
  }).join('');
  return `<div class="tenji-section">
    <div class="tenji-title">オリジナル展示 <span class="tenji-badge">取得済み ${fetched}</span></div>
    <table class="tenji-table">
      <thead><tr>
        <th>枠</th><th style="text-align:left">選手</th>
        <th>1周</th><th>回り足</th><th>直線</th><th>展示</th><th>チルト</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function calcTenjiDelta(boats, tenjiData){
  if(!tenjiData) return null;
  const times = boats.map(b=>tenjiData[b.boat]?.tenji??null);
  if(times.some(v=>v==null)) return null;
  const n = times.length;
  const avg = times.reduce((a,b)=>a+b,0)/n;
  const std = Math.sqrt(times.reduce((a,b)=>a+(b-avg)**2,0)/n);
  if(std===0) return null;
  const coefs = times.map(t=>{
    const h = 50+((avg-t)/std)*10;
    if(h>=60) return 1.15; if(h>=55) return 1.08;
    if(h>=45) return 1.00; if(h>=40) return 0.93; return 0.85;
  });
  const rawScores = boats.map((b,i)=>b.prob*coefs[i]);
  const total = rawScores.reduce((a,b)=>a+b,0);
  if(total===0) return null;
  const newProbs = rawScores.map(s=>s/total);
  const deltaMap = {};
  boats.forEach((b,i)=>{ deltaMap[b.boat]=newProbs[i]-b.prob; });
  return deltaMap;
}

function updateTenjiDelta(venue, date, rno){
  if(!DATA||!DATA.races[rno]) return;
  const SLUG = {
    "桐生":"kiryu","戸田":"toda","江戸川":"edogawa","平和島":"heiwajima",
    "多摩川":"tamagawa","浜名湖":"hamanako","蒲郡":"gamagori","常滑":"tokoname",
    "津":"tsu","三国":"mikuni","びわこ":"biwako","住之江":"suminoe",
    "尼崎":"amagasaki","鳴門":"naruto","丸亀":"marugame","児島":"kojima",
    "宮島":"miyajima","徳山":"tokuyama","下関":"shimonoseki","若松":"wakamatsu",
    "芦屋":"ashiya","福岡":"fukuoka","唐津":"karatsu","大村":"omura"
  };
  const slug = SLUG[DATA.venue]||DATA.venue||'';
  const key = tenjiKey(slug, date||DATA.date, rno);
  const tenjiData = _tenjiCache[key];
  if(!tenjiData) return;
  const boats = DATA.races[rno].boats;
  const deltaMap = calcTenjiDelta(boats, tenjiData);
  if(!deltaMap) return;
  boats.forEach(b=>{ b.tenji_delta=deltaMap[b.boat]; });
}

  let t = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  COMMENT_KEYWORDS_GOOD.forEach(kw=>{ t = t.replaceAll(kw, `<span class="comment-keyword good">${kw}</span>`); });
  COMMENT_KEYWORDS_BAD.forEach(kw=>{  t = t.replaceAll(kw, `<span class="comment-keyword bad">${kw}</span>`); });
  return t;
}

// ── 展開推定（1着率のみ）──
//
// 【役割】venue_kimari × prob × 個人kimari適性 × 相対評価 で各艇の1着率(tenkai_prob)を算出する。
// tenkai_remaining は不使用（削除済み）。2着率は inn_2place（イン逃げ時枠別2着率）を使う。
//
// MASTER_EXT なし → prob をそのまま tenkai_prob にコピーして返す
// MASTER_EXT あり → 決まり手別有効コース制約（ハード除外＋個人適性）＋
//                   1コースの被kimari × 攻め手の kimari による相対評価補正を適用
//
// 【修正A】個人kimari係数にruns信頼度重みを付与（runs<50は中立値1.0に引き寄せ）
// 【修正C】1コースの被kimari率でvKimariを動的補正（差され率→差し展開UP等）
//
// 恵まれ（転覆等による繰り上がり）は予測不可のため除外。
//
function calcTenkaiProbs(boats, arek){
  // ── MASTER_EXT なし ──
  if(!MASTER_EXT || !MASTER_EXT.venue_kimari){
    return [...boats].map(b=>({...b, tenkai_prob:b.prob})).sort((a,b)=>b.tenkai_prob-a.tenkai_prob);
  }

  const venue   = DATA.venue;
  const vKimari = MASTER_EXT.venue_kimari[venue];

  // 会場データがなければ従来ロジック
  if(!vKimari){
    return [...boats].map(b=>({...b, tenkai_prob:b.prob})).sort((a,b)=>b.tenkai_prob-a.tenkai_prob);
  }

  // ── 決まり手ごとのハード除外コース（物理的に絶対ありえない）──
  // 恵まれは除外（転覆等による繰り上がりのため予測不可）
  const KIMARI_HARD_EXCLUDE = {
    '逃げ':       new Set(['2','3','4','5','6']),
    '差し':       new Set(['1']),
    'まくり':     new Set(['1']),
    'まくり差し': new Set(['1','2']),
    '抜き':       new Set(),
  };

  // ── グレーゾーン：個人kimari%が閾値以上なら有効とみなす ──
  const KIMARI_SOFT_THRESHOLD = {
    'まくり': {'2': 0.05},   // 2コースのまくりは個人実績5%以上で有効
    '抜き':   {'1': 0.03},   // 1コースの抜きは個人実績3%以上で有効
  };

  // 相対評価補正の上下限（極端に振れすぎないよう制限）
  const RELATIVE_MIN = 0.5;
  const RELATIVE_MAX = 2.0;

  // 選手のコース別kimari%をマスタから取得するヘルパー
  function getPersonalKimari(boatName, courseStr, kimariType){
    return MASTER_EXT?.course_master?.[boatName]?.[courseStr]?.kimari?.[kimariType] ?? 0;
  }

  // 1コース選手の被kimari%を取得するヘルパー
  function getPersonal被Kimari(boatName, hiKimariType){
    return MASTER_EXT?.course_master?.[boatName]?.['1']?.['被kimari']?.[hiKimariType] ?? null;
  }

  // 選手×決まり手の有効判定
  function isValidFirst(boat, kimari){
    const wc  = String(boat.boat);
    const exc = KIMARI_HARD_EXCLUDE[kimari];
    if(!exc) return false;
    if(exc.has(wc)) return false;
    const soft = KIMARI_SOFT_THRESHOLD[kimari];
    if(soft && wc in soft){
      const threshold = soft[wc];
      const personal  = getPersonalKimari(boat.name, wc, kimari);
      return personal >= threshold;
    }
    return true;
  }

  // ── 相対評価補正係数の計算 ──
  //
  // 1コース選手の被kimari率 × 攻め手選手のkimari率 を掛け合わせ、
  // 全体平均との比率で補正係数を算出する。
  //
  // 例: 差し展開
  //   1コースの差され率=0.20、2コースの差し率=0.45
  //   → 積 = 0.09
  //   全6艇の同積の平均が0.05なら係数 = 0.09/0.05 = 1.8（差しが決まりやすい）
  //
  // 逃げ展開は1コースの逃げ率（攻め手）と差され率（被）の両方で評価:
  //   逃げ率が高く差され率が低いほど係数UP
  //
  // 対応表:
  //   決まり手       攻め手kimari    1コース被kimari
  //   逃げ           逃げ率          差され率(逆数)・捲られ率(逆数)・捲り差され率(逆数)
  //   差し           差し率          差され率
  //   まくり         まくり率        捲られ率
  //   まくり差し     まくり差し率    捲り差され率
  //   抜き           抜き率          (被kimariなし → 補正なし)
  //
  function calcRelativeCoef(winner, kimari, boat1){
    if(!boat1) return 1.0;  // 1コース艇がいない → 補正なし

    const wc = String(winner.boat);

    if(kimari === '逃げ'){
      // 逃げ展開は1コース選手の逃げ率のみで評価する。
      // ※被kimari（差され率等）は winner === boat1 の同一人物参照になるため使用しない。
      //   kuzureRate = 差され率+捲られ率+捲り差され率 は合計が1.0を超えやすく、
      //   1.0 - kuzureRate が負になって係数が極小→スコアがほぼ0になるバグの原因。
      const nigeRate = getPersonalKimari(winner.name, '1', '逃げ');
      return nigeRate > 0 ? nigeRate : 1.0;
    }

    if(kimari === '差し'){
      const attackRate = getPersonalKimari(winner.name, wc, '差し');
      const defRate    = getPersonal被Kimari(boat1.name, '差され');
      if(defRate === null) return attackRate || 1.0;
      return attackRate * defRate;
    }

    if(kimari === 'まくり'){
      const attackRate = getPersonalKimari(winner.name, wc, 'まくり');
      const defRate    = getPersonal被Kimari(boat1.name, '捲られ');
      if(defRate === null) return attackRate || 1.0;
      return attackRate * defRate;
    }

    if(kimari === 'まくり差し'){
      const attackRate = getPersonalKimari(winner.name, wc, 'まくり差し');
      const defRate    = getPersonal被Kimari(boat1.name, '捲り差され');
      if(defRate === null) return attackRate || 1.0;
      return attackRate * defRate;
    }

    // 抜き・その他 → 補正なし
    return 1.0;
  }

  // 1コース艇を特定
  const boat1 = boats.find(b => b.boat === 1) || null;

  // ── 修正C: 1コース選手の被kimari率でvKimariを動的補正 ──
  //
  // 1コース選手の「差され率・捲られ率・捲り差され率」が高いほど
  // 対応する展開の事前確率を底上げする。
  //
  // 例: 差され率0.30（高い）→ 差し展開の確率を最大+50%補正
  //     捲られ率0.05（低い）→ まくり展開はほぼそのまま
  //
  // 補正強度は hiKimariStrength で制御（0.0=補正なし、1.0=最大補正）
  // 被kimariデータがない場合は vKimari をそのまま使用。
  //
  const hiKimariStrength = 1.5; // 被kimari率1.0で最大1.5倍まで補正
  let adjustedVKimari = { ...vKimari };

  if(boat1){
    const hiKimari = MASTER_EXT?.course_master?.[boat1.name]?.['1']?.['被kimari'];
    const boat1Runs = MASTER_EXT?.course_master?.[boat1.name]?.['1']?.runs ?? 0;
    // runs < 20 はデータ不足なので補正しない
    if(hiKimari && boat1Runs >= 20){
      // 被kimari率をどれだけ信頼するか（50走で信頼度1.0）
      const hiTrust = Math.min(boat1Runs / 50, 1.0);

      const sasareRate     = (hiKimari['差され']     ?? null);
      const makurareRate   = (hiKimari['捲られ']     ?? null);
      const makurisasareRate = (hiKimari['捲り差され'] ?? null);

      if(sasareRate !== null){
        // 差し: 被差され率が高いほど差し展開確率を上げる
        adjustedVKimari['差し'] = (vKimari['差し'] || 0)
          * (1 + hiTrust * sasareRate * hiKimariStrength);
      }
      if(makurareRate !== null){
        // まくり: 被捲られ率が高いほどまくり展開確率を上げる
        adjustedVKimari['まくり'] = (vKimari['まくり'] || 0)
          * (1 + hiTrust * makurareRate * hiKimariStrength);
      }
      if(makurisasareRate !== null){
        // まくり差し: 被捲り差され率が高いほどまくり差し展開確率を上げる
        adjustedVKimari['まくり差し'] = (vKimari['まくり差し'] || 0)
          * (1 + hiTrust * makurisasareRate * hiKimariStrength);
      }
      // 逃げ: 被kimariの合計が高いほど逃げ展開確率を下げる
      const totalHiRate = (sasareRate ?? 0) + (makurareRate ?? 0) + (makurisasareRate ?? 0);
      const nigeRate = getPersonalKimari(boat1.name, '1', '逃げ');
      if(nigeRate > 0){
        // 逃げ率が高く被kimari合計が低いほど逃げ展開を維持
        const nigeBoost = nigeRate / Math.max(nigeRate + totalHiRate, 0.01);
        adjustedVKimari['逃げ'] = (vKimari['逃げ'] || 0) * (0.5 + 0.5 * nigeBoost * 2);
      }

      // 再正規化（合計を1.0に揃える）
      const adjTotal = Object.values(adjustedVKimari).reduce((s, v) => s + v, 0);
      if(adjTotal > 0){
        for(const k of Object.keys(adjustedVKimari)){
          adjustedVKimari[k] = adjustedVKimari[k] / adjTotal;
        }
      }
    }
  }

  const kimariTypes = Object.keys(adjustedVKimari).filter(k => adjustedVKimari[k] > 0 && k in KIMARI_HARD_EXCLUDE);

  // ── 各艇の決まり手適性スコアを prob に乗算する係数を算出 ──
  //
  // 設計方針:
  //   tenkai_prob ∝ prob × Σ(kimariProb × normalizedCoef)
  //
  //   prob（基本強さ）を起点に、決まり手適性で上下補正する。
  //   外コース勢が弱ければ1コース艇の prob がそのまま反映され、
  //   外コース勢に適性があればその分だけ相対的に上がる。
  //
  // normalizedCoef は有効艇の平均を1.0基準に正規化しているため、
  // 全艇の補正係数の平均は常に1.0付近に揃い、prob の合計スケールを保持する。

  // まず各艇の「決まり手加重適性係数」を計算
  const kimariCoefSum = {};
  boats.forEach(b => { kimariCoefSum[b.boat] = 0; });

  for(const kimari of kimariTypes){
    const kimariProb = adjustedVKimari[kimari];  // 修正C: adjustedVKimariを使用
    if(!kimariProb || kimariProb <= 0) continue;

    // 有効艇の relCoef を取得
    const relCoefs = {};
    for(const b of boats){
      if(!isValidFirst(b, kimari)){ relCoefs[b.boat] = 0; continue; }
      const rawCoef = calcRelativeCoef(b, kimari, boat1);
      // ── 修正A: runs数に応じて個人適性の信頼度を調整 ──
      // runs不足の選手は係数を中立値(1.0)に引き寄せる。
      // 50走で信頼度1.0（個人適性をフル反映）
      // 20走で信頼度0.4（会場平均寄り）
      // 20走未満は reliable=false のためここには来ないが念のため0に近づける
      const kimariRuns = MASTER_EXT?.course_master?.[b.name]?.[String(b.boat)]?.runs ?? 0;
      const personalTrust = Math.min(kimariRuns / 50, 1.0);
      // 信頼度が低いほど中立値(1.0)に引き戻す
      relCoefs[b.boat] = rawCoef * personalTrust + 1.0 * (1 - personalTrust);
    }

    // 有効艇の平均 relCoef（1.0基準に正規化するため）
    const validBoats = boats.filter(b => isValidFirst(b, kimari));
    if(validBoats.length === 0) continue;
    const avgCoef = validBoats.reduce((s, b) => s + relCoefs[b.boat], 0) / validBoats.length;
    if(avgCoef <= 0) continue;

    for(const b of boats){
      if(!isValidFirst(b, kimari)) continue;
      // 平均を1.0基準に正規化してクリップ
      const normalizedCoef = Math.min(RELATIVE_MAX, Math.max(RELATIVE_MIN, relCoefs[b.boat] / avgCoef));
      // 決まり手比率で重み付けして加算（合計 ≈ 1.0 になる）
      kimariCoefSum[b.boat] += kimariProb * normalizedCoef;
    }
    // 有効外の艇（ハード除外）は平均的な係数として kimariProb を加算
    // → 「その展開では勝てないが存在は無視しない」扱い
    for(const b of boats){
      if(isValidFirst(b, kimari)) continue;
      kimariCoefSum[b.boat] += kimariProb * RELATIVE_MIN;
    }
  }

  // prob × 決まり手適性係数 → 正規化
  const scores = {};
  boats.forEach(b => { scores[b.boat] = b.prob * (kimariCoefSum[b.boat] || RELATIVE_MIN); });

  const total = Object.values(scores).reduce((a,b)=>a+b, 0) || 1;
  return [...boats]
    .map(b => ({...b, tenkai_prob: scores[b.boat] / total}))
    .sort((a,b) => b.tenkai_prob - a.tenkai_prob);
}

// ── 条件付き2着率推定 ──
//
// 【役割】inn_2place（イン逃げ時の会場別枠別2着率）を使い、
//         各艇の「2着に来る期待スコア」を算出する。
//
// アルゴリズム:
//   1. 1コースが逃げで1着になる確率 = vKimari["逃げ"] × 1コースのtenkai_prob比率
//   2. その場合の各コースの2着率 = inn_2place[コース]
//   3. それ以外の展開（差し・まくり等）の場合は tenkai_prob の相対値で代用
//
// 返り値: { [boat番号]: place2スコア（正規化済み 0-1） }
//
function calcPlace2Probs(boats, ranked){
  const place2Score = {};
  ranked.forEach(b => { place2Score[b.boat] = 0; });

  const tpMap = {};
  ranked.forEach(b => { tpMap[b.boat] = b.tenkai_prob; });

  // inn_2place を取得（オブジェクト形式: {"2": 0.324, ...}）
  const inn2Place = (DATA.inn_data || {}).inn_2place || {};
  const hasInn2   = Object.keys(inn2Place).length > 0;

  // venue_kimari があれば逃げ展開確率を取得
  const vKimari = MASTER_EXT?.venue_kimari?.[DATA.venue] || null;
  const nigeProb = vKimari?.['逃げ'] ?? 0.45;  // なければ0.45をデフォルト

  // 1コース艇の tenkai_prob 比率（1コースが逃げで勝つ条件付き確率への按分）
  const boat1 = ranked.find(b => b.boat === 1);
  const tp1   = boat1 ? boat1.tenkai_prob : 0;
  const totalTP = ranked.reduce((s, b) => s + b.tenkai_prob, 0) || 1;

  // 逃げ展開（1コース1着）の確率
  const nigeWinProb = nigeProb * (tp1 / totalTP);

  // 逃げ展開での2着: inn_2place を直接使用
  if(hasInn2 && nigeWinProb > 0){
    for(const b of ranked){
      if(b.boat === 1) continue;
      const sc  = String(b.boat);
      const p2  = inn2Place[sc] ?? null;
      if(p2 != null){
        place2Score[b.boat] += nigeWinProb * p2;
      } else {
        // inn_2place にないコースは tenkai_prob 相対値でフォールバック
        const othersTP = ranked.filter(r => r.boat !== 1).reduce((s, r) => s + r.tenkai_prob, 0) || 1;
        place2Score[b.boat] += nigeWinProb * (tpMap[b.boat] / othersTP);
      }
    }
  }

  // 非逃げ展開（差し・まくり等）の2着: tenkai_prob 相対値で算出
  const nonNigeProb = 1.0 - nigeWinProb;
  if(nonNigeProb > 0){
    for(const winner of ranked){
      // 非逃げ展開での1着確率（逃げ分を除いた比率）
      const winnerProb = nonNigeProb * (tpMap[winner.boat] / totalTP);
      if(winnerProb <= 0) continue;
      const othersTotal = ranked.filter(b => b.boat !== winner.boat)
                                .reduce((s, b) => s + b.tenkai_prob, 0) || 1;
      for(const self of ranked){
        if(self.boat === winner.boat) continue;
        place2Score[self.boat] += winnerProb * (tpMap[self.boat] / othersTotal);
      }
    }
  }

  // 正規化
  const p2Total = Object.values(place2Score).reduce((a, b) => a + b, 0) || 1;
  const res = {};
  ranked.forEach(b => { res[b.boat] = place2Score[b.boat] / p2Total; });
  return res;
}

// venue_kimari が有効かどうか判定（1着率補正に使う）
function hasMasterExt(){
  return !!(MASTER_EXT &&
    MASTER_EXT.venue_kimari &&
    Object.keys(MASTER_EXT.venue_kimari).length > 0);
}
function tenkaiLabel(arek){
  if(arek < 40) return { label:'逃げ展開', cls:'safe', icon:'🏃' };
  if(arek > 60) return { label:'まくり展開', cls:'warn', icon:'💥' };
  return { label:'混戦展開', cls:'mix', icon:'🔀' };
}
function combo2(a,b){ return `${Math.min(a,b)}＝${Math.max(a,b)}`; }

// ── 展開シナリオセクション生成 ──
//
// 1着率上位3艇 × 各決まり手の発生確率 × 条件付き2着率 を展開シナリオとして表示。
// 2着率: 逃げ展開(1コース1着)のみ inn_2place を使用、それ以外は tenkai_prob 相対値。
//
function buildScenarioSection(ranked2, place2Map, rawBoats){
  if(!MASTER_EXT || !MASTER_EXT.venue_kimari) return '';

  const venue   = DATA.venue;
  const vKimari = MASTER_EXT.venue_kimari[venue];
  if(!vKimari) return '';

  // inn_2place（オブジェクト形式: {"2": 0.324, ...}）
  const inn2Place = (DATA.inn_data || {}).inn_2place || {};

  const KIMARI_HARD_EXCLUDE = {
    '逃げ':       new Set(['2','3','4','5','6']),
    '差し':       new Set(['1']),
    'まくり':     new Set(['1']),
    'まくり差し': new Set(['1','2']),
    '抜き':       new Set(),
  };
  function isValidFirst(boat, kimari){
    const wc = String(boat.boat);
    const exc = KIMARI_HARD_EXCLUDE[kimari];
    if(!exc) return false;
    return !exc.has(wc);
  }

  const kimariLabel = { '逃げ':'逃げ', '差し':'差し', 'まくり':'まくり', 'まくり差し':'まくり差し', '抜き':'抜き' };

  // ── 修正C（シナリオ表示側）: 1コース被kimariでvKimariを補正 ──
  const boat1Scenario = rawBoats.find(b => b.boat === 1) || null;
  let scenarioVKimari = { ...vKimari };
  if(boat1Scenario){
    const hiKimari = MASTER_EXT?.course_master?.[boat1Scenario.name]?.['1']?.['被kimari'];
    const boat1Runs = MASTER_EXT?.course_master?.[boat1Scenario.name]?.['1']?.runs ?? 0;
    if(hiKimari && boat1Runs >= 20){
      const hiTrust = Math.min(boat1Runs / 50, 1.0);
      const hiStr   = 1.5;
      const sasareRate       = hiKimari['差され']     ?? null;
      const makurareRate     = hiKimari['捲られ']     ?? null;
      const makurisasareRate = hiKimari['捲り差され'] ?? null;
      if(sasareRate !== null)
        scenarioVKimari['差し'] = (vKimari['差し'] || 0) * (1 + hiTrust * sasareRate * hiStr);
      if(makurareRate !== null)
        scenarioVKimari['まくり'] = (vKimari['まくり'] || 0) * (1 + hiTrust * makurareRate * hiStr);
      if(makurisasareRate !== null)
        scenarioVKimari['まくり差し'] = (vKimari['まくり差し'] || 0) * (1 + hiTrust * makurisasareRate * hiStr);
      const totalHiRate = (sasareRate ?? 0) + (makurareRate ?? 0) + (makurisasareRate ?? 0);
      const nigeRate = MASTER_EXT?.course_master?.[boat1Scenario.name]?.['1']?.kimari?.['逃げ'] ?? 0;
      if(nigeRate > 0){
        const nigeBoost = nigeRate / Math.max(nigeRate + totalHiRate, 0.01);
        scenarioVKimari['逃げ'] = (vKimari['逃げ'] || 0) * (0.5 + 0.5 * nigeBoost * 2);
      }
      const adjTotal = Object.values(scenarioVKimari).reduce((s, v) => s + v, 0);
      if(adjTotal > 0){
        for(const k of Object.keys(scenarioVKimari))
          scenarioVKimari[k] = scenarioVKimari[k] / adjTotal;
      }
    }
  }

  const kimariTypes = Object.keys(scenarioVKimari).filter(k => scenarioVKimari[k] > 0 && k in KIMARI_HARD_EXCLUDE);

  // 1着率上位3艇
  const top3 = ranked2.slice(0, 3);

  // 各1着候補について決まり手別の発生確率を計算
  const scenarioProb = {};
  for(const winner of top3){
    scenarioProb[winner.boat] = {};
    const validKimariTotal = kimariTypes
      .filter(k => isValidFirst(winner, k))
      .reduce((s, k) => s + (scenarioVKimari[k] || 0), 0);
    if(validKimariTotal <= 0) continue;
    for(const kimari of kimariTypes){
      if(!isValidFirst(winner, kimari)) continue;
      scenarioProb[winner.boat][kimari] = winner.tenkai_prob * (scenarioVKimari[kimari] / validKimariTotal);
    }
  }

  // 各シナリオのHTML生成
  const boatCircle = (n) =>
    `<span class="boat-circle b${n}" style="width:20px;height:20px;font-size:10px;line-height:20px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0">${n}</span>`;

  const scenarioBlocks = top3.map((winner, wi) => {
    const wc = String(winner.boat);
    const medals = ['🥇','🥈','🥉'];

    const scenarios = kimariTypes
      .filter(k => scenarioProb[winner.boat]?.[k] > 0.001)
      .sort((a,b) => (scenarioProb[winner.boat][b]||0) - (scenarioProb[winner.boat][a]||0));

    if(scenarios.length === 0) return '';

    const scenarioRows = scenarios.map(kimari => {
      const prob = scenarioProb[winner.boat][kimari];

      // 2着率の決定:
      //   逃げ展開(kimari==='逃げ' かつ winner.boat===1) → inn_2place を使用
      //   それ以外 → tenkai_prob 相対値でフォールバック
      const useInn2 = (kimari === '逃げ' && winner.boat === 1 && Object.keys(inn2Place).length > 0);

      const place2List = rawBoats
        .filter(b => b.boat !== winner.boat)
        .map(b => {
          const sc = String(b.boat);
          let p2;
          if(useInn2){
            p2 = inn2Place[sc] ?? null;
            if(p2 == null){
              const othersTotal = ranked2.filter(r => r.boat !== winner.boat)
                                         .reduce((s,r) => s + r.tenkai_prob, 0) || 1;
              const bt = ranked2.find(r => r.boat === b.boat);
              p2 = bt ? bt.tenkai_prob / othersTotal : 0;
            }
          } else {
            const othersTotal = ranked2.filter(r => r.boat !== winner.boat)
                                       .reduce((s,r) => s + r.tenkai_prob, 0) || 1;
            const bt = ranked2.find(r => r.boat === b.boat);
            p2 = bt ? bt.tenkai_prob / othersTotal : 0;
          }
          return { boat: b.boat, name: b.name, p2 };
        })
        .sort((a,b) => b.p2 - a.p2);

      const p2Cells = place2List.map(item =>
        `<span style="display:inline-flex;align-items:center;gap:3px;margin-right:8px;white-space:nowrap">
          ${boatCircle(item.boat)}
          <span style="font-size:11px;font-family:var(--mono);color:var(--text)">${(item.p2*100).toFixed(0)}%</span>
        </span>`
      ).join('');

      return `<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);flex-wrap:wrap">
        <span style="font-size:11px;font-weight:700;color:var(--text2);min-width:4.5em">${kimariLabel[kimari]}</span>
        <span style="font-size:11px;font-family:var(--mono);font-weight:600;color:var(--accent2);min-width:3.5em">${(prob*100).toFixed(1)}%</span>
        <span style="font-size:10px;color:var(--text3);margin-right:4px">2着→</span>
        <span style="display:flex;align-items:center;flex-wrap:wrap;gap:4px">${p2Cells}</span>
      </div>`;
    }).join('');

    if(!scenarioRows) return '';

    return `<div style="margin-bottom:0.75rem">
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
        <span style="font-size:12px">${medals[wi]}</span>
        ${boatCircle(winner.boat)}
        <span style="font-size:13px;font-weight:700">${winner.name}</span>
        <span style="font-size:12px;font-family:var(--mono);color:var(--accent2);font-weight:700">${(winner.tenkai_prob*100).toFixed(1)}%</span>
      </div>
      <div style="padding-left:0.5rem">${scenarioRows}</div>
    </div>`;
  }).filter(Boolean).join('');

  if(!scenarioBlocks) return '';

  return `<div style="padding:0.75rem 1.25rem;border-bottom:1px solid var(--border)">
    <div style="font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:10px">展開シナリオ（1着上位3艇）</div>
    ${scenarioBlocks}
  </div>`;
}

// ── renderBuy ──
function renderBuy(rno){
  const rd = DATA.races[rno];
  if(!rd) return;
  const arek     = rd.arek ?? 54.7;
  const rawBoats = rd.boats;

  // ─ STEP1: 1着率計算（venue_kimari × prob × 個人kimari適性）
  const ranked   = calcTenkaiProbs(rawBoats, arek);

  // ─ STEP2: 展示補正（展示データがあれば tenkai_prob を上書き）
  const SLUG = {
    "桐生":"kiryu","戸田":"toda","江戸川":"edogawa","平和島":"heiwajima",
    "多摩川":"tamagawa","浜名湖":"hamanako","蒲郡":"gamagori","常滑":"tokoname",
    "津":"tsu","三国":"mikuni","びわこ":"biwako","住之江":"suminoe",
    "尼崎":"amagasaki","鳴門":"naruto","丸亀":"marugame","児島":"kojima",
    "宮島":"miyajima","徳山":"tokuyama","下関":"shimonoseki","若松":"wakamatsu",
    "芦屋":"ashiya","福岡":"fukuoka","唐津":"karatsu","大村":"omura"
  };
  const slug     = SLUG[DATA.venue] || DATA.venue;
  const tKey     = tenjiKey(slug, DATA.date, rno);
  const tenjiData = _tenjiCache[tKey] || null;
  const hasTenji  = !!tenjiData;

  if(hasTenji){
    // 展示タイム偏差値 → 係数 → tenkai_prob × 係数 → 再正規化
    const times = ranked.map(b => tenjiData[b.boat]?.tenji ?? null);
    if(!times.some(v=>v==null)){
      const n   = times.length;
      const avg = times.reduce((a,v)=>a+v,0)/n;
      const std = Math.sqrt(times.reduce((a,v)=>a+(v-avg)**2,0)/n);
      if(std > 0){
        // 展示補正前の tenkai_prob を保存（相対補正列の表示に使用）
        ranked.forEach(b => { b.tenkai_prob_base = b.tenkai_prob; });
        const coefs = times.map(t=>{
          const h = 50+((avg-t)/std)*10;
          if(h>=60) return 1.15; if(h>=55) return 1.08;
          if(h>=45) return 1.00; if(h>=40) return 0.93; return 0.85;
        });
        const raw   = ranked.map((b,i)=>b.tenkai_prob*coefs[i]);
        const tot   = raw.reduce((a,v)=>a+v,0)||1;
        ranked.forEach((b,i)=>{ b.tenkai_prob = raw[i]/tot; });
        // ソートし直す
        ranked.sort((a,b)=>b.tenkai_prob-a.tenkai_prob);
      }
    }
  }

  // ─ STEP3: 2着率計算（inn_2place ベース）
  const place2Map = calcPlace2Probs(rawBoats, ranked);
  // place2Map を各ボートに付与して2着ランクを作成
  const ranked2 = [...ranked].map(b=>({...b, place2_prob: place2Map[b.boat]||0}));

  const useMaster       = hasMasterExt() && !!MASTER_EXT.venue_kimari[DATA.venue];

  const [A, B, C, D] = ranked;
  const mode    = tenkaiLabel(arek);
  const modeDesc = arek < 40
    ? `インの${A.name}（${A.boat}号）が主導権。逃げ・先マイが濃厚。`
    : arek > 60
      ? `${A.name}（${A.boat}号）軸だが、まくり・差しが入りやすい展開。`
      : `${A.name}（${A.boat}号）中心だが${B.name}（${B.boat}号）との競り合いも。`;

  const probDiff  = A.tenkai_prob - B.tenkai_prob;
  const isDualAxis = probDiff <= 0.05;

  // ─ STEP4: 2着候補を place2_prob で選ぶ関数
  function place2For(axisBoat){
    return ranked2
      .filter(bt => bt.boat !== axisBoat)
      .sort((x,y) => y.place2_prob - x.place2_prob);
  }

  // ─ STEP5: 買い目生成
  const buy3    = [];
  const buy3seen = new Set();
  function tryAdd3(first,second,third,label,lc,w){
    const key=`${first}-${second}-${third}`;
    if(first===second||second===third||first===third) return;
    if(buy3seen.has(key)) return;
    if(buy3.length>=10) return;
    buy3seen.add(key);
    buy3.push({c:`${first}−${second}−${third}`,l:label,lc,w});
  }
  const allBoats = ranked.map(b=>b.boat);

  if(!isDualAxis){
    const p2A   = place2For(A.boat);
    const P2a_  = p2A[0]||B;
    const P2b_  = p2A[1]||C;
    allBoats.filter(b=>b!==A.boat&&b!==P2a_.boat).forEach(b=>tryAdd3(A.boat,P2a_.boat,b,'本命','bl-honmei',3));
    allBoats.filter(b=>b!==A.boat&&b!==P2b_.boat).forEach(b=>tryAdd3(A.boat,P2b_.boat,b,'対抗','bl-taikou',2));
    if(arek>=45){ allBoats.filter(b=>b!==P2a_.boat&&b!==A.boat).forEach(b=>tryAdd3(P2a_.boat,A.boat,b,'逆転','bl-gyaku',1)); }
  } else {
    const p2A  = place2For(A.boat);
    const p2B  = place2For(B.boat);
    const P2a_ = p2A[0]||C;
    const P2b_ = p2A[1]||C;
    const P2Ba = p2B[0]||A;
    const P2Bb = p2B[1]||C;
    allBoats.filter(b=>b!==A.boat&&b!==P2a_.boat).forEach(b=>tryAdd3(A.boat,P2a_.boat,b,'本命','bl-honmei',3));
    tryAdd3(A.boat,P2b_.boat,P2a_.boat,'対抗','bl-taikou',2);
    allBoats.filter(b=>b!==B.boat&&b!==P2Ba.boat).forEach(b=>tryAdd3(B.boat,P2Ba.boat,b,'B軸','bl-gyaku',2));
    tryAdd3(B.boat,P2Bb.boat,P2Ba.boat,'B軸','bl-gyaku',1);
  }
  allBoats.filter(b=>b!==A.boat).forEach(second=>{
    allBoats.filter(b=>b!==A.boat&&b!==second).forEach(third=>{ if(buy3.length>=10) return; tryAdd3(A.boat,second,third,'補填','bl-ana',0); });
  });

  // 2連単（2着もplace2_probで選定）
  const buy2=[];
  const p2ForA = place2For(A.boat);
  const P2a = p2ForA[0]||B;
  const P2b = p2ForA[1]||C;
  buy2.push({c:`${A.boat}−${P2a.boat}`,l:'本命',lc:'bl-honmei',w:3});
  if(isDualAxis){
    const p2ForB = place2For(B.boat);
    buy2.push({c:`${B.boat}−${(p2ForB[0]||A).boat}`,l:'B軸',lc:'bl-gyaku',w:2});
    buy2.push({c:`${A.boat}−${P2b.boat}`,l:'対抗',lc:'bl-taikou',w:1});
  } else {
    buy2.push({c:`${A.boat}−${P2b.boat}`,l:'対抗',lc:'bl-taikou',w:2});
    if(arek>=45){ buy2.push({c:`${B.boat}−${A.boat}`,l:'逆転',lc:'bl-gyaku',w:1}); }
    else { buy2.push({c:`${A.boat}−${(p2ForA[2]||B).boat}`,l:'穴',lc:'bl-ana',w:1}); }
  }

  // ─ STEP6: 確率テーブル生成
  const probRows = ranked2.map((bt,i)=>{
    const medals=['🥇','🥈','🥉',''];
    const medal  = medals[i]||'';
    const pct    = (bt.tenkai_prob*100).toFixed(1);
    const rawPct = (bt.prob*100).toFixed(1);

    // 相対補正列（venue_kimari による補正差分）
    // tenjiがある場合は展示補正前のtenkai_prob_preを使いたいが保持していないため
    // 展示前: tenkai_prob - prob、展示後: 展示補正込みのため「—」で区別しない
    // → 常に venue_kimari補正差分 = bt.tenkai_prob_base - bt.prob を表示
    //   （tenkai_prob_base は展示補正前の値。なければ tenkai_prob で代用）
    let relCorrCell;
    if(useMaster){
      const base = bt.tenkai_prob_base !== undefined ? bt.tenkai_prob_base : bt.tenkai_prob;
      const diff = base - bt.prob;
      if(Math.abs(diff)<0.001){
        relCorrCell = `<span style="font-size:10px;color:var(--text3)">±0</span>`;
      } else {
        const sign  = diff>0?'+':'';
        const color = diff>0?'var(--green)':'var(--red)';
        relCorrCell = `<span style="font-size:10px;font-weight:600;color:${color}">${sign}${(diff*100).toFixed(1)}%</span>`;
      }
    } else {
      relCorrCell = `<span style="font-size:10px;color:var(--text3)">—</span>`;
    }

    // 展示補正列
    let tenjiCorrCell;
    if(hasTenji && bt.tenkai_prob_base !== undefined){
      const tenjiDiff = bt.tenkai_prob - bt.tenkai_prob_base;
      if(Math.abs(tenjiDiff)<0.001){
        tenjiCorrCell = `<span style="font-size:10px;color:var(--text3)">±0</span>`;
      } else {
        const sign  = tenjiDiff>0?'+':'';
        const color = tenjiDiff>0?'var(--accent)':'var(--red)';
        tenjiCorrCell = `<span style="font-size:10px;font-weight:600;color:${color}">${sign}${(tenjiDiff*100).toFixed(1)}%</span>`;
      }
    } else {
      tenjiCorrCell = `<span style="font-size:10px;color:var(--text3)">—</span>`;
    }

    return `<tr>
      <td style="text-align:center;padding:4px 3px">${medal}</td>
      <td style="padding:4px 3px"><span class="boat-circle b${bt.boat}" style="width:22px;height:22px;font-size:11px;line-height:22px;display:inline-flex;align-items:center;justify-content:center">${bt.boat}</span></td>
      <td class="col-name" style="padding:4px 4px;font-size:0.82rem">${bt.name}</td>
      <td style="padding:4px 4px;text-align:right;font-family:var(--mono);font-size:0.82rem;color:var(--text3)">${rawPct}%</td>
      <td style="padding:4px 3px;text-align:center;font-size:0.82rem">${relCorrCell}</td>
      <td style="padding:4px 3px;text-align:center;font-size:0.82rem">${tenjiCorrCell}</td>
      <td style="padding:4px 4px;text-align:right;font-family:var(--mono);font-size:0.82rem;font-weight:700;color:var(--accent2)">${pct}%</td>
    </tr>`;
  }).join('');

  const dualNote = isDualAxis
    ? `<span style="color:var(--orange);font-size:11px;font-weight:700">⚡ 僅差2頭軸（${A.boat}号・${B.boat}号 差${(probDiff*100).toFixed(1)}%）</span>`
    : '';

  // ── 会場平均率テーブル ──
  // コース1着率: inn_data.course_rates（会場平均）
  // 1－◯ 2着率: inn_data.inn_2place（会場別イン逃げ時2着率。マスタで算出済み）
  //   → データなしの場合は「—」表記（全国平均や他データへのフォールバックなし）
  const innData   = DATA.inn_data || {};
  const cRates    = innData.course_rates || [];         // index=コース番号 (1-6)
  const inn2Place = innData.inn_2place   || {};         // 会場別イン逃げ時2着率（オブジェクト: {"2": 0.324, ...}）

  // コース番号ラベル（進入コース）
  const courseLabels = ['1','2','3','4','5','6'];

  // 各コースのセル
  const courseRateCells = courseLabels.map(c => {
    const ci   = parseInt(c);
    const rate = cRates[ci];
    const pct  = rate != null ? (rate * 100).toFixed(1) + '%' : '—';
    // 1コースは強調
    const style = ci === 1
      ? 'font-weight:700;color:var(--accent2)'
      : 'color:var(--text2)';
    return `<td style="text-align:center;padding:4px 6px;font-size:12px;font-family:var(--mono);${style}">${pct}</td>`;
  }).join('');

  // イン逃げ時2着率のセル（オブジェクト形式から取得）
  const inn2Cells = courseLabels.map(c => {
    const ci   = parseInt(c);
    if(ci === 1){
      return `<td style="text-align:center;padding:4px 6px;font-size:11px;color:var(--text3)">—</td>`;
    }
    const rate = inn2Place[c] ?? null;
    const pct  = rate != null ? (rate * 100).toFixed(1) + '%' : 'データなし';
    const hi   = rate != null && rate >= 0.20;
    const style = rate == null
      ? 'color:var(--text3);font-size:11px'
      : hi ? 'font-weight:700;color:var(--green)' : 'color:var(--text2)';
    return `<td style="text-align:center;padding:4px 6px;font-size:12px;font-family:var(--mono);${style}">${pct}</td>`;
  }).join('');

  const venueStatsTable = `
    <div style="padding:0.6rem 1.25rem;border-bottom:1px solid var(--border)">
      <div style="font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--text3);margin-bottom:6px;text-transform:uppercase">
        ${DATA.venue} — 会場平均
      </div>
      <div class="prob-table-wrap">

      <div class="prob-table-wrap">

// ── renderComment ──
function renderComment(rno){
  const rd = DATA.races[rno];
  if(!rd) return;
  const boats = [...rd.boats].sort((a,b)=>a.boat-b.boat);
  const html = `<div class="detail-panel">${buildCommentSection(rno, boats)}</div>`;
  document.getElementById('comment-panel').innerHTML = html;
}

// ── タブ切り替え ──
function switchTab(name){
  ['detail','detail2','buy','comment'].forEach(t=>{
    document.getElementById(`tab-${t}`).style.display = t===name?'':'none';
  });
  document.querySelectorAll('.tab-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab===name);
  });
  if(name==='detail') renderDetail(selectedRace);
  if(name==='detail2') renderBuy(selectedRace); // 詳細予想=買い目タブと同じ内容（本番に合わせて変更可）
  if(name==='buy') renderBuy(selectedRace);
  if(name==='comment') renderComment(selectedRace);
}

function currentTabName(){
  const b = document.querySelector('.tab-btn.active');
  return b ? (b.dataset.tab||'detail') : 'detail';
}

// ── 会場タブ構築 ──
const VENUE_LIST = [
  '桐生','戸田','江戸川','平和島','多摩川','浜名湖','蒲郡','常滑',
  '津','三国','びわこ','住之江','尼崎','鳴門','丸亀','児島',
  '宮島','徳山','下関','若松','芦屋','福岡','唐津','大村'
];

function buildVenueTabs(){
  const tabs = document.getElementById('venue-tabs');
  tabs.innerHTML = '';
  VENUE_LIST.forEach(v => {
    const btn = document.createElement('button');
    btn.className = 'vtab';
    btn.textContent = v;
    btn.dataset.venue = v;
    const isLoaded = !!ALL_DATA[v];
    if(isLoaded) btn.classList.add('loaded');
    else { btn.style.opacity = '0.35'; btn.style.cursor = 'default'; }
    if(v === currentVenue) btn.classList.add('active');
    btn.onclick = () => {
      if(!ALL_DATA[v]) return;
      currentVenue = v;
      DATA = ALL_DATA[v];
      selectedRace = findCurrentRace(DATA.races);
      document.getElementById('header-meta').innerHTML = `<strong>${v}</strong> — ${DATA.date||''}`;
      document.querySelectorAll('.vtab').forEach(b => b.classList.toggle('active', b.dataset.venue===v));
      // FLYING_DATAはauto_pushで埋め込み済みのためfetch不要
      buildRaceBar();
      selectRace(selectedRace);
    };
    tabs.appendChild(btn);
  });
}

// ── レース選択バー ──

// 現在時刻に最も近い「これから／直近」のレースを返す
function findCurrentRace(races){
  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const entries = Object.entries(races).sort((a,b)=>+a[0]-+b[0]);

  // 未来のレースがあれば最初のものを返す
  for(const [rno, rd] of entries){
    if(!rd.time || !/^\d{1,2}:\d{2}$/.test(rd.time.trim())) continue;
    const [h, m] = rd.time.trim().split(':').map(Number);
    if(h * 60 + m >= nowMin) return parseInt(rno);
  }
  // 全部過去なら最後のレースを返す
  return parseInt(entries[entries.length - 1][0]) || 1;
}
function isRacePast(timeStr){
  if(!timeStr || !/^\d{1,2}:\d{2}$/.test(timeStr.trim())) return false;
  const now = new Date();
  const [h, m] = timeStr.trim().split(':').map(Number);
  const raceMin = h * 60 + m;
  const nowMin  = now.getHours() * 60 + now.getMinutes();
  return nowMin > raceMin;
}

function buildRaceBar(){
  const bar = document.getElementById('race-bar');
  bar.innerHTML = '';
  Object.entries(DATA.races).sort((a,b)=>+a[0]-+b[0]).forEach(([rno,rd])=>{
    const btn = document.createElement('button');
    const past = isRacePast(rd.time);
    const hasInsuf = rd.boats && rd.boats.some(b=>b.dq==='insufficient');
    btn.className = 'race-btn' + (parseInt(rno)===selectedRace?' active':'') + (past?' past':'');
    btn.id = `rc-${rno}`;
    btn.innerHTML = `<span class="race-btn-no">${rno}R</span><span class="race-btn-time">${rd.time||''}</span>${hasInsuf?'<span style="font-size:9px;color:var(--orange)">⚠</span>':''}`;
    btn.onclick = ()=>{ selectRace(parseInt(rno)); };
    bar.appendChild(btn);
  });
}

function doRefresh(){
  const btn = document.getElementById('refresh-btn');
  if(btn) btn.classList.add('spinning');

  // 現在の状態を保存してリロード後に復元
  sessionStorage.setItem('refresh_venue',   currentVenue || 'NONE');
  sessionStorage.setItem('refresh_race',    String(selectedRace || '0'));
  sessionStorage.setItem('refresh_tab',     currentTabName() || 'detail');
  sessionStorage.setItem('refresh_scrollY', String(window.scrollY || 0));
  sessionStorage.setItem('refresh_flag',    '1');

  // location.reload() でリロード（sessionStorage は同一オリジンで保持される）
  setTimeout(()=>{ location.reload(true); }, 150);
}

function selectRace(rno){
  if(!DATA) return;
  selectedRace = rno;
  document.querySelectorAll('.race-btn').forEach(c=>c.classList.remove('active'));
  const btn = document.getElementById(`rc-${rno}`);
  if(btn){ btn.classList.add('active'); btn.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'}); }
  const tabName = currentTabName();
  if(tabName==='detail')        renderDetail(rno);
  else if(tabName==='detail2')  renderBuy(rno);
  else if(tabName==='buy')      renderBuy(rno);
  else if(tabName==='comment')  renderComment(rno);
  else renderDetail(rno);
}

// ── TOAST ──
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}

// ── 初期化 ──
(function(){
  const isRefresh    = sessionStorage.getItem('refresh_flag') === '1';
  const restoreVenue = sessionStorage.getItem('refresh_venue') || '';
  const restoreRace  = parseInt(sessionStorage.getItem('refresh_race') || '0') || 0;
  const restoreTab   = sessionStorage.getItem('refresh_tab') || 'detail';
  const restoreScrollY = parseInt(sessionStorage.getItem('refresh_scrollY') || '0') || 0;

  // ★ デバッグ: 復元前の値をコンソールに出力
  console.log('[INIT] isRefresh:', isRefresh);
  console.log('[INIT] restoreVenue:', restoreVenue);
  console.log('[INIT] restoreRace:', restoreRace);
  console.log('[INIT] restoreTab:', restoreTab);
  console.log('[INIT] ALL_DATA keys:', Object.keys(ALL_DATA));
  console.log('[INIT] ALL_DATA[restoreVenue]:', ALL_DATA[restoreVenue]);

  // 復元キーは使い捨て（次回通常起動と区別するため即座にクリア）
  sessionStorage.removeItem('refresh_flag');
  sessionStorage.removeItem('refresh_venue');
  sessionStorage.removeItem('refresh_race');
  sessionStorage.removeItem('refresh_tab');
  sessionStorage.removeItem('refresh_scrollY');

  if(isRefresh){
    // ── 更新ボタン後: 会場・レース・タブを完全復元 ──
    // ALL_DATA[venue] は null（データなし）か object（データあり）かの2択。
    // undefined はキー自体が存在しない（無効な会場名）なので復元不可とする。
    const hasVenue = restoreVenue && restoreVenue !== 'NONE'
                     && Object.prototype.hasOwnProperty.call(ALL_DATA, restoreVenue)
                     && ALL_DATA[restoreVenue] !== null;

    if(hasVenue){
      currentVenue = restoreVenue;
      DATA         = ALL_DATA[restoreVenue];
      selectedRace = restoreRace;
    } else {
      currentVenue = '';
      DATA         = null;
      selectedRace = 0;
    }

    buildVenueTabs();
    buildRaceBar();

    if(hasVenue){
      document.getElementById('header-meta').innerHTML = `<strong>${restoreVenue}</strong> — ${DATA.date||''}`;

      // タブUIを先に切り替える
      const TAB_NAMES = ['detail','detail2','buy','comment'];
      const safeTab = TAB_NAMES.includes(restoreTab) ? restoreTab : 'detail';
      TAB_NAMES.forEach(t=>{
        document.getElementById(`tab-${t}`).style.display = t === safeTab ? '' : 'none';
      });
      document.querySelectorAll('.tab-btn').forEach(b=>{
        b.classList.toggle('active', b.dataset.tab === safeTab);
      });

      // レースバーを構築してアクティブ表示
      if(restoreRace){
        selectedRace = restoreRace;
        document.querySelectorAll('.race-btn').forEach(c=>c.classList.remove('active'));
        const raceBtn = document.getElementById(`rc-${restoreRace}`);
        if(raceBtn){ raceBtn.classList.add('active'); raceBtn.scrollIntoView({behavior:'auto',block:'nearest',inline:'center'}); }
      }

      // FLYING_DATAはauto_pushで埋め込み済みのためfetch不要
      if(restoreRace){
        if(safeTab === 'detail')        renderDetail(restoreRace);
        else if(safeTab === 'detail2')  renderBuy(restoreRace);
        else if(safeTab === 'buy')      renderBuy(restoreRace);
        else if(safeTab === 'comment')  renderComment(restoreRace);
        else                            renderDetail(restoreRace);
      }
      // スクロール位置を復元
      if(restoreScrollY > 0){
        requestAnimationFrame(()=>{
          requestAnimationFrame(()=>{ window.scrollTo(0, restoreScrollY); });
        });
      }

    } else {
      document.getElementById('race-bar').innerHTML = '';
      document.getElementById('inline-detail').innerHTML =
        '<div style="padding:2rem;text-align:center;color:var(--text3)">会場を選択してください</div>';
    }

  } else {
    // ── 通常起動: 何も選択しない ──
    currentVenue = '';
    DATA         = null;
    buildVenueTabs();
    document.getElementById('race-bar').innerHTML = '';
    document.getElementById('inline-detail').innerHTML =
      '<div style="padding:2rem;text-align:center;color:var(--text3)">会場を選択してください</div>';
  }
})();
</script>
