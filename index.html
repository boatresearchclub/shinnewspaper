<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>競艇予想 — BoatAI</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0f14;
  --bg2: #13161e;
  --bg3: #1a1e2a;
  --bg4: #222636;
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.14);
  --text: #e8eaf0;
  --text2: #8892a4;
  --text3: #5a6478;
  --accent: #4f7cff;
  --accent2: #6b94ff;
  --gold: #f5c842;
  --green: #3dd68c;
  --green2: #1a6640;
  --red: #ff5a5a;
  --red2: #5a1a1a;
  --orange: #ff9f3d;
  --orange2: #5a3a10;
  --radius: 10px;
  --radius-sm: 6px;
  --mono: 'JetBrains Mono', monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; }
body {
  font-family: 'Noto Sans JP', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
}

/* ── HEADER ── */
.site-header {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 0 1.25rem;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 1rem;
  letter-spacing: .03em;
}
.logo-icon {
  width: 30px;
  height: 30px;
  background: var(--accent);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
}
.header-meta {
  font-size: 12px;
  color: var(--text2);
  text-align: right;
}
.header-meta strong { color: var(--text); }

/* ── LAYOUT ── */
.container { max-width: 960px; margin: 0 auto; padding: 1.25rem 1rem; }

/* ── VENUE STATS ── */
.venue-bar {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1rem 1.25rem;
  margin-bottom: 1.25rem;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 12px;
}
.vstat { text-align: center; }
.vstat-val { font-size: 1.3rem; font-weight: 700; color: var(--accent2); }
.vstat-lbl { font-size: 11px; color: var(--text3); margin-top: 2px; }

/* ── RACE GRID ── */
.section-title {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 10px;
}
.race-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 1.25rem;
}
@media (max-width: 600px) {
  .race-grid { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 400px) {
  .race-grid { grid-template-columns: repeat(2, 1fr); }
}
.race-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: .75rem .875rem;
  cursor: pointer;
  transition: border-color .15s, background .15s;
  position: relative;
  overflow: hidden;
}
.race-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: transparent;
  transition: background .15s;
}
.race-card:hover { border-color: var(--border2); background: var(--bg3); }
.race-card.active { border-color: var(--accent); background: var(--bg3); }
.race-card.active::before { background: var(--accent); }
.rc-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 7px; }
.rc-no { font-weight: 700; font-size: .875rem; }
.rc-time { font-size: 10px; color: var(--text3); }
.arek-pill {
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 20px;
}
.arek-lo { background: rgba(61,214,140,.12); color: var(--green); }
.arek-md { background: rgba(245,200,66,.12); color: var(--gold); }
.arek-hi { background: rgba(255,90,90,.12); color: var(--red); }
.rc-top {
  display: flex;
  align-items: center;
  gap: 7px;
}
.boat-circle {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
}
.b1 { background: #4f7cff; color: #fff; }
.b2 { background: #3a8fd4; color: #fff; }
.b3 { background: #d44e3a; color: #fff; }
.b4 { background: #3ab87a; color: #fff; }
.b5 { background: #d49e3a; color: #fff; }
.b6 { background: #9b5de5; color: #fff; }
.rc-name { font-size: 12px; font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rc-prob { font-size: 12px; font-weight: 700; color: var(--accent2); font-family: var(--mono); }
.rc-bar { height: 3px; background: var(--bg4); border-radius: 2px; margin-top: 7px; }
.rc-fill { height: 100%; border-radius: 2px; background: var(--accent); transition: width .4s ease; }

/* ── DETAIL PANEL ── */
.detail-panel {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 1.25rem;
}
.dp-header {
  padding: 1rem 1.25rem;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  background: var(--bg3);
}
.dp-title { font-size: 1rem; font-weight: 700; }
.dp-meta { font-size: 12px; color: var(--text2); }
.scenario-bar {
  padding: .75rem 1.25rem;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.scenario-bar.safe { background: rgba(61,214,140,.07); border-left: 3px solid var(--green); }
.scenario-bar.warn { background: rgba(255,90,90,.07); border-left: 3px solid var(--red); }
.scenario-bar.mix  { background: rgba(79,124,255,.07); border-left: 3px solid var(--accent); }

/* ── BOAT TABLE ── */
.boat-table { width: 100%; }
.bt-head {
  display: grid;
  grid-template-columns: 36px 1fr 42px 54px 54px 54px 50px 72px;
  gap: 6px;
  padding: .5rem 1.25rem;
  font-size: 11px;
  color: var(--text3);
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  border-bottom: 1px solid var(--border);
}
.bt-row {
  display: grid;
  grid-template-columns: 36px 1fr 42px 54px 54px 54px 50px 72px;
  gap: 6px;
  padding: .75rem 1.25rem;
  align-items: center;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  transition: background .12s;
}
.bt-row:last-child { border-bottom: none; }
.bt-row:hover { background: var(--bg3); }
.bt-row.top1 { background: rgba(79,124,255,.05); }
.grade-tag {
  display: inline-block;
  padding: 1px 6px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 700;
}
.ga1 { background: rgba(79,124,255,.2); color: var(--accent2); }
.ga2 { background: rgba(79,124,255,.1); color: #8aabff; }
.gb1 { background: var(--bg4); color: var(--text2); }
.gb2 { background: rgba(255,90,90,.1); color: #ff8a8a; }
.dq-tag {
  display: inline-block;
  font-size: 9px;
  padding: 1px 5px;
  border-radius: 3px;
  margin-top: 2px;
}
.dq-venue { background: rgba(61,214,140,.15); color: var(--green); }
.dq-venue_raw { background: rgba(61,214,140,.08); color: #70d4a0; }
.dq-course { background: rgba(245,200,66,.12); color: var(--gold); }
.dq-fallback { background: var(--bg4); color: var(--text3); }
.prob-cell { display: flex; align-items: center; gap: 7px; }
.prob-bar-wrap { flex: 1; height: 4px; background: var(--bg4); border-radius: 2px; min-width: 30px; }
.prob-bar-fill { height: 100%; border-radius: 2px; background: var(--accent); }
.prob-num { font-family: var(--mono); font-size: 12px; font-weight: 500; min-width: 36px; text-align: right; }
.form-dots { display: flex; gap: 3px; align-items: center; }
.fdot {
  width: 7px; height: 7px; border-radius: 50%;
  display: inline-block;
}
.fd1 { background: var(--green); }
.fd2 { background: var(--accent); }
.fd3 { background: var(--gold); }
.fd4, .fd5, .fd6 { background: var(--text3); }
.fdS, .fdF { background: var(--red); }

/* ── BUY SECTION ── */
.buy-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 1.25rem;
  border-top: 1px solid var(--border);
  background: var(--bg3);
}
@media (max-width: 480px) { .buy-grid { grid-template-columns: 1fr; } }
.buy-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: .875rem 1rem;
}
.buy-card-title { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text3); margin-bottom: 10px; }
.buy-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--border); }
.buy-row:last-child { border-bottom: none; }
.buy-label {
  font-size: 10px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 4px;
  min-width: 30px;
  text-align: center;
}
.bl-honmei { background: rgba(61,214,140,.15); color: var(--green); }
.bl-taikou { background: rgba(245,200,66,.12); color: var(--gold); }
.bl-ana, .bl-gyaku { background: rgba(255,90,90,.1); color: #ff8a8a; }
.buy-combo { font-family: var(--mono); font-size: 15px; font-weight: 500; flex: 1; letter-spacing: 2px; }
.buy-weight { display: flex; gap: 2px; }
.wdot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.wdot.empty { background: var(--bg4); }

/* ── FILE UPLOAD ── */
.upload-area {
  background: var(--bg2);
  border: 1px dashed var(--border2);
  border-radius: var(--radius);
  padding: 2rem 1.25rem;
  text-align: center;
  cursor: pointer;
  transition: border-color .15s, background .15s;
  margin-bottom: 1.25rem;
}
.upload-area:hover { border-color: var(--accent); background: var(--bg3); }
.upload-area.drag { border-color: var(--accent); background: var(--bg3); }
.upload-icon { font-size: 2rem; margin-bottom: .5rem; }
.upload-text { font-size: 14px; color: var(--text2); }
.upload-text strong { color: var(--text); }
#file-input { display: none; }
.upload-hint { font-size: 11px; color: var(--text3); margin-top: 6px; }

/* ── TABS ── */
.tab-bar {
  display: flex;
  gap: 4px;
  margin-bottom: 1rem;
  border-bottom: 1px solid var(--border);
  padding-bottom: 0;
}
.tab-btn {
  padding: 7px 16px;
  font-size: 13px;
  font-family: 'Noto Sans JP', sans-serif;
  background: none;
  border: none;
  color: var(--text3);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  transition: color .15s, border-color .15s;
  font-weight: 500;
}
.tab-btn:hover { color: var(--text2); }
.tab-btn.active { color: var(--accent2); border-bottom-color: var(--accent); }

/* ── RESPONSIVE TABLE ── */
@media (max-width: 640px) {
  .bt-head { display: none; }
  .bt-row {
    grid-template-columns: 36px 1fr 42px 72px;
    grid-template-rows: auto auto;
  }
  .bt-col-wr, .bt-col-lr, .bt-col-m2 { display: none; }
  .bt-col-form { grid-column: 2; }
  .bt-col-prob { grid-column: 4; grid-row: 1 / 3; }
}

/* ── TOAST ── */
.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(60px);
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  padding: .625rem 1.25rem;
  font-size: 13px;
  transition: transform .3s ease;
  z-index: 200;
  pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* ── BADGE FOR RANK ── */
.rank-crown { font-size: 12px; margin-left: 4px; }

/* ── SCROLL ── */
html { scroll-behavior: smooth; }
</style>
</head>

  <!-- BUY -->

      <div style="padding:2rem;text-align:center;color:var(--text3)">レースを選択すると買い目が表示されます</div>
    </div>
  </div>

</main>

let DATA = MASTER;
let selectedRace = 2;

function arekClass(v){ return v < 45 ? 'arek-lo' : v < 65 ? 'arek-md' : 'arek-hi'; }
function arekLabel(v){ return v < 45 ? '安定' : v < 65 ? '中荒れ' : '大荒れ'; }

function formDots(s){
  s = s.replace(/[^1-6SF]/g,'');
  return s.split('').slice(-5).map(c=>{
    const cls = c==='1'?'fd1':c==='2'?'fd2':c==='3'?'fd3':c==='F'||c==='S'?'fdF':'fd4';
    return `<span class="fdot ${cls}"></span>`;
  }).join('');
}

function gradeBadge(g){
  const cls={A1:'ga1',A2:'ga2',B1:'gb1',B2:'gb2'}[g]||'gb1';
  return `<span class="grade-tag ${cls}">${g}</span>`;
}

function dqTag(dq){
  const map={venue:'当地実績',venue_raw:'当地(生)',course:'全国実績',fallback:'推定'};
  return `<span class="dq-tag dq-${dq}">${map[dq]||'推定'}</span>`;
}

function weightDots(w, max=3){
  let s='';
  for(let i=0;i<max;i++) s+=`<span class="wdot${i<w?'':' empty'}"></span>`;
  return `<div class="buy-weight">${s}</div>`;
}

function buildVenueBar(){
  const inn = DATA.inn_data;
  document.getElementById('vs-inn').textContent = (inn.inn_rate*100).toFixed(1)+'%';
  document.getElementById('vs-arek').textContent = inn.arek_score.toFixed(1);
  document.getElementById('vs-c1').textContent = (inn.course_rates[1]*100).toFixed(1)+'%';
  document.getElementById('vs-races').textContent = Object.keys(DATA.races).length;
  document.getElementById('venue-bar').style.display='';
  document.getElementById('tab-bar').style.display='';
  document.getElementById('header-meta').innerHTML = `<strong>${DATA.venue}</strong> — ${DATA.date}`;
}

function buildRaceGrid(){
  const grid = document.getElementById('race-grid');
  grid.innerHTML='';
  Object.entries(DATA.races).sort((a,b)=>+a[0]-+b[0]).forEach(([rno,rd])=>{
    const top = rd.boats[0];
    const div = document.createElement('div');
    div.className = 'race-card' + (parseInt(rno)===selectedRace?' active':'');
    div.id = `rc-${rno}`;
    div.onclick = ()=>{ selectRace(parseInt(rno)); };
    div.innerHTML = `
      <div class="rc-head">
        <span class="rc-no">${rno}R <span class="rc-time">${rd.time}</span></span>
        <span class="arek-pill ${arekClass(rd.arek)}">${arekLabel(rd.arek)}</span>
      </div>
      <div class="rc-top">
        <span class="boat-circle b${top.boat}">${top.boat}</span>
        <span class="rc-name">${top.name}</span>
        <span class="rc-prob">${(top.prob*100).toFixed(0)}%</span>
      </div>
      <div class="rc-bar"><div class="rc-fill" style="width:${(top.prob*100).toFixed(0)}%"></div></div>
    `;
    grid.appendChild(div);
  });
}

function selectRace(rno){
  selectedRace = rno;
  document.querySelectorAll('.race-card').forEach(c=>c.classList.remove('active'));
  const card = document.getElementById(`rc-${rno}`);
  if(card) card.classList.add('active');
  renderDetail(rno);
  renderBuy(rno);
}

function renderDetail(rno){
  const rd = DATA.races[rno];
  if(!rd) return;
  const boats = rd.boats;
  const top = boats[0];
  let sc, scCls;
  if(rd.arek < 40){
    sc = `安定展開 — インが強い。荒れスコア${rd.arek}で逃げ展開が濃厚`;
    scCls = 'safe';
  } else if(rd.arek >= 65){
    sc = `大荒れ注意 — まくり・差しが頻発。荒れスコア${rd.arek}、外枠にも注目`;
    scCls = 'warn';
  } else {
    sc = `混戦 — 差し・まくりが絡む展開。${top.name}(艇${top.boat})を軸に対応`;
    scCls = 'mix';
  }
  document.getElementById('detail-panel').innerHTML = `
    <div class="dp-header">
      <div>
        <div class="dp-title">${rno}R 詳細予想</div>
        <div class="dp-meta">${DATA.venue} &nbsp;${rd.time} 締切</div>
      </div>
      <div style="font-size:12px;color:var(--text3)">荒れスコア <strong style="color:${rd.arek>=65?'var(--red)':rd.arek>=45?'var(--gold)':'var(--green)'}">${rd.arek}</strong></div>
    </div>
    <div class="scenario-bar ${scCls}">${sc}</div>
    <div class="bt-head">
      <div>艇</div><div>選手</div><div>級別</div>
      <div class="bt-col-wr">全国勝率</div>
      <div class="bt-col-lr">当地勝率</div>

      <div class="bt-row${i===0?' top1':''}">
        <div><span class="boat-circle b${bt.boat}">${bt.boat}</span></div>

          <span style="font-weight:${i===0?700:400}">${bt.name}</span>${i===0?'<span class="rank-crown">👑</span>':''}

        <div class="bt-col-m2" style="font-family:var(--mono);font-size:12px">${bt.motor2>0?bt.motor2.toFixed(1)+'%':'—'}</div>

        <div class="prob-cell">
          <div class="prob-bar-wrap"><div class="prob-bar-fill" style="width:${(bt.prob*100).toFixed(0)}%"></div></div>

        </div>
      </div>

  `;
}

  if(!rd) return;
  const boats = rd.boats;
  const [t,s,h,f] = [boats[0].boat,boats[1].boat,boats[2].boat,(boats[3]||boats[2]).boat];
  const buy3 = [
    {c:`${t}−${s}−${h}`,l:'本命',lc:'bl-honmei',w:3},
    {c:`${t}−${h}−${s}`,l:'対抗',lc:'bl-taikou',w:2},
    {c:`${t}−${s}−${f}`,l:'穴',lc:'bl-ana',w:1},
    {c:`${s}−${t}−${h}`,l:'穴',lc:'bl-ana',w:1},
  ];
  const buy2 = [
    {c:`${t}−${s}`,l:'本命',lc:'bl-honmei',w:3},
    {c:`${t}−${h}`,l:'対抗',lc:'bl-taikou',w:2},
    {c:`${s}−${t}`,l:'逆転',lc:'bl-gyaku',w:1},

    <div class="dp-header">

        <div class="dp-title">${rno}R 買い目</div>

      <div class="buy-card">

function switchTab(name){
  ['races','detail','buy'].forEach(t=>{
    document.getElementById(`tab-${t}`).style.display = t===name?'':'none';
  });
  document.querySelectorAll('.tab-btn').forEach((b,i)=>{
    b.classList.toggle('active', ['races','detail','buy'][i]===name);
  });
  if(name==='detail') renderDetail(selectedRace);
  if(name==='buy') renderBuy(selectedRace);
}

// ── FILE UPLOAD ──
function handleCSV(text){
  const lines = text.trim().split('\n').filter(l=>l.trim());
  if(lines.length < 2){ showToast('CSVの形式が不正です'); return; }
  const headers = lines[0].split(',').map(h=>h.trim().replace(/"/g,''));
  if(!headers.includes('会場') || !headers.includes('レース')){ showToast('対応フォーマットではありません'); return; }
  const idx = h=>headers.indexOf(h);
  const rows = lines.slice(1).map(l=>{
    const cols = l.split(',').map(c=>c.trim().replace(/"/g,''));
    const obj={};
    headers.forEach((h,i)=>obj[h]=cols[i]||'');
    return obj;
  });
  const venue = rows[0]['会場']||'不明';
  const date  = rows[0]['日付']||'';
  const races = {};
  rows.forEach(r=>{
    const rno = parseInt(r['レース'])||0;
    if(!races[rno]) races[rno]={arek:54.7,time:r['締切時刻']||'',boats:[]};
    const name = r['選手名']?(r['選手名'].replace(/\d+$/, '').trim()):('艇'+r['艇番']);
    races[rno].boats.push({
      boat:parseInt(r['艇番'])||0,
      name, grade:r['級別']||'B1',
      win_rate:parseFloat(r['全国勝率'])||0,
      local_rate:parseFloat(r['当地勝率'])||0,
      motor2:parseFloat(r['M2率'])||0,
      boat2:parseFloat(r['B2率'])||0,
      results:r['今節成績']||'',
      hayami:parseFloat(r['早見'])||null,
      score:0.1, dq:'fallback', prob:0.1667,
    });
  });
  // basic scoring
  const COURSE_BASE={1:0.47,2:0.15,3:0.155,4:0.133,5:0.074,6:0.014};
  const GRADE={A1:1.0,A2:0.82,B1:0.65,B2:0.50};
  Object.values(races).forEach(rd=>{
    rd.boats.forEach(bt=>{
      let sc=(COURSE_BASE[bt.boat]||0.08)+(GRADE[bt.grade]||0.65-0.65)*0.1+(bt.motor2-30)/100*0.12+(bt.win_rate/6);
      sc=Math.max(0.01,sc);
      bt.score=sc;
    });
    const tot=rd.boats.reduce((s,b)=>s+b.score,0);
    rd.boats.forEach(bt=>bt.prob=bt.score/tot);
    rd.boats.sort((a,b)=>b.prob-a.prob);
  });
  DATA={venue,date,inn_data:MASTER.inn_data,races};
  selectedRace=parseInt(Object.keys(races)[0])||1;
  buildVenueBar();
  buildRaceGrid();
  selectRace(selectedRace);
  document.getElementById('upload-area').style.display='none';
  showToast(`${venue} ${date} — ${Object.keys(races).length}レース読み込み完了`);
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}

const fileInput=document.getElementById('file-input');
fileInput.addEventListener('change',e=>{
  const f=e.target.files[0];
  if(!f) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{ handleCSV(ev.target.result); } catch(err){ showToast('読み込みエラー: '+err.message); }
  };
  reader.readAsText(f,'UTF-8');
  reader.onerror=()=>{
    const r2=new FileReader();
    r2.onload=ev2=>{ try{ handleCSV(ev2.target.result); } catch(err){ showToast('読み込みエラー'); } };
    r2.readAsText(f,'Shift_JIS');
  };
});

const ua=document.getElementById('upload-area');
ua.addEventListener('dragover',e=>{ e.preventDefault(); ua.classList.add('drag'); });
ua.addEventListener('dragleave',()=>ua.classList.remove('drag'));
ua.addEventListener('drop',e=>{
  e.preventDefault(); ua.classList.remove('drag');
  const f=e.dataTransfer.files[0];
  if(!f) return;
  fileInput.files=e.dataTransfer.files;
  const ev={target:{files:[f]}}; fileInput.dispatchEvent(new Event('change'));
});

// ── INIT with embedded data ──
buildVenueBar();
buildRaceGrid();
selectRace(selectedRace);
document.getElementById('upload-area').style.display='none';
</script>
