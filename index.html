<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Boat Research Club</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6f8fb;
  --bg2: #ffffff;
  --bg3: #f0f5ff;
  --bg4: #e7eefc;
  --border: rgba(0, 40, 90, 0.12);
  --border2: rgba(0, 40, 90, 0.20);
  --text: #0b1220;
  --text2: #3d4a63;
  --text3: #6c7a94;
  --accent: #0066ff;
  --accent2: #1a7dff;
  --gold: #ffb300;
  --green: #00b86b;
  --green2: #d9f6ea;
  --red: #ff3b3b;
  --red2: #ffe1e1;
  --orange: #ff7a00;
  --orange2: #fff1e0;
  --radius: 10px;
  --radius-sm: 6px;
  --mono: 'JetBrains Mono', monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; }
body {
  font-family: 'Noto Sans JP', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
}
.site-header {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 0 0.875rem;
  min-height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  gap: 6px;
}
.logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 0.9rem; letter-spacing: .03em; flex-shrink: 0; }
.logo-icon { width: 28px; height: 28px; background: var(--accent); border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
.header-right { display: flex; align-items: center; gap: 6px; min-width: 0; }
.header-meta-area { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; min-width: 0; }
.header-meta { font-size: 12px; color: var(--text2); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.header-meta strong { color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 1.25rem 1rem; }

/* TABS */
.tab-bar { display: flex; gap: 0; margin-bottom: 1rem; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
.tab-bar::-webkit-scrollbar { display: none; }
.tab-btn { flex: 1; min-width: 0; padding: 8px 4px; font-size: 12px; font-family: 'Noto Sans JP', sans-serif; background: none; border: none; color: var(--text3); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .15s, border-color .15s; font-weight: 500; white-space: nowrap; text-align: center; }
.tab-btn:hover { color: var(--text2); }
.tab-btn.active { color: var(--accent2); border-bottom-color: var(--accent); }


/* VENUE TABS */
.sticky-nav-venue { overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; display: flex; border-bottom: 1px solid var(--border); touch-action: pan-x; }
.sticky-nav-venue::-webkit-scrollbar { display: none; }
#venue-tabs { overflow-x: auto; scrollbar-width: none; flex-wrap: nowrap; gap: 2px; display: flex; touch-action: pan-x; }
#venue-tabs::-webkit-scrollbar { display: none; }
.vtab { flex-shrink: 0; padding: 6px 10px 8px; font-size: 12px; font-family: 'Noto Sans JP', sans-serif; background: none; border: none; color: var(--text3); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .15s, border-color .15s; font-weight: 500; white-space: nowrap; }
.vtab:hover { color: var(--text2); }
.vtab.loaded { color: var(--text2); font-weight: 700; }
.vtab.active { color: var(--accent2) !important; border-bottom-color: var(--accent); }

/* RACE BAR */
.sticky-nav { position: sticky; top: 52px; z-index: 90; background: var(--bg2); border-bottom: 1px solid var(--border); box-shadow: 0 2px 8px rgba(0,40,90,0.06); }
.sticky-nav-race { overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.sticky-nav-race::-webkit-scrollbar { display: none; }
.sticky-nav-race-inner { display: flex; gap: 4px; padding: 5px 10px; min-width: max-content; }
.race-btn { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 8px; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; transition: border-color .15s, background .15s; min-width: 48px; flex-shrink: 0; position: relative; }
.race-btn::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: transparent; border-radius: var(--radius-sm) var(--radius-sm) 0 0; transition: background .15s; }
.race-btn:hover { border-color: var(--border2); background: var(--bg3); }
.race-btn.active { border-color: var(--accent); background: var(--bg3); }
.race-btn.active::before { background: var(--accent); }
.race-btn-no { font-size: 12px; font-weight: 700; color: var(--text); }
.race-btn-time { font-size: 9px; color: var(--text3); }

/* DETAIL PANEL */
.detail-panel { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 1.25rem; box-shadow: 0 6px 18px rgba(0,40,90,0.08); }
.bt-head-simple { display: grid; grid-template-columns: 44px 90px 45px 28px 72px; gap: 6px; padding: .4rem 1.25rem; font-size: 11px; color: var(--text3); font-weight: 700; letter-spacing: .08em; border-bottom: 1px solid var(--border); background: var(--bg3); }
.detail-panel .bt-row { grid-template-columns: 44px 90px 45px 28px 72px; }
.bt-row { display: grid; grid-template-columns: 44px 90px 45px 28px 72px; gap: 6px; padding: .75rem 1.25rem; align-items: center; border-bottom: 1px solid var(--border); font-size: 13px; transition: background .12s; }
.bt-row:last-child { border-bottom: none; }
.bt-row:hover { background: var(--bg3); }
/* .bt-row.top1 removed */
.bt-grade { font-size: 11px; color: var(--text3); }

/* BOAT CIRCLES */
.boat-circle { width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
.b1 { background: #ffffff; color: #111; border: 1px solid rgba(0,0,0,0.15); }
.b2 { background: #000000; color: #fff; }
.b3 { background: #e60012; color: #fff; }
.b4 { background: #0066cc; color: #fff; }
.b5 { background: #ffcc00; color: #111; }
.b6 { background: #00a651; color: #fff; }

/* GRADE TAGS */
.grade-tag { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 10px; font-weight: 700; }
.ga1 { background: rgba(79,124,255,.2); color: var(--accent2); }
.ga2 { background: rgba(79,124,255,.1); color: #8aabff; }
.gb1 { background: var(--bg4); color: var(--text2); }
.gb2 { background: rgba(255,90,90,.1); color: #ff8a8a; }

/* INSUFFICIENT BANNER */
.insufficient-banner { display: flex; align-items: center; gap: 7px; padding: .55rem 1.25rem; background: rgba(255,122,0,0.08); border-bottom: 1px solid rgba(255,122,0,0.18); font-size: 12px; color: var(--orange); line-height: 1.4; }

/* COURSE ORDER BANNER (進入変更) */
.course-order-banner { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: .5rem 1.25rem; font-size: 12px; border-bottom: 1px solid rgba(255,59,59,0.22); background: rgba(255,59,59,0.07); color: var(--red); line-height: 1.5; }
.course-order-banner .cb-icon { font-size: 14px; flex-shrink: 0; }
.course-order-banner .cb-text { font-weight: 700; flex-shrink: 0; }
.course-order-banner .cb-order { display: flex; align-items: center; gap: 3px; flex-wrap: wrap; }
.course-order-banner .cb-sep { color: var(--text3); font-size: 10px; }

/* WEATHER BAR */
.weather-bar { border-top: 1px solid var(--border); }
.weather-bar-title, .tenji-title {
  font-size: 10px; font-weight: 700; letter-spacing: .08em;
  color: var(--text3); text-transform: uppercase;
  padding: 0.5rem 1rem;
  background: var(--bg3);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 6px;
  margin-bottom: 0;
}
.weather-bar-body {
  display: flex; flex-wrap: wrap; gap: 6px 16px;
  padding: 0.6rem 1rem;
  background: var(--bg2);
  font-size: 12px; color: var(--text2);
  align-items: center;
  justify-content: center;
}
.weather-item { display: flex; align-items: center; gap: 4px; }
.weather-item .wi-label { color: var(--text3); font-size: 11px; }
.weather-item .wi-val   { font-weight: 700; color: var(--text); }
.wind-badge { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 4px; margin-left: 4px; vertical-align: middle; }
.wind-badge.tail        { background: #ffe1e1; color: var(--red);    } /* 追い風 */
.wind-badge.head        { background: #e1eeff; color: var(--accent); } /* 向かい風 */
.wind-badge.cross_right { background: #f0f0f0; color: var(--text3);  } /* 右横風 */
.wind-badge.cross_left  { background: #f0f0f0; color: var(--text3);  } /* 左横風 */

/* TENJI */
.tenji-section { border-top: 1px solid var(--border); padding: 0; background: var(--bg3); }
.tenji-badge { font-size: 10px; background: var(--accent); color: #fff; border-radius: 4px; padding: 1px 5px; }
.tenji-badge.waiting { background: var(--text3); }
.tenji-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; font-family: var(--mono); }
.tenji-table th { text-align: center; color: var(--text3); font-weight: 500; font-size: 0.72rem; padding: 5px 6px 5px; border-bottom: 1px solid var(--border); }
.tenji-table td { text-align: center; padding: 5px 6px; border-bottom: 1px solid var(--border); color: var(--text); }
.tenji-table td:nth-child(2) { text-align: center; font-family: 'Noto Sans JP', sans-serif; font-size: 0.8rem; }
.tenji-table tr:last-child td { border-bottom: none; }
.tenji-table tr:hover td { background: var(--bg3); }
.tenji-best { color: var(--red); font-weight: 700; }
.tenji-rank1 { color: var(--accent); font-weight: 700; }
.tenji-waiting { text-align: center; color: var(--text3); font-size: 0.8rem; padding: 0.65rem 1rem; width: 100%; }
.tenji-delta-plus  { color: #22c55e; font-size: 11px; font-weight: 600; }
.tenji-delta-minus { color: #ef4444; font-size: 11px; font-weight: 600; }
.tenji-tilt { font-size: 0.72rem; color: var(--text3); }

/* ── RESULT TAB ── */
.result-panel-inner { padding: 1.25rem; }
.result-section-title { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text3); margin-bottom: 12px; }
.result-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.result-row:last-of-type { border-bottom: none; }
.result-top .result-combo { color: var(--green); }
.result-medal { font-size: 18px; min-width: 24px; text-align: center; }
.result-combo { font-family: var(--mono); font-size: 20px; font-weight: 700; flex: 1; letter-spacing: 3px; }
.result-odds { font-family: var(--mono); font-size: 16px; font-weight: 600; color: var(--gold); min-width: 80px; text-align: right; }
.result-fetched { font-size: 10px; color: var(--text3); text-align: right; margin-top: 10px; }

/* COMMENT */
.comment-section { border-top: 1px solid var(--border); padding: 0.875rem 0.75rem 0.5rem; }
.comment-title { font-size: 0.78rem; font-weight: 700; color: var(--text3); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 6px; }
.comment-badge { font-size: 10px; background: var(--green); color: #fff; border-radius: 4px; padding: 1px 5px; }
.comment-row { display: grid; grid-template-columns: 28px 5.5em 1fr; gap: 6px 8px; align-items: baseline; font-size: 0.82rem; padding: 5px 0; border-bottom: 1px solid var(--border); }
.comment-row:last-child { border-bottom: none; }
.comment-name { font-weight: 600; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.8rem; }
.comment-text { color: var(--text); font-size: 0.8rem; line-height: 1.5; }
.comment-empty { color: var(--text3); font-size: 0.8rem; font-style: italic; }
.comment-keyword { display: inline-block; background: var(--orange2); color: var(--orange); border-radius: 3px; font-size: 10px; font-weight: 700; padding: 0 4px; margin-right: 3px; vertical-align: middle; }
.comment-keyword.good { background: var(--green2); color: var(--green); }
.comment-keyword.bad  { background: var(--red2); color: var(--red); }

/* BUY */
.buy-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 1.25rem; border-top: 1px solid var(--border); background: var(--bg3); }
@media (max-width: 480px) { .buy-grid { grid-template-columns: 1fr; } }
.buy-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: .875rem 1rem; box-shadow: 0 6px 18px rgba(0,40,90,0.08); }
.buy-card-title { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text3); margin-bottom: 10px; }
.buy-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--border); }
.buy-row:last-child { border-bottom: none; }
.buy-label { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; min-width: 30px; text-align: center; }
.bl-honmei { background: rgba(61,214,140,.15); color: var(--green); }
.bl-taikou { background: rgba(245,200,66,.12); color: var(--gold); }
.bl-ana, .bl-gyaku { background: rgba(255,90,90,.1); color: #ff8a8a; }
.buy-combo { font-family: var(--mono); font-size: 15px; font-weight: 500; flex: 1; letter-spacing: 2px; }
.buy-weight { display: flex; gap: 2px; }
.wdot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.wdot.empty { background: var(--bg4); }

.scenario-bar { padding: .75rem 1.25rem; border-bottom: 1px solid var(--border); font-size: 13px; display: flex; align-items: center; gap: 10px; }
.scenario-bar.safe { background: rgba(61,214,140,.07); border-left: 3px solid var(--green); }
.scenario-bar.warn { background: rgba(255,90,90,.07); border-left: 3px solid var(--red); }
.scenario-bar.mix  { background: rgba(79,124,255,.07); border-left: 3px solid var(--accent); }


/* 過去レース（締め切り済み）*/
.race-btn.past { opacity: 0.38; filter: grayscale(0.4); }
.race-btn.past .race-btn-no { color: var(--text3); }

/* 更新ボタン */
#refresh-btn {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--bg3);
  color: var(--accent);
  border: 1px solid var(--border2);
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.2s, background 0.2s;
  flex-shrink: 0;
}
#refresh-btn:active { transform: scale(0.9); }
@keyframes spin { to { transform: rotate(360deg); } }
#refresh-btn.spinning { animation: spin 0.7s linear infinite; color: var(--accent2); }

/* ── DEADLINE ALERT STRIP ── */
#alert-strip {
  background: #fff8ee;
  border-bottom: 1px solid rgba(239,159,39,0.35);
  padding: 7px 10px 8px;
  display: block;
}
.alert-strip-title {
  font-size: 10px; font-weight: 700; letter-spacing: .09em;
  color: #854F0B; text-transform: uppercase;
  margin-bottom: 6px; display: flex; align-items: center; gap: 5px;
}
.alert-strip-cards {
  display: flex; gap: 6px; overflow-x: auto;
  scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.alert-strip-cards::-webkit-scrollbar { display: none; }
.alert-card {
  flex-shrink: 0; background: #fff;
  border: 1px solid rgba(239,159,39,0.55);
  border-radius: var(--radius-sm); padding: 6px 10px;
  min-width: 100px; cursor: pointer;
  transition: background .12s, border-color .12s;
}
.alert-card:hover { background: #fff1e0; }
.alert-card.urgent { border-color: rgba(229,57,53,0.55); background: #fff5f5; }
.alert-card.urgent:hover { background: #ffe1e1; }
.alert-card-badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 9px; font-weight: 700; padding: 1px 5px;
  border-radius: 3px; background: #fae0b0; color: #633806;
  margin-bottom: 3px; letter-spacing: .03em;
}
.alert-card.urgent .alert-card-badge { background: #fdd; color: #791F1F; }
.alert-card-venue { font-size: 11px; color: var(--text2); font-weight: 500; }
.alert-card-race  { font-size: 17px; font-weight: 700; color: var(--text); line-height: 1.2; }
.alert-card-time  { font-size: 10px; color: var(--text3); margin-top: 1px; }
.alert-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: #EF9F27; display: inline-block;
  animation: alertPulse 1.3s ease-in-out infinite;
}
.alert-dot.urgent { background: #E24B4A; }
@keyframes alertPulse { 0%,100%{opacity:1} 50%{opacity:0.25} }

/* TOAST */
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(60px); background: var(--bg3); border: 1px solid var(--border2); border-radius: var(--radius); padding: .625rem 1.25rem; font-size: 13px; transition: transform .3s ease; z-index: 200; pointer-events: none; }
.toast.show { transform: translateX(-50%) translateY(0); }

/* DATE NAVIGATOR */
.date-nav { display: flex; align-items: center; gap: 3px; }
.date-nav-btn { width: 20px; height: 20px; border-radius: 50%; background: var(--bg3); color: var(--accent); border: 1px solid var(--border2); font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .15s; padding: 0; line-height: 1; flex-shrink: 0; }
.date-nav-btn:hover { background: var(--bg4); }
.date-nav-btn:disabled { opacity: 0.3; cursor: default; }
.date-nav-label { font-size: 11px; color: var(--text2); font-weight: 500; white-space: nowrap; }

#buy-panel, #comment-panel { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 1.25rem; box-shadow: 0 6px 18px rgba(0,40,90,0.08); }

/* ── MOBILE RESPONSIVE ── */
@media (max-width: 600px) {
  html { font-size: 14px; }

  .container { padding: 0.75rem 0.5rem; }

  /* 確率テーブルをスマホ幅に収める */
  .prob-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .prob-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
  .prob-table th, .prob-table td { padding: 4px 4px !important; white-space: nowrap; }
  .prob-table .col-name { width: 6em; min-width: 6em; max-width: 8em; overflow: hidden; text-overflow: clip; white-space: nowrap; text-align: center; }

  /* ヘッダタイトル・バッジ行 */
  .status-badges { display: flex; flex-wrap: wrap; gap: 4px; padding: 0.4rem 0.75rem; border-bottom: 1px solid var(--border); }
  .status-badges > span { font-size: 10px !important; }

  /* シナリオバー */
  .scenario-header { padding: 0.6rem 0.75rem !important; gap: 6px !important; }
  .scenario-header .scenario-bar { font-size: 12px !important; padding: 4px 8px !important; }
  .scenario-header .mode-desc { font-size: 11px !important; }

  /* 3連単グリッドをシングルカラムに */
  .buy3-inner { grid-template-columns: 1fr !important; }

  /* buy-card */
  .buy-card { padding: 0.625rem 0.75rem; }
  .buy-combo { font-size: 14px !important; letter-spacing: 1px !important; }
  .buy-grid { padding: 0.75rem !important; gap: 8px !important; }

  /* detail panel */
  .bt-head-simple, .bt-row { padding: 0.4rem 0.75rem !important; }
  .bt-row { font-size: 12px; }
}
</style>
</head>
<body>

<header class="site-header">
  <div class="logo">
    <div class="logo-icon">⛵</div>
    <span>Boat Research Club</span>
  </div>
  <div class="header-right">
    <div class="header-meta-area">
      <div class="header-meta" id="header-meta"></div>
      <div class="date-nav" id="date-nav" style="display:none">
        <button class="date-nav-btn" id="date-prev" onclick="shiftDate(-1)" title="前日">‹</button>
        <span class="date-nav-label" id="date-nav-label"></span>
        <button class="date-nav-btn" id="date-next" onclick="shiftDate(+1)" title="翌日">›</button>
      </div>
    </div>
    <button id="refresh-btn" onclick="doRefresh()" title="更新">↻</button>
  </div>
</header>

<!-- sticky nav: 締め切りアラート + 会場タブ + レース選択バー -->
<div class="sticky-nav">
  <div id="alert-strip">
    <div class="alert-strip-title">⏱ まもなく締め切り</div>
    <div class="alert-strip-cards" id="alert-cards"></div>
  </div>
  <div class="sticky-nav-venue">
    <div id="venue-tabs"></div>
  </div>
  <div class="sticky-nav-race">
    <div class="sticky-nav-race-inner" id="race-bar"></div>
  </div>
</div>

<div class="container">
  <!-- タブ -->
  <div class="tab-bar" id="tab-bar">
    <button class="tab-btn active" data-tab="detail" onclick="switchTab('detail')">出走表</button>

function buildWeatherBar(rno){
  const SLUG = {
    "桐生":"kiryu","戸田":"toda","江戸川":"edogawa","平和島":"heiwajima",
    "多摩川":"tamagawa","浜名湖":"hamanako","蒲郡":"gamagori","常滑":"tokoname",
    "津":"tsu","三国":"mikuni","びわこ":"biwako","住之江":"suminoe",
    "尼崎":"amagasaki","鳴門":"naruto","丸亀":"marugame","児島":"kojima",
    "宮島":"miyajima","徳山":"tokuyama","下関":"shimonoseki","若松":"wakamatsu",
    "芦屋":"ashiya","福岡":"fukuoka","唐津":"karatsu","大村":"omura"
  };
  const slug   = SLUG[DATA.venue] || DATA.venue;
  const key    = tenjiKey(slug, DATA.date, rno);
  const cached = _tenjiCache[key];

  // ── 会場別スタートライン方向（ボートの進行方位角 °）──────────
  // 追い風 = 風がボートを後ろから押す（風向とボート進行が逆方向）
  // 風向き数値: 1=北(0°), 2=北北東(22.5°)... 時計回り16方位
  // 会場別スタートライン方向（ボートの進行方位角°）
  // ソース: 公式サイト実データの追い風/向かい風分析（2014-2022）から逆算
  // 追い風方向の逆がボート進行方向 = SL_DIR
  const SL_DIR = {
    "kiryu":       180,  // 桐生    南  （追い風=北）
    "toda":        135,  // 戸田    南東 （追い風=北西）
    "edogawa":      45,  // 江戸川  北東 （追い風=南西）
    "heiwajima":     0,  // 平和島  北  （追い風=南）
    "tamagawa":    270,  // 多摩川  西  （追い風=東）※変更なし
    "hamanako":      0,  // 浜名湖  北  （追い風=南）
    "gamagori":    225,  // 蒲郡    南西 （追い風=北東）
    "tokoname":    315,  // 常滑    北西 （追い風=南東）※変更なし
    "tsu":         315,  // 津      北西 （追い風=南東）
    "mikuni":      180,  // 三国    南  （追い風=北）
    "biwako":      180,  // びわこ  南  （追い風=北）
    "suminoe":     180,  // 住之江  南  （追い風=北）
    "amagasaki":   225,  // 尼崎    南西 （追い風=北東）
    "naruto":      135,  // 鳴門    南東 （追い風=北西）
    "marugame":      0,  // 丸亀    北  （追い風=南）
    "kojima":      180,  // 児島    南  （追い風=北）
    "miyajima":    225,  // 宮島    南西 （追い風=北東）
    "tokuyama":    315,  // 徳山    北西 （追い風=南東）
    "shimonoseki": 270,  // 下関    西  （追い風=東）※変更なし
    "wakamatsu":   180,  // 若松    南  （追い風=北）※変更なし
    "ashiya":      180,  // 芦屋    南  （若松隣接・地形推定）
    "fukuoka":     225,  // 福岡    南西 （博多湾・地形推定）
    "karatsu":     180,  // 唐津    南  （追い風=北、年間追い風多し）
    "omura":       270,  // 大村    西  （大村湾・地形推定）※変更なし
  };
  function windNumToDeg(n){ return ((n - 1) * 22.5) % 360; }
  function getWindType(windNum, slDeg){
    if(windNum == null || slDeg == null) return null;
    const windDeg = windNumToDeg(windNum);
    let diff = Math.abs(windDeg - slDeg) % 360;
    if(diff > 180) diff = 360 - diff;
    // diff≈0° → 風向=ボート進行方向 → 向かい風
    // diff≈180° → 風向=ボート逆方向 → 追い風
    if(diff <= 30)  return 'head';    // ±30°以内 = 向かい風
    if(diff >= 150) return 'tail';    // ±30°以内(逆) = 追い風
    // 横風: 符号付き差分で右/左を判定
    // signed 0〜180° → 風がボートの右側から来る（右横風）
    // signed 180〜360° → 風がボートの左側から来る（左横風）
    const signed = (windDeg - slDeg + 360) % 360;
    return signed < 180 ? 'cross_right' : 'cross_left';
  }
  const WIND_LABEL = { tail:'追い風', head:'向かい風', cross_right:'右横風', cross_left:'左横風' };
  // 矢印はスタートライン(右)に向かうボートを基準にした画面座標
  // ボート進行=→, 追い風=後ろから→, 向かい風=正面から←, 右横風=下から↑, 左横風=上から↓
  const WIND_ARROW = { tail:'→', head:'←', cross_right:'↑', cross_left:'↓' };

  // データ未取得 → 過去日なら「記録なし」、当日なら「取得待ち」
  if(!cached){
    const today = new Date().toISOString().slice(0,10);
    const isPastDay = DATA.date && DATA.date < today;
    const msg = isPastDay ? '記録なし' : '取得待ち';
    return `<div class="weather-bar"><span class="weather-bar-title">水面気象情報</span><div class="weather-bar-body"><span class="tenji-waiting" style="margin:0;padding:0;display:inline;font-size:11px">${msg}</span></div></div>`;
  }

  const w = {
    weather:       cached.__weather,
    weather_degree:cached.__weather_degree,
    water_degree:  cached.__water_degree,
    wind_speed:    cached.__wind_speed,
    wind_dir_num:  cached.__wind_direction,
    wind_dir_text: cached.__wind_direction_text,
    wave_height:   cached.__wave_height,
  };

  // キャッシュはあるが気象フィールドがすべて null
  if(Object.values(w).every(v => v == null)){
    return `<div class="weather-bar"><span class="weather-bar-title">水面気象情報</span><div class="weather-bar-body"><span class="tenji-waiting" style="margin:0;padding:0;display:inline;font-size:11px">取得待ち</span></div></div>`;
  }

  // 追い風/向かい風バッジ
  const windType  = getWindType(w.wind_dir_num, SL_DIR[slug] ?? null);
  const windBadge = windType
    ? `<span class="wind-badge ${windType}">${WIND_ARROW[windType]} ${WIND_LABEL[windType]}</span>`
    : '';

  const weatherIcon = {'晴':'☀️','曇':'☁️','雨':'🌧️','雪':'❄️'};
  const icon = weatherIcon[w.weather] || '🌤️';
  const row1 = [
    w.weather        != null ? `<div class="weather-item"><span class="wi-label">天候</span><span class="wi-val">${icon} ${w.weather}</span></div>` : '',
    w.weather_degree != null ? `<div class="weather-item"><span class="wi-label">気温</span><span class="wi-val">${w.weather_degree}℃</span></div>` : '',
    w.water_degree   != null ? `<div class="weather-item"><span class="wi-label">水温</span><span class="wi-val">${w.water_degree}℃</span></div>` : '',
  ].filter(Boolean).join('');
  const row2 = [
    w.wind_speed  != null ? `<div class="weather-item"><span class="wi-label">風速</span><span class="wi-val">${w.wind_speed}m/s${w.wind_dir_text ? ' ' + w.wind_dir_text : ''}${windBadge}</span></div>` : '',
    w.wave_height != null ? `<div class="weather-item"><span class="wi-label">波高</span><span class="wi-val">${w.wave_height}cm</span></div>` : '',
  ].filter(Boolean).join('');
  const weatherRows = [
    row1 ? `<div style="display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap">${row1}</div>` : '',
    row2 ? `<div style="display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap">${row2}</div>` : ''
  ].filter(Boolean).join('');
  return `<div class="weather-bar"><span class="weather-bar-title">水面気象情報</span><div class="weather-bar-body" style="flex-direction:column;gap:4px;align-items:center">${weatherRows}</div></div>`;
}

function buildCourseOrderBanner(rno, boats){
  // _tenjiCache から course/is_normal_course を読んで「進入変更」バナーを生成
  const SLUG2 = {
    "桐生":"kiryu","戸田":"toda","江戸川":"edogawa","平和島":"heiwajima",
    "多摩川":"tamagawa","浜名湖":"hamanako","蒲郡":"gamagori","常滑":"tokoname",
    "津":"tsu","三国":"mikuni","びわこ":"biwako","住之江":"suminoe",
    "尼崎":"amagasaki","鳴門":"naruto","丸亀":"marugame","児島":"kojima",
    "宮島":"miyajima","徳山":"tokuyama","下関":"shimonoseki","若松":"wakamatsu",
    "芦屋":"ashiya","福岡":"fukuoka","唐津":"karatsu","大村":"omura"
  };
  const slug2  = SLUG2[DATA.venue] || DATA.venue;
  const key2   = tenjiKey(slug2, DATA.date, rno);
  const cached2 = _tenjiCache[key2];
  if(!cached2) return '';  // 展示未取得 → バナーなし

  const cf2 = bn => cached2[String(bn)] ?? cached2[bn];

  // course が null の艇が1つでもあればコースデータなし → バナーなし
  const entries = boats.map(b => {
    const d = cf2(b.boat);
    const course = d?.course ?? null;
    // is_normal_course が明示されていればそちらを優先、
    // なければ「展示コース ≠ 枠番」で進入変更を判定
    const is_normal = d?.is_normal_course != null
      ? d.is_normal_course
      : (course != null ? course === b.boat : null);
    return { frame: b.boat, name: b.name, course, is_normal };
  });
  if(entries.some(e => e.course == null)) return '';

  const allNormal = entries.every(e => e.is_normal !== false);
  if(allNormal) return '';  // 全艇枠なり → バナー不要

  // コース順でソート（1コース→2→…）
  const sorted = [...entries].sort((a,b) => a.course - b.course);

  // ボートサークル
  const circle = (n) =>
    `<span class="boat-circle b${n}" style="width:20px;height:20px;font-size:10px;line-height:20px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0">${n}</span>`;

  // コース順に全艇の枠番サークルを並べる
  const orderHtml = sorted.map((e, i) =>
    `${i > 0 ? '<span class="cb-sep">›</span>' : ''}${circle(e.frame)}`
  ).join('');

  return `<div class="course-order-banner">
    <span class="cb-icon">⚠</span>
    <span class="cb-text">進入変更</span>
    <span class="cb-order">${orderHtml}</span>
  </div>`;
}

function buildTenjiSection(rno, boats){
  const SLUG = {
    "桐生":"kiryu","戸田":"toda","江戸川":"edogawa","平和島":"heiwajima",
    "多摩川":"tamagawa","浜名湖":"hamanako","蒲郡":"gamagori","常滑":"tokoname",
    "津":"tsu","三国":"mikuni","びわこ":"biwako","住之江":"suminoe",
    "尼崎":"amagasaki","鳴門":"naruto","丸亀":"marugame","児島":"kojima",
    "宮島":"miyajima","徳山":"tokuyama","下関":"shimonoseki","若松":"wakamatsu","芦屋":"ashiya",
    "福岡":"fukuoka","唐津":"karatsu","大村":"omura"
  };
  const slug   = SLUG[DATA.venue] || DATA.venue;
  const key    = tenjiKey(slug, DATA.date, rno);
  const cached = _tenjiCache[key];

  // 未取得の場合
  if(cached === undefined || cached === null){
    const rd = DATA.races[String(rno)];
    const timeStr = rd && rd.time;
    // 過去日かどうか判定（DATA.date が今日より前）
    const today = new Date().toISOString().slice(0,10);
    const isPastDay = DATA.date && DATA.date < today;
    let pastDeadline = isPastDay; // 過去日は無条件で「記録なし」
    if(!isPastDay && timeStr && /^\d{1,2}:\d{2}$/.test(timeStr.trim())){
      const now = new Date();
      const [h, m] = timeStr.trim().split(':').map(Number);
      const deadlineMin = h * 60 + m - 5;  // 締め切り5分前
      const nowMin = now.getHours() * 60 + now.getMinutes();
      pastDeadline = nowMin >= deadlineMin;
    }
    // 過去日または締め切り後は「展示情報がありません」
    const msg = pastDeadline ? '展示情報がありません' : '取得待ち';
    return `${buildWeatherBar(rno)}<div class="tenji-section">
      <div class="tenji-title">展示情報</div>
      <div style="background:var(--bg2)"><div class="tenji-waiting">${msg}</div></div>
    </div>`;
  }

  // 枠番キーは文字列で統一（Python側JSON → 文字列キー、数値/文字列どちらでも取得できるよう正規化）
  const cf = bn => cached[String(bn)] ?? cached[bn];
  const lap1vals   = boats.map(b=>cf(b.boat)?.lap1).filter(v=>v!=null);
  const mawarivals = boats.map(b=>cf(b.boat)?.mawari).filter(v=>v!=null);
  const chokuvals  = boats.map(b=>cf(b.boat)?.chokusen).filter(v=>v!=null);
  const tenjivals  = boats.map(b=>cf(b.boat)?.tenji).filter(v=>v!=null);
  const bestLap1   = lap1vals.length   ? Math.min(...lap1vals)   : null;
  const bestMawari = mawarivals.length ? Math.min(...mawarivals) : null;
  const bestChoku  = chokuvals.length  ? Math.min(...chokuvals)  : null;
  const bestTenji  = tenjivals.length  ? Math.min(...tenjivals)  : null;
  const rows = boats.map(bt => {
    const bn = bt.boat;
    const t  = cf(bn);
    if(!t) return `<tr><td>${bn}</td><td>—</td><td>${bt.name}</td><td colspan="5">—</td></tr>`;
    const f = (v, best) => v==null ? '—' : `<span class="${v===best?'tenji-best':''}">${v.toFixed(2)}</span>`;
    const rankCls = t.tenji_rank===1 ? 'tenji-rank1' : '';
    const tilt = t.tilt != null ? `<span class="tenji-tilt">${t.tilt>0?'+':''}${t.tilt}</span>` : '';
    const course = t.course ?? null;
    // is_normal_course が明示されていればそちらを優先、
    // なければ「展示コース ≠ 枠番」で進入変更を判定
    const isAbnormal = t.is_normal_course != null
      ? t.is_normal_course === false
      : (course != null && course !== bn);
    const courseCell = course != null
      ? `<span class="boat-circle b${course}" style="width:22px;height:22px;font-size:11px;line-height:22px;display:inline-flex;align-items:center;justify-content:center${isAbnormal?';outline:2px solid var(--red);outline-offset:1px':''}">${course}</span>`
      : '—';
    return `<tr>
      <td><span class="boat-circle b${bn}" style="width:22px;height:22px;font-size:11px;line-height:22px;display:inline-flex;align-items:center;justify-content:center">${bn}</span></td>
      <td>${courseCell}</td>
      <td>${bt.name}</td>
      <td>${f(t.lap1, bestLap1)}</td>
      <td>${f(t.mawari, bestMawari)}</td>
      <td>${f(t.chokusen, bestChoku)}</td>
      <td><span class="${rankCls}">${f(t.tenji, bestTenji)}</span></td>
      <td>${tilt}</td>
    </tr>`;
  }).join('');
  return `${buildWeatherBar(rno)}<div class="tenji-section">
    <div class="tenji-title">展示情報</div>
    <div style="background:var(--bg2)">
      <table class="tenji-table">
        <thead><tr>
          <th>枠</th><th style="text-align:center">コース</th><th style="text-align:center">選手名</th>
          <th>1周</th><th>回り足</th><th>直線</th><th>展示</th><th>チルト</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  </div>`;
}

// 会場設定から最終重みを返す（arek動的調整なし・会場固定重みのみ）
function resolveWeights(venue, arek){
  const cfg = VENUE_TENJI_CONFIG[venue] || VENUE_TENJI_CONFIG["_default"];
  const base = { ...cfg.weight };

  // 計測がない項目をゼロにして再正規化
  const FIELDS = ["lap1", "mawari", "chokusen", "tenji"];
  FIELDS.forEach(f => { if(!cfg.available[f]) base[f] = 0; });
  const total = FIELDS.reduce((s, f) => s + base[f], 0) || 1;
  FIELDS.forEach(f => { base[f] = base[f] / total; });
  return base;
}

// タイム値 → 偏差値ベースの補正係数（小さい=速い=偏差値高）
function timeToCoef(h){
  if(h >= 60) return 1.15;
  if(h >= 55) return 1.08;
  if(h >= 45) return 1.00;
  if(h >= 40) return 0.93;
  return 0.85;
}

// 1項目分の補正係数配列を返す（値がnullの艇が1艇でもあればnullを返す）
// 全項目「小さいほど速い（タイム値）」
function fieldCoefs(boats, tenjiData, field){
  const vals = boats.map(b => tenjiData[b.boat]?.[field] ?? null);
  if(vals.some(v => v === null)) return null;
  const avg = vals.reduce((a, v) => a + v, 0) / vals.length;
  const std = Math.sqrt(vals.reduce((a, v) => a + (v - avg) ** 2, 0) / vals.length);
  if(std === 0) return vals.map(() => 1.0);  // 全艇同タイム → 補正なし
  return vals.map(v => timeToCoef(50 + ((avg - v) / std) * 10));
}

// ── calcTenjiScore（独立展示スコア生成）──
//
// 【変更点】
//   旧 calcTenjiDelta: base_score（prob/tenkai_prob）に展示係数を乗算
//     → 基準probやtenkai_probに依存した連鎖計算になっていた
//   新 calcTenjiScore: 展示タイムだけから独立した正規化スコアを生成
//     → 基準prob・tenkai_probを一切参照しない
//
// 返り値: { [boat番号]: 展示独立スコア（正規化済み 0-1） } または null
//
function calcTenjiScore(boats, tenjiData, venue, arek){
  if(!tenjiData) return null;

  const w = resolveWeights(venue || "_default", arek || 50);
  const FIELDS = ["lap1", "mawari", "chokusen", "tenji"];

  const coefsMap = {};
  for(const f of FIELDS){
    if(w[f] <= 0) continue;
    const c = fieldCoefs(boats, tenjiData, f);
    if(c) coefsMap[f] = c;
  }

  if(Object.keys(coefsMap).length === 0) return null;

  // 加重平均で合成係数を算出（各艇の展示パフォーマンス指標）
  const compositeCoefs = boats.map((_, i) => {
    let score = 0, wTotal = 0;
    for(const f of FIELDS){
      if(!coefsMap[f]) continue;
      score  += w[f] * coefsMap[f][i];
      wTotal += w[f];
    }
    return wTotal > 0 ? score / wTotal : 1.0;
  });

  // ★ 係数をそのまま正規化して独立スコアにする（probを一切掛けない）
  const coefTotal = compositeCoefs.reduce((a, v) => a + v, 0) || 1;
  const coefAvg   = coefTotal / boats.length;  // 平均係数（6艇均等なら全艇1.0）
  const tenjiScoreMap = {};
  boats.forEach((b, i) => {
    tenjiScoreMap[b.boat] = compositeCoefs[i] / coefTotal;
    // 表示用: 平均を1.0基準とした係数（0.5〜2.0にクリップ）
    tenjiScoreMap[`__coef_${b.boat}`] = coefAvg > 0
      ? Math.min(2.0, Math.max(0.5, compositeCoefs[i] / coefAvg))
      : 1.0;
  });
  return tenjiScoreMap;
}

// 後方互換ラッパー（updateTenjiDelta等の既存呼び出し箇所向け）
function calcTenjiDelta(boats, tenjiData, venue, arek){
  return calcTenjiScore(boats, tenjiData, venue, arek);
}

function updateTenjiDelta(venue, date, rno){
  if(!DATA||!DATA.races[String(rno)]) return;
  const SLUG = {
    "桐生":"kiryu","戸田":"toda","江戸川":"edogawa","平和島":"heiwajima",
    "多摩川":"tamagawa","浜名湖":"hamanako","蒲郡":"gamagori","常滑":"tokoname",
    "津":"tsu","三国":"mikuni","びわこ":"biwako","住之江":"suminoe",
    "尼崎":"amagasaki","鳴門":"naruto","丸亀":"marugame","児島":"kojima",
    "宮島":"miyajima","徳山":"tokuyama","下関":"shimonoseki","若松":"wakamatsu",
    "芦屋":"ashiya","福岡":"fukuoka","唐津":"karatsu","大村":"omura"
  };
  const slug = SLUG[DATA.venue]||DATA.venue||'';
  const key = tenjiKey(slug, date||DATA.date, rno);
  const tenjiData = _tenjiCache[key];
  if(!tenjiData) return;
  const boats = DATA.races[String(rno)].boats;
  const arekForTenji = (DATA.races[String(rno)]?.arek) ?? 54.7;
  const deltaMap = calcTenjiDelta(boats, tenjiData, DATA.venue, arekForTenji);
  if(!deltaMap) return;
  boats.forEach(b=>{
    b.tenji_delta = deltaMap[b.boat];
    if(b.final_prob == null) b.final_prob = b.tenkai_prob ?? b.prob;
  });
}

  if(!text) return '<span class="comment-empty">コメントなし</span>';

      motor2:     (td?.__motor_rate2 != null) ? td.__motor_rate2
                  : (td?.motor_rate2 != null) ? td.motor_rate2
                  : (bt.motor2 != null)       ? bt.motor2
                  : null,
      motor_rank: td?.__motor_rank ?? td?.motor_rank ?? bt.motor_rank ?? null,
      prev_user:  td?.__prev_user  ?? td?.prev_user  ?? bt.prev_user  ?? null,
    };
  });

  // M2率順位:
  //   サイト取得値(motor_rank)があればそちらをそのまま使用。
  //   なければ当該レースの6艇のM2率で降順ランクを計算（同率同順位）。
  const hasSiteRank = motorRows.some(r => r.motor_rank != null);
  const rankMap = {};
  if(hasSiteRank){
    motorRows.forEach(r => { rankMap[r.boat] = r.motor_rank; });
  } else {
    const sorted2 = [...motorRows]
      .filter(r => r.motor2 != null)
      .sort((a, b) => b.motor2 - a.motor2);
    sorted2.forEach((r, i) => {
      rankMap[r.boat] = (i > 0 && r.motor2 === sorted2[i-1].motor2)
        ? rankMap[sorted2[i-1].boat]
        : i + 1;
    });
  }

  const hasAny = motorRows.some(r => r.motor2 != null || r.motor_no != null || r.prev_user != null);
  if(!hasAny) return '';

  // 順位バッジ色（1位→金, 2位→銀, 3位→銅）
  function rankBadge(rank){
    if(rank == null) return '<span style="color:var(--text3);font-size:11px">—</span>';
    const colors = {1:'#e6a800',2:'#7a8a99',3:'#a0672a'};
    const c = colors[rank] || 'var(--text3)';
    return `<span style="font-size:11px;font-weight:700;color:${c}">${rank}位</span>`;
  }

  function m2Color(v){
    if(v == null) return 'var(--text3)';
    return v >= 40 ? 'var(--green)' : v >= 25 ? 'var(--orange)' : 'var(--red)';
  }

  const rows = motorRows.map(r => {
    const rank   = rankMap[r.boat] ?? null;
    const m2disp = r.motor2 != null
      ? `<span style="font-family:var(--mono);font-weight:700;color:${m2Color(r.motor2)}">${r.motor2.toFixed(1)}%</span>`
      : '<span style="color:var(--text3)">—</span>';
    const monoDisp = r.motor_no != null
      ? `<span style="font-size:10px;color:var(--text3);font-family:var(--mono)">#${r.motor_no}</span>`
      : '';
    const prevDisp = r.prev_user
      ? `<span style="font-size:11px;color:var(--text2)">${r.prev_user}</span>`
      : `<span style="font-size:11px;color:var(--text3)">—</span>`;

    return `<div style="display:grid;grid-template-columns:28px 1fr 52px 36px 1fr;gap:4px 8px;align-items:center;padding:0.4rem 1rem;border-bottom:1px solid var(--border)">
      <span class="boat-circle b${r.boat}" style="width:22px;height:22px;font-size:11px;line-height:22px;display:inline-flex;align-items:center;justify-content:center">${r.boat}</span>
      <div style="min-width:0">
        <div style="font-size:12px;font-weight:600;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r.name}</div>
        ${monoDisp ? `<div style="margin-top:1px">${monoDisp}</div>` : ''}
      </div>
      <div style="text-align:center">${m2disp}</div>
      <div style="text-align:center">${rankBadge(rank)}</div>
      <div>${prevDisp}</div>
    </div>`;
  }).join('');

  return `<div style="border-bottom:1px solid var(--border)">
    <div style="display:grid;grid-template-columns:28px 1fr 52px 36px 1fr;gap:4px 8px;align-items:center;padding:0.35rem 1rem;background:var(--bg3);border-bottom:1px solid var(--border)">
      <span></span>
      <span style="font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--text3)">🔧 モーター</span>
      <span style="font-size:10px;color:var(--text3);text-align:center">M2率</span>
      <span style="font-size:10px;color:var(--text3);text-align:center">順位</span>
      <span style="font-size:10px;color:var(--text3)">前節使用者</span>
    </div>
    ${rows}
  </div>`;
}
