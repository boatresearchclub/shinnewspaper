<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>競艇予想 — Boat Research Club</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6f8fb;         /* 全体背景 */
  --bg2: #ffffff;        /* カード背景 */
  --bg3: #f0f5ff;        /* 薄い青 */
  --bg4: #e7eefc;        /* テーブル背景 */

  --border: rgba(0, 40, 90, 0.12);
  --border2: rgba(0, 40, 90, 0.20);

  --text: #0b1220;       /* メイン文字 */
  --text2: #3d4a63;      /* サブ文字 */
  --text3: #6c7a94;      /* 薄文字 */

  --accent: #0066ff;     /* ボートレースっぽい青 */
  --accent2: #1a7dff;    /* 明るい青 */

  --gold: #ffb300;       /* 注意 */
  --green: #00b86b;      /* 安定 */
  --green2: #d9f6ea;

  --red: #ff3b3b;        /* 危険 */
  --red2: #ffe1e1;

  --orange: #ff7a00;
  --orange2: #fff1e0;

  --radius: 10px;
  --radius-sm: 6px;
  --mono: 'JetBrains Mono', monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; }
body {
  font-family: 'Noto Sans JP', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
}
/* ── HEADER ── */
.site-header {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 0 1.25rem;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 1rem;
  letter-spacing: .03em;
}
.logo-icon {
  width: 30px;
  height: 30px;
  background: var(--accent);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
}
.header-meta {
  font-size: 12px;
  color: var(--text2);
  text-align: right;
}
.header-meta strong { color: var(--text); }

/* ── LAYOUT ── */
.container { max-width: 960px; margin: 0 auto; padding: 1.25rem 1rem; }

/* ── VENUE STATS ── */
.venue-bar {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1rem 1.25rem;
  margin-bottom: 1.25rem;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 12px;
}
.vstat { text-align: center; }
.vstat-val { font-size: 1.3rem; font-weight: 700; color: var(--accent2); }
.vstat-lbl { font-size: 11px; color: var(--text3); margin-top: 2px; }

/* ── RACE GRID ── */
.section-title {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 10px;
}
.race-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 1.25rem;
}
@media (max-width: 600px) {
  .race-grid { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 400px) {
  .race-grid { grid-template-columns: repeat(2, 1fr); }
}
.race-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: .75rem .875rem;
  cursor: pointer;
  transition: border-color .15s, background .15s;
  position: relative;
  overflow: hidden;
}
.race-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: transparent;
  transition: background .15s;
}
.race-card:hover { border-color: var(--border2); background: var(--bg3); }
.race-card.active { border-color: var(--accent); background: var(--bg3); }
.race-card.active::before { background: var(--accent); }
.rc-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 7px; }
.rc-no { font-weight: 700; font-size: .875rem; }
.rc-time { font-size: 10px; color: var(--text3); }
.arek-pill {
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 20px;
}
.arek-lo { background: rgba(61,214,140,.12); color: var(--green); }
.arek-md { background: rgba(245,200,66,.12); color: var(--gold); }
.arek-hi { background: rgba(255,90,90,.12); color: var(--red); }
.rc-top {
  display: flex;
  align-items: center;
  gap: 7px;
}
.boat-circle {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
}
.b1 { background: #ffffff; color: #111; border: 1px solid rgba(0,0,0,0.15); }
.b2 { background: #000000; color: #fff; }
.b3 { background: #e60012; color: #fff; }
.b4 { background: #0066cc; color: #fff; }
.b5 { background: #ffcc00; color: #111; }
.b6 { background: #00a651; color: #fff; }
.rc-name { font-size: 12px; font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rc-prob { font-size: 12px; font-weight: 700; color: var(--accent2); font-family: var(--mono); }
.rc-bar { height: 3px; background: var(--bg4); border-radius: 2px; margin-top: 7px; }
.rc-fill { height: 100%; border-radius: 2px; background: var(--accent); transition: width .4s ease; }

/* ── RACE BAR (横並びレース選択) ── */
.race-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 6px 10px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: border-color .15s, background .15s;
  min-width: 56px;
  flex-shrink: 0;
  position: relative;
}
.race-btn::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: transparent;
  border-radius: var(--radius-sm) var(--radius-sm) 0 0;
  transition: background .15s;
}
.race-btn:hover { border-color: var(--border2); background: var(--bg3); }
.race-btn.active { border-color: var(--accent); background: var(--bg3); }
.race-btn.active::before { background: var(--accent); }
.race-btn-no { font-size: 13px; font-weight: 700; color: var(--text); }
.race-btn-time { font-size: 10px; color: var(--text3); }

/* ── DETAIL PANEL boats: 艇番固定順 ── */
.detail-panel {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 1.25rem;
}
.dp-header {
  padding: 1rem 1.25rem;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  background: var(--bg3);
}
.dp-title { font-size: 1rem; font-weight: 700; }
.dp-meta { font-size: 12px; color: var(--text2); }
.scenario-bar {
  padding: .75rem 1.25rem;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.scenario-bar.safe { background: rgba(61,214,140,.07); border-left: 3px solid var(--green); }
.scenario-bar.warn { background: rgba(255,90,90,.07); border-left: 3px solid var(--red); }
.scenario-bar.mix  { background: rgba(79,124,255,.07); border-left: 3px solid var(--accent); }

/* ── BOAT TABLE ── */
.boat-table { width: 100%; }
/* シンプル詳細用ヘッダ */
.bt-head-simple {
  display: grid;
  grid-template-columns: 44px 1fr 72px;
  gap: 6px;
  padding: .4rem 1.25rem;
  font-size: 11px;
  color: var(--text3);
  font-weight: 700;
  letter-spacing: .08em;
  border-bottom: 1px solid var(--border);
  background: var(--bg3);
}
/* detail-panel 内の bt-row は3列 */
.detail-panel .bt-row {
  grid-template-columns: 44px 1fr 72px;
}
.bt-winrate { font-family: var(--mono); font-size: 12px; color: var(--text2); }
.bt-head {
  display: grid;
  grid-template-columns: 36px 1fr 42px 54px 54px 54px 50px 72px;
  gap: 6px;
  padding: .5rem 1.25rem;
  font-size: 11px;
  color: var(--text3);
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  border-bottom: 1px solid var(--border);
}
.bt-row {
  display: grid;
  grid-template-columns: 36px 1fr 42px 54px 54px 54px 50px 72px;
  gap: 6px;
  padding: .75rem 1.25rem;
  align-items: center;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  transition: background .12s;
}
.bt-row:last-child { border-bottom: none; }
.bt-row:hover { background: var(--bg3); }
.bt-row.top1 { background: rgba(79,124,255,.05); }
.grade-tag {
  display: inline-block;
  padding: 1px 6px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 700;
}
.ga1 { background: rgba(79,124,255,.2); color: var(--accent2); }
.ga2 { background: rgba(79,124,255,.1); color: #8aabff; }
.gb1 { background: var(--bg4); color: var(--text2); }
.gb2 { background: rgba(255,90,90,.1); color: #ff8a8a; }
.dq-tag {
  display: inline-block;
  font-size: 9px;
  padding: 1px 5px;
  border-radius: 3px;
  margin-top: 2px;
}
.dq-venue { background: rgba(61,214,140,.15); color: var(--green); }
.dq-venue_raw { background: rgba(61,214,140,.08); color: #70d4a0; }
.dq-course { background: rgba(245,200,66,.12); color: var(--gold); }
.dq-fallback { background: var(--bg4); color: var(--text3); }
.prob-cell { display: flex; align-items: center; gap: 7px; }
.prob-bar-wrap { flex: 1; height: 4px; background: var(--bg4); border-radius: 2px; min-width: 30px; }
.prob-bar-fill { height: 100%; border-radius: 2px; background: var(--accent); }
.prob-num { font-family: var(--mono); font-size: 12px; font-weight: 500; min-width: 36px; text-align: right; }
.form-dots { display: flex; gap: 3px; align-items: center; }
.fdot {
  width: 7px; height: 7px; border-radius: 50%;
  display: inline-block;
}
.fd1 { background: var(--green); }
.fd2 { background: var(--accent); }
.fd3 { background: var(--gold); }
.fd4, .fd5, .fd6 { background: var(--text3); }
.fdS, .fdF { background: var(--red); }

/* ── BUY SECTION ── */
.buy-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 1.25rem;
  border-top: 1px solid var(--border);
  background: var(--bg3);
}
@media (max-width: 480px) { .buy-grid { grid-template-columns: 1fr; } }
.buy-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: .875rem 1rem;
}
.buy-card-title { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text3); margin-bottom: 10px; }
.buy-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--border); }
.buy-row:last-child { border-bottom: none; }
.buy-label {
  font-size: 10px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 4px;
  min-width: 30px;
  text-align: center;
}
.bl-honmei { background: rgba(61,214,140,.15); color: var(--green); }
.bl-taikou { background: rgba(245,200,66,.12); color: var(--gold); }
.bl-ana, .bl-gyaku { background: rgba(255,90,90,.1); color: #ff8a8a; }
.buy-combo { font-family: var(--mono); font-size: 15px; font-weight: 500; flex: 1; letter-spacing: 2px; }
.buy-weight { display: flex; gap: 2px; }
.wdot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.wdot.empty { background: var(--bg4); }

/* ── FILE UPLOAD ── */
.upload-area {
  background: var(--bg2);
  border: 1px dashed var(--border2);
  border-radius: var(--radius);
  padding: 2rem 1.25rem;
  text-align: center;
  cursor: pointer;
  transition: border-color .15s, background .15s;
  margin-bottom: 1.25rem;
}
.upload-area:hover { border-color: var(--accent); background: var(--bg3); }
.upload-area.drag { border-color: var(--accent); background: var(--bg3); }
.upload-icon { font-size: 2rem; margin-bottom: .5rem; }
.upload-text { font-size: 14px; color: var(--text2); }
.upload-text strong { color: var(--text); }
#file-input { display: none; }
.upload-hint { font-size: 11px; color: var(--text3); margin-top: 6px; }

/* ── TABS ── */
.tab-bar {
  display: flex;
  gap: 4px;
  margin-bottom: 1rem;
  border-bottom: 1px solid var(--border);
  padding-bottom: 0;
}
.tab-btn {
  padding: 7px 16px;
  font-size: 13px;
  font-family: 'Noto Sans JP', sans-serif;
  background: none;
  border: none;
  color: var(--text3);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  transition: color .15s, border-color .15s;
  font-weight: 500;
}
.tab-btn:hover { color: var(--text2); }
.tab-btn.active { color: var(--accent2); border-bottom-color: var(--accent); }

/* ── STICKY NAV (venue + race bar) ── */
.sticky-nav {
  position: sticky;
  top: 52px; /* below site-header */
  z-index: 90;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 2px 8px rgba(0,40,90,0.06);
}
.sticky-nav-venue {
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  display: flex;
  border-bottom: 1px solid var(--border);
}
.sticky-nav-venue::-webkit-scrollbar { display: none; }
.sticky-nav-race {
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  display: none; /* shown after data load */
}
.sticky-nav-race.visible {
  display: block;
}
.sticky-nav-race::-webkit-scrollbar { display: none; }
.sticky-nav-race-inner {
  display: flex;
  gap: 4px;
  padding: 5px 10px;
  min-width: max-content;
}

/* ── VENUE TABS ── */
#venue-tabs {
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  flex-wrap: nowrap;
  gap: 2px;
}
#venue-tabs::-webkit-scrollbar { display: none; }
.vtab {
  flex-shrink: 0;
  padding: 6px 10px 8px;
  font-size: 12px;
  font-family: 'Noto Sans JP', sans-serif;
  background: none;
  border: none;
  color: var(--text3);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  transition: color .15s, border-color .15s;
  font-weight: 500;
  white-space: nowrap;
}
.vtab:hover:not(:disabled) { color: var(--text2); }
.vtab.loaded { color: var(--text2); font-weight: 700; }
.vtab.active { color: var(--accent2) !important; border-bottom-color: var(--accent); }
.vtab:disabled { color: var(--border2); cursor: default; opacity: 0.35; }
.vtab.loading { color: var(--gold); }

/* Compact race buttons inside sticky nav */
.sticky-nav .race-btn {
  padding: 4px 8px;
  min-width: 48px;
  gap: 1px;
}
.sticky-nav .race-btn-no { font-size: 12px; }
.sticky-nav .race-btn-time { font-size: 9px; }

/* ── RESPONSIVE TABLE ── */
@media (max-width: 640px) {
  .bt-head { display: none; }
  .bt-row {
    grid-template-columns: 36px 1fr 42px 72px;
    grid-template-rows: auto auto;
  }
  .bt-col-wr, .bt-col-lr, .bt-col-m2 { display: none; }
  .bt-col-form { grid-column: 2; }
  .bt-col-prob { grid-column: 4; grid-row: 1 / 3; }
}

/* ── TOAST ── */
.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(60px);
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  padding: .625rem 1.25rem;
  font-size: 13px;
  transition: transform .3s ease;
  z-index: 200;
  pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* ── BADGE FOR RANK ── */
.rank-crown { font-size: 12px; margin-left: 4px; }

/* ── SCROLL ── */
html { scroll-behavior: smooth; }
.race-card, .detail-panel, .venue-bar, .buy-card {
  box-shadow: 0 6px 18px rgba(0, 40, 90, 0.08);
}

/* ── テン展示テーブル ── */
.tenji-section {
  margin-top: 1rem;
  border-top: 1px solid var(--border);
  padding-top: 0.875rem;
  padding-left: 0.75rem;
  padding-right: 0.75rem;
}
.tenji-title {
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--text3);
  letter-spacing: .08em;
  text-transform: uppercase;
  margin-bottom: 0.5rem;
  display: flex;
  align-items: center;
  gap: 6px;
}
.tenji-badge {
  font-size: 10px;
  background: var(--accent);
  color: #fff;
  border-radius: 4px;
  padding: 1px 5px;
  letter-spacing: 0;
}
.tenji-badge.waiting {
  background: var(--text3);
}
.tenji-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.82rem;
  font-family: var(--mono);
}
.tenji-table th {
  text-align: center;
  color: var(--text3);
  font-weight: 500;
  font-size: 0.72rem;
  padding: 3px 6px;
  border-bottom: 1px solid var(--border);
}
.tenji-table td {
  text-align: center;
  padding: 5px 6px;
  border-bottom: 1px solid var(--border);
  color: var(--text);
}
.tenji-table td:nth-child(2) {
  text-align: left;
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 0.8rem;
}
.tenji-table tr:last-child td { border-bottom: none; }
.tenji-table tr:hover td { background: var(--bg3); }
.tenji-best { color: var(--red); font-weight: 700; }
.tenji-rank1 { color: var(--accent); font-weight: 700; }
.tenji-waiting {
  text-align: center;
  color: var(--text3);
  font-size: 0.8rem;
  padding: 0.75rem 0;
}
.tenji-delta-plus  { color: #22c55e; font-size: 11px; font-weight: 600; }
.tenji-delta-minus { color: #ef4444; font-size: 11px; font-weight: 600; }
.tenji-delta-none  { color: var(--text3); font-size: 11px; }
.tenji-tilt {
  font-size: 0.72rem;
  color: var(--text3);
}

/* ── 選手コメント ── */
.comment-section {
  margin-top: 0;
  border-top: 1px solid var(--border);
  padding: 0.875rem 0.75rem 0.5rem;
}
.comment-title {
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--text3);
  letter-spacing: .08em;
  text-transform: uppercase;
  margin-bottom: 0.5rem;
  display: flex;
  align-items: center;
  gap: 6px;
}
.comment-badge {
  font-size: 10px;
  background: var(--green);
  color: #fff;
  border-radius: 4px;
  padding: 1px 5px;
  letter-spacing: 0;
}
.comment-badge.waiting { background: var(--text3); }
.comment-badge.error   { background: var(--orange); }
.comment-row {
  display: grid;
  grid-template-columns: 28px 5.5em 1fr;
  gap: 6px 8px;
  align-items: baseline;
  font-size: 0.82rem;
  padding: 5px 0;
  border-bottom: 1px solid var(--border);
}
.comment-row:last-child { border-bottom: none; }
.comment-name {
  font-weight: 600;
  color: var(--text2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 0.8rem;
}
.comment-text {
  color: var(--text);
  font-size: 0.8rem;
  line-height: 1.5;
}
.comment-empty {
  color: var(--text3);
  font-size: 0.8rem;
  font-style: italic;
}
.comment-keyword {
  display: inline-block;
  background: var(--orange2);
  color: var(--orange);
  border-radius: 3px;
  font-size: 10px;
  font-weight: 700;
  padding: 0 4px;
  margin-right: 3px;
  vertical-align: middle;
}
.comment-keyword.good  { background: var(--green2); color: var(--green); }
.comment-keyword.bad   { background: var(--red2);   color: var(--red);   }


/* ── Pull-to-Refresh ── */
#ptr-indicator {
  position: fixed;
  top: 0; left: 0; right: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 6px;
  height: 0;
  overflow: hidden;
  background: var(--accent);
  color: #fff;
  font-size: 12px;

function arekClass(v){ return v < 45 ? 'arek-lo' : v < 65 ? 'arek-md' : 'arek-hi'; }
function arekLabel(v){ return v < 45 ? '安定' : v < 65 ? '中荒れ' : '大荒れ'; }

function formDots(s){
  s = s.replace(/[^1-6SF]/g,'');
  return s.split('').slice(-5).map(c=>{
    const cls = c==='1'?'fd1':c==='2'?'fd2':c==='3'?'fd3':c==='F'||c==='S'?'fdF':'fd4';
    return `<span class="fdot ${cls}"></span>`;
  }).join('');
}

function gradeBadge(g){
  const cls={A1:'ga1',A2:'ga2',B1:'gb1',B2:'gb2'}[g]||'gb1';
  return `<span class="grade-tag ${cls}">${g}</span>`;
}

function dqTag(dq){
  const map={venue:'当地実績',venue_raw:'当地(生)',course:'全国実績',fallback:'推定'};
  return `<span class="dq-tag dq-${dq}">${map[dq]||'推定'}</span>`;
}

function weightDots(w, max=3){
  let s='';
  for(let i=0;i<max;i++) s+=`<span class="wdot${i<w?'':' empty'}"></span>`;
  return `<div class="buy-weight">${s}</div>`;
}

function buildVenueBar(){
  // venue-bar は非表示のため vs-* には書き込まない
  document.getElementById('tab-bar').style.display='';
  document.getElementById('header-meta').innerHTML = `<strong>${DATA.venue}</strong> — ${DATA.date}`;

function buildRaceBar(){
  const bar = document.getElementById('race-bar');
  const wrap = document.getElementById('sticky-race-wrap');
  if(!bar || !wrap) return;
  bar.innerHTML = '';
  Object.entries(DATA.races).sort((a,b)=>+a[0]-+b[0]).forEach(([rno,rd])=>{
    const btn = document.createElement('button');
    btn.className = 'race-btn' + (parseInt(rno)===selectedRace?' active':'');
    btn.id = `rc-${rno}`;
    btn.innerHTML = `<span class="race-btn-no">${rno}R</span><span class="race-btn-time">${rd.time||''}</span>`;
    btn.onclick = ()=>{ selectRace(parseInt(rno)); };
    bar.appendChild(btn);
  });
  wrap.classList.add('visible');
}

function selectRace(rno){
  selectedRace = rno;

  document.querySelectorAll('.race-btn').forEach(c=>c.classList.remove('active'));
  const btn = document.getElementById(`rc-${rno}`);
  if(btn){
    btn.classList.add('active');
    // スクロールしてアクティブボタンを見えるようにする
    btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  }

  // race-label-bar を更新（存在する場合）
  const labelBar = document.getElementById('race-label-bar');
  const labelVenue = document.getElementById('race-label-venue');
  const labelRno = document.getElementById('race-label-rno');
  if(labelBar && DATA){
    labelVenue.textContent = DATA.venue || currentVenue || '';
    labelRno.textContent = `${rno}R`;
    labelBar.style.display = 'flex';
  }

  // アクティブタブに応じて再描画
  const tabName = currentTabName();
  if(tabName === 'detail') renderDetail(rno);
  else if(tabName === 'buy') renderBuy(rno);
  else if(tabName === 'comment') renderComment(rno);
  else renderDetail(rno); // 出走表下の詳細も更新
}

const _tenjiCache = {};  // key: "venue_date_race" → data or null

// auto_push で埋め込まれた TENJI_DATA を _tenjiCache に事前ロード
// TENJI_DATA のキー形式: "heiwajima_20260428_2"
// _tenjiCache のキー形式: "heiwajima_2026-04-28_2"
(function(){
  for(const [key, val] of Object.entries(TENJI_DATA)){
    // 日付部分（8桁数字）をダッシュ付きに変換
    const normalized = key.replace(/_(\d{4})(\d{2})(\d{2})_/, '_$1-$2-$3_');
    _tenjiCache[normalized] = val;
  }
})();

function tenjiKey(venue, date, race){
  return `${venue}_${date}_${race}`;
}

function buildTenjiSection(rno, boats){
  const venue = DATA.venue;
  const date  = DATA.date;
  // venue→スラッグ変換
  const SLUG = {
    "桐生":"kiryu","戸田":"toda","江戸川":"edogawa","平和島":"heiwajima",
    "多摩川":"tamagawa","浜名湖":"hamanako","蒲郡":"gamagori","常滑":"tokoname",
    "津":"tsu","三国":"mikuni","びわこ":"biwako","住之江":"suminoe",
    "尼崎":"amagasaki","鳴門":"naruto","丸亀":"marugame","児島":"kojima",
    "宮島":"miyajima","徳山":"tokuyama","下関":"shimonoseki","若松":"wakamatsu",
    "芦屋":"ashiya","福岡":"fukuoka","唐津":"karatsu","大村":"omura"
  };
  const slug = SLUG[venue] || venue;
  const key  = tenjiKey(slug, date, rno);
  const cached = _tenjiCache[key];

  if(cached === undefined){
    // 未取得 → ローディング表示してfetch
    setTimeout(()=> fetchTenji(slug, date, rno, boats), 0);
    return `<div class="tenji-section">
      <div class="tenji-title">　オリジナル展示 <span class="tenji-badge waiting">取得中...</span></div>
      <div class="tenji-waiting">⏳ 取得中...</div>
    </div>`;
  }
  if(cached === null){
    return `<div class="tenji-section">
      <div class="tenji-title">オリジナル展示 <span class="tenji-badge waiting">未取得</span></div>
      <div class="tenji-waiting">展示データなし（締め切り前 or 取得待ち）</div>
    </div>`;
  }

  // データあり → テーブル描画
  // 最良値（最小）を強調
  const lap1vals    = boats.map(b=> cached[b.boat]?.lap1).filter(v=>v!=null);
  const mawarivals  = boats.map(b=> cached[b.boat]?.mawari).filter(v=>v!=null);
  const chokuvals   = boats.map(b=> cached[b.boat]?.chokusen).filter(v=>v!=null);
  const tenjivals   = boats.map(b=> cached[b.boat]?.tenji).filter(v=>v!=null);
  const bestLap1    = lap1vals.length   ? Math.min(...lap1vals)   : null;
  const bestMawari  = mawarivals.length ? Math.min(...mawarivals) : null;
  const bestChoku   = chokuvals.length  ? Math.min(...chokuvals)  : null;
  const bestTenji   = tenjivals.length  ? Math.min(...tenjivals)  : null;

  const fetched = cached["__fetched_at"] || "";
  const rows = boats.map(bt => {
    const bn = bt.boat;
    const t  = cached[bn];
    if(!t) return `<tr><td>${bn}</td><td>${bt.name}</td><td colspan="5">—</td></tr>`;
    const f = (v, best) => v==null ? '—' : `<span class="${v===best?'tenji-best':''}">${v.toFixed(2)}</span>`;
    const rankCls = t.tenji_rank===1 ? 'tenji-rank1' : '';
    const tilt = t.tilt != null ? `<span class="tenji-tilt">${t.tilt>0?'+':''}${t.tilt}</span>` : '';
    return `<tr>
      <td><span class="boat-circle b${bn}" style="width:22px;height:22px;font-size:11px;line-height:22px">${bn}</span></td>
      <td>${bt.name}</td>
      <td>${f(t.lap1, bestLap1)}</td>
      <td>${f(t.mawari, bestMawari)}</td>
      <td>${f(t.chokusen, bestChoku)}</td>
      <td><span class="${rankCls}">${f(t.tenji, bestTenji)}</span></td>
      <td>${tilt}</td>
    </tr>`;
  }).join('');

  return `<div class="tenji-section">
    <div class="tenji-title">オリジナル展示 <span class="tenji-badge">取得済み ${fetched}</span></div>
    <table class="tenji-table">
      <thead><tr>
        <th>枠</th><th style="text-align:left">選手</th>
        <th>1周</th><th>回り足</th><th>直線</th><th>展示</th><th>チルト</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

// ── 展示タイム補正関数群 ──────────────────────────────────────────
function calcTenjiDelta(boats, tenjiData) {
  if (!tenjiData) return null;
  // 6艇分のtenjiタイムを取得
  const times = boats.map(b => tenjiData[b.boat]?.tenji ?? null);
  if (times.some(v => v == null)) return null; // 1艇でも欠けたらnull

  // 平均・標準偏差
  const n = times.length;
  const avg = times.reduce((a, b) => a + b, 0) / n;
  const variance = times.reduce((a, b) => a + (b - avg) ** 2, 0) / n;
  const std = Math.sqrt(variance);
  if (std === 0) return null;

  // 偏差値 → 補正係数
  const coefs = times.map(t => {
    const hensa = 50 + ((avg - t) / std) * 10; // 小さいほど速い→逆転
    if (hensa >= 60) return 1.15;
    if (hensa >= 55) return 1.08;
    if (hensa >= 45) return 1.00;
    if (hensa >= 40) return 0.93;
    return 0.85;
  });

  // 補正後prob計算（正規化）
  const rawScores = boats.map((b, i) => b.prob * coefs[i]);
  const total = rawScores.reduce((a, b) => a + b, 0);
  if (total === 0) return null;
  const newProbs = rawScores.map(s => s / total);

  // deltaマップ {boat_no: delta_float}
  const deltaMap = {};
  boats.forEach((b, i) => {
    deltaMap[b.boat] = newProbs[i] - b.prob;
  });
  return deltaMap;
}

function renderTenjiDelta(rno, deltaMap) {
  if (!deltaMap) return;
  const panel = document.getElementById('inline-detail');
  if (!panel) return;
  const rows = panel.querySelectorAll('.bt-row');
  rows.forEach(row => {
    const circleEl = row.querySelector('.boat-circle');
    if (!circleEl) return;
    const boatNo = parseInt(circleEl.textContent);
    if (isNaN(boatNo)) return;
    const delta = deltaMap[boatNo];
    if (delta == null) return;

    // prob表示div（3番目のdiv）を探す
    const divs = row.querySelectorAll(':scope > div');
    const probDiv = divs[2];
    if (!probDiv) return;

    // probDivを縦並びflexに（初回のみ設定）
    probDiv.style.display = 'flex';
    probDiv.style.flexDirection = 'column';
    probDiv.style.alignItems = 'flex-end';
    probDiv.style.gap = '1px';

    // 既存のdeltaスパンを除去
    probDiv.querySelectorAll('.tenji-delta-plus,.tenji-delta-minus').forEach(el => el.remove());

    const d = delta * 100;
    if (Math.abs(d) < 0.3) return;
    const span = document.createElement('span');
    if (d > 0) {
      span.className = 'tenji-delta-plus';
      span.textContent = `+${d.toFixed(1)}%`;
    } else {
      span.className = 'tenji-delta-minus';
      span.textContent = `${d.toFixed(1)}%`;
    }
    probDiv.appendChild(span);
  });
}

function updateTenjiDelta(venue, date, rno) {
  if (!DATA || !DATA.races[rno]) return;
  const SLUG = {
    "桐生":"kiryu","戸田":"toda","江戸川":"edogawa","平和島":"heiwajima",
    "多摩川":"tamagawa","浜名湖":"hamanako","蒲郡":"gamagori","常滑":"tokoname",
    "津":"tsu","三国":"mikuni","びわこ":"biwako","住之江":"suminoe",
    "尼崎":"amagasaki","鳴門":"naruto","丸亀":"marugame","児島":"kojima",
    "宮島":"miyajima","徳山":"tokuyama","下関":"shimonoseki","若松":"wakamatsu",
    "芦屋":"ashiya","福岡":"fukuoka","唐津":"karatsu","大村":"omura"
  };
  const slug = SLUG[DATA.venue] || DATA.venue || '';
  const key = tenjiKey(slug, date || DATA.date, rno);
  const tenjiData = _tenjiCache[key];
  if (!tenjiData) return;
  const boats = DATA.races[rno].boats;
  const deltaMap = calcTenjiDelta(boats, tenjiData);
  if (!deltaMap) return;
  // boatオブジェクトにtenji_deltaを保存
  boats.forEach(b => { b.tenji_delta = deltaMap[b.boat]; });
  renderTenjiDelta(rno, deltaMap);
}

async function fetchTenji(slug, date, rno, boats){
  const key = tenjiKey(slug, date, rno);
  try {
    const res = await fetch(`/api/tenji?venue=${slug}&date=${date}&race=${rno}`);
    const json = await res.json();
    if(json.ok){
      const d = json.data;
      d["__fetched_at"] = json.fetched_at ? json.fetched_at.slice(11,16) : "";
      _tenjiCache[key] = d;
    } else {
      _tenjiCache[key] = null;
    }
  } catch(e){
    _tenjiCache[key] = null;
  }
  // 表示中のレースなら再描画
  if(rno === selectedRace){
    renderDetail(rno);
  }
}

async function prefetchAllTenji(){
  if(!DATA) return;
  const SLUG = {
    "桐生":"kiryu","戸田":"toda","江戸川":"edogawa","平和島":"heiwajima",
    "多摩川":"tamagawa","浜名湖":"hamanako","蒲郡":"gamagori","常滑":"tokoname",
    "津":"tsu","三国":"mikuni","びわこ":"biwako","住之江":"suminoe",
    "尼崎":"amagasaki","鳴門":"naruto","丸亀":"marugame","児島":"kojima",
    "宮島":"miyajima","徳山":"tokuyama","下関":"shimonoseki","若松":"wakamatsu",
    "芦屋":"ashiya","福岡":"fukuoka","唐津":"karatsu","大村":"omura"
  };
  const slug = SLUG[DATA.venue] || DATA.venue;
  const date = DATA.date;
  try {
    const res  = await fetch(`/api/tenji_all?venue=${slug}&date=${date}`);
    const json = await res.json();
    if(json.ok && json.races){
      for(const [rno, byFrame] of Object.entries(json.races)){
        const key = tenjiKey(slug, date, parseInt(rno));
        byFrame["__fetched_at"] = "";
        // fetched_at を先頭艇から取得
        const first = Object.values(byFrame).find(v=> v && v.fetched_at);
        if(first) byFrame["__fetched_at"] = first.fetched_at.slice(11,16);
        _tenjiCache[key] = byFrame;
      }
    }
  } catch(e){ /* silent */ }
}

const _commentCache = {};  // key: "slug_date_race" → {1:{name,comment}, ...} | null

// キーワードハイライト（良い情報・悪い情報）
const COMMENT_KEYWORDS_GOOD = ['調子いい','足がいい','足は良','仕上がって','自信','乗れてる','感触いい','良さそう','行ける','自信あり'];
const COMMENT_KEYWORDS_BAD  = ['エンジンに力','力がない','届かない','失敗','苦しい','厳しい','遅い','差ない','出し切れ','整備'];

function commentKey(venue, date, race){
  return `${venue}_${date}_${race}`;
}

function highlightComment(text){
  if(!text) return '<span class="comment-empty">コメントなし</span>';
  let t = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  COMMENT_KEYWORDS_GOOD.forEach(kw=>{
    t = t.replaceAll(kw, `<span class="comment-keyword good">${kw}</span>`);
  });
  COMMENT_KEYWORDS_BAD.forEach(kw=>{
    t = t.replaceAll(kw, `<span class="comment-keyword bad">${kw}</span>`);
  });
  return t;
}

function buildCommentSection(rno, boats){
  const SLUG = {
    "桐生":"kiryu","戸田":"toda","江戸川":"edogawa","平和島":"heiwajima",
    "多摩川":"tamagawa","浜名湖":"hamanako","蒲郡":"gamagori","常滑":"tokoname",
    "津":"tsu","三国":"mikuni","びわこ":"biwako","住之江":"suminoe",
    "尼崎":"amagasaki","鳴門":"naruto","丸亀":"marugame","児島":"kojima",
    "宮島":"miyajima","徳山":"tokuyama","下関":"shimonoseki","若松":"wakamatsu",
    "芦屋":"ashiya","福岡":"fukuoka","唐津":"karatsu","大村":"omura"
  };
  const slug = SLUG[DATA.venue] || DATA.venue;
  const key  = commentKey(slug, DATA.date, rno);

  // boatオブジェクトにcommentが直接含まれている場合（CSV埋め込み）
  const hasInline = boats.some(b => b.comment);
  if(hasInline){
    const rows = boats.map(bt => `
      <div class="comment-row">
        <span class="boat-circle b${bt.boat}" style="width:22px;height:22px;font-size:11px;line-height:22px">${bt.boat}</span>
        <span class="comment-name">${bt.name}</span>
        <span class="comment-text">${highlightComment(bt.comment||'')}</span>
      </div>`).join('');
    return `<div class="comment-section">
      <div class="comment-title">選手コメント <span class="comment-badge">CSV</span></div>
      ${rows}
    </div>`;
  }

  // サーバーモードでなければ非表示
  if(!IS_SERVER) return '';

  const cached = _commentCache[key];
  if(cached === undefined){
    setTimeout(()=> fetchComment(slug, DATA.date, rno, boats), 0);
    return `<div class="comment-section">
      <div class="comment-title">選手コメント <span class="comment-badge waiting">取得中...</span></div>
      <div class="tenji-waiting">⏳ 取得中...</div>
    </div>`;
  }
  if(cached === null){
    return `<div class="comment-section">
      <div class="comment-title">選手コメント <span class="comment-badge error">未取得</span></div>
      <div class="tenji-waiting">コメントデータなし</div>
    </div>`;
  }

  const rows = boats.map(bt => {
    const entry = cached[bt.boat] || {};
    return `<div class="comment-row">
      <span class="boat-circle b${bt.boat}" style="width:22px;height:22px;font-size:11px;line-height:22px">${bt.boat}</span>
      <span class="comment-name">${bt.name}</span>
      <span class="comment-text">${highlightComment(entry.comment||'')}</span>
    </div>`;
  }).join('');

  const fetched = cached['__fetched_at'] || '';
  return `<div class="comment-section">
    <div class="comment-title">選手コメント <span class="comment-badge">取得済み${fetched?(' '+fetched):''}</span></div>
    ${rows}
  </div>`;
}

async function fetchComment(slug, date, rno, boats){
  const key = commentKey(slug, date, rno);
  try {
    const res  = await fetch(`/api/comments?venue=${slug}&date=${date}&race=${rno}`);
    const json = await res.json();
    if(json.ok && json.data){
      const d = json.data;
      d['__fetched_at'] = json.fetched_at ? json.fetched_at.slice(11,16) : '';
      _commentCache[key] = d;
    } else {
      _commentCache[key] = null;
    }
  } catch(e){
    _commentCache[key] = null;
  }
  if(rno === selectedRace) renderDetail(rno);
}

// ── FILE UPLOAD ──
async function handleCSV(text){
  const lines = text.trim().split('\n').filter(l=>l.trim());
  if(lines.length < 2){ showToast('CSVの形式が不正です'); return; }
  const headers = lines[0].split(',').map(h=>h.trim().replace(/"/g,''));
  if(!headers.includes('会場') || !headers.includes('レース')){ showToast('対応フォーマットではありません'); return; }
  const idx = h=>headers.indexOf(h);
  const rows = lines.slice(1).map(l=>{
    const cols = l.split(',').map(c=>c.trim().replace(/"/g,''));
    const obj={};
    headers.forEach((h,i)=>obj[h]=cols[i]||'');
    return obj;
  });
  const venue = rows[0]['会場']||'不明';
  const date  = rows[0]['日付']||'';
  const races = {};
  rows.forEach(r=>{
    const rno = parseInt(r['レース'])||0;
    if(!races[rno]) races[rno]={arek:54.7,time:r['締切時刻']||'',boats:[]};
    const rawName = r['選手名']?(r['選手名'].replace(/\d+$/, '').trim()):('艇'+r['艇番']);
    const regNo = String(r['登番']||'').trim();
    const name = (regNo && PLAYER_ID_MAP[regNo]) ? PLAYER_ID_MAP[regNo] : rawName;
    races[rno].boats.push({
      boat:parseInt(r['艇番'])||0,
      name, grade:r['級別']||'B1',
      win_rate:parseFloat(r['全国勝率'])||0,
      local_rate:parseFloat(r['当地勝率'])||0,
      motor2:parseFloat(r['M2率'])||0,
      boat2:parseFloat(r['B2率'])||0,
      results:r['今節成績']||'',
      hayami:parseFloat(r['早見'])||null,
      score:0.1, dq:'fallback', prob:0.1667,
    });
  });
  // ── 確率計算: サーバー経由（Excelマスタ使用）or フォールバック ──
  async function calcProbWithMaster(racesObj, venueStr) {
    // サーバーが使えればAPIで一括計算
    if (IS_SERVER) {
      // CSVテキストをそのままPOSTして計算済みデータを受け取る
      return racesObj; // サーバーモードではparse済みデータが来るので不要
    }
    // スタンドアロン: ブラウザ内でフォールバック計算
    const NATIONAL_AVG = {1:0.555, 2:0.138, 3:0.116, 4:0.090, 5:0.060, 6:0.021};
    Object.values(racesObj).forEach(rd => {
      rd.boats.forEach(bt => {
        bt.score = NATIONAL_AVG[bt.boat] || 0.05;
        bt.dq = 'fallback';
      });
      const tot = rd.boats.reduce((s,b) => s+b.score, 0);
      rd.boats.forEach(bt => bt.prob = bt.score/tot);
      rd.boats.sort((a,b) => b.prob-a.prob);
    });
    return racesObj;
  }
  if(IS_SERVER){
    // サーバーモード: CSVをサーバーに投げてExcelマスタで確率計算
    try {
      const res = await fetch('/api/parse_csv', {method:'POST', body:text, headers:{'Content-Type':'text/plain'}});
      const j = await res.json();
      if(j.ok && j.data){
        DATA = j.data;
        selectedRace = parseInt(Object.keys(j.data.races)[0]) || 1;
        buildVenueBar(); buildRaceBar(); selectRace(selectedRace);
        document.getElementById('upload-area').style.display='none';
        showToast(`✅ ${j.data.venue} ${j.data.date} — Excelマスタで計算 (${Object.keys(j.data.races).length}R)`);
        return;
      }
    } catch(e) { /* fallthrough to local calc */ }
  }

  // スタンドアロン or サーバー失敗時: ブラウザ内フォールバック計算
  const calculatedRaces = await calcProbWithMaster(races, venue);
  DATA={venue,date,inn_data:MASTER.inn_data,races:calculatedRaces};
  selectedRace=parseInt(Object.keys(races)[0])||1;
  buildVenueBar();
  buildRaceBar();
  selectRace(selectedRace);
  document.getElementById('upload-area').style.display='none';
  showToast(`${venue} ${date} — ${Object.keys(races).length}レース読み込み完了`);
}

// 会場を切り替えて再描画（タブクリック時）
async function switchVenue(v){
  // すでにロード済みならそのまま表示
  if(ALL_DATA[v] && ALL_DATA[v] !== MASTER_EMPTY){
    applyVenueData(v, ALL_DATA[v]);
    return;
  }

  // 未ロードの場合: サーバーモードならその場でfetchを試みる
  if(!IS_SERVER) return;

  // タブをローディング状態に
  const tabBtn = document.querySelector(`#venue-tabs .vtab[data-venue="${v}"]`);
  if(tabBtn){ tabBtn.classList.add('loading'); tabBtn.disabled = false; }

  try {
    // 会場名に一致するファイルをfile-selectorから探す
    const sel = document.getElementById('file-selector');
    let fname = null;
    if(sel){
      Array.from(sel.options).forEach(opt=>{
        if(venueFromFilename(opt.value) === v) fname = opt.value;
      });
    }
    if(!fname){
      // ファイルリストを再取得して探す
      const fr = await fetch('/api/files');
      const fj = await fr.json();
      fname = (fj.files || []).find(f=>venueFromFilename(f)===v) || null;
    }
    if(!fname) throw new Error('file not found');

    const r = await fetch(`/api/load?file=${encodeURIComponent(fname)}`);
    const j = await r.json();
    if(j.ok && j.data && j.data.races){
      if(tabBtn){ tabBtn.classList.remove('loading'); }
      applyVenueData(v, j.data);
    } else {
      throw new Error('load failed');
    }
  } catch(e){
    if(tabBtn){ tabBtn.classList.remove('loading'); tabBtn.disabled = true; }
    showToast(`${v}のデータを取得できませんでした`);
  }
}

// ── サーバーモード: 全CSVを一括ロード ──

async function loadAllVenuesFromServer(){
  try {
    const res = await fetch('/api/files');
    const json = await res.json();
    if(!json.files || !json.files.length) return;

    // ファイルセレクタ更新
    const sel = document.getElementById('file-selector');
    if(sel){
      sel.innerHTML = json.files.map(f=>`<option value="${f}">${f}</option>`).join('');
      sel.style.display = json.files.length > 1 ? 'inline-block' : 'none';
    }

    // 同じ会場で複数ファイルがある場合、最新日付のものだけを残す
    const venueFileMap = {};
    json.files.forEach(fname=>{
      const vname = venueFromFilename(fname);
      if(!vname) return;
      const dm = fname.match(/(\d{4}-\d{2}-\d{2})/);
      const dateStr = dm ? dm[1] : '0000-00-00';
      if(!venueFileMap[vname] || dateStr > venueFileMap[vname].date){
        venueFileMap[vname] = { fname, date: dateStr };
      }
    });

    // 各会場の最新ファイルをロード（順番に処理して firstVenue を確実に1つ目にする）
    let firstVenue = null;
    const venueEntries = Object.entries(venueFileMap);
    await Promise.all(venueEntries.map(async ([vname, {fname}])=>{
      // すでに同ファイルをロード済みならスキップ
      if(ALL_DATA[vname] && ALL_DATA[vname].__file === fname) {
        if(!firstVenue) firstVenue = vname;
        return;
      }

      // ローディング中タブ表示
      const tabBtn = document.querySelector(`#venue-tabs .vtab[data-venue="${vname}"]`);
      if(tabBtn){ tabBtn.classList.add('loading'); tabBtn.disabled = false; }

      try {
        const r = await fetch(`/api/load?file=${encodeURIComponent(fname)}`);
        const j = await r.json();
        if(j.ok && j.data && j.data.races){
          j.data.__file = fname;
          ALL_DATA[vname] = j.data;
          if(!firstVenue) firstVenue = vname;
          if(tabBtn){ tabBtn.classList.remove('loading'); tabBtn.classList.add('loaded'); tabBtn.disabled = false; }
        }
      } catch(e){
        if(tabBtn){ tabBtn.classList.remove('loading'); tabBtn.disabled = true; }
      }
    }));

    // 初期表示: 最初にロードできた会場を選択（まだ表示されていない場合）
    if(firstVenue){
      document.getElementById('upload-area').style.display = 'none';
      if(!currentVenue || ALL_DATA[currentVenue] === MASTER_EMPTY){
        applyVenueData(firstVenue, ALL_DATA[firstVenue]);
      } else {
        // 現在表示中の会場データが更新されていたら再描画
        applyVenueData(currentVenue, ALL_DATA[currentVenue]);
      }
      const loadedCount = Object.keys(ALL_DATA).filter(k=>ALL_DATA[k]&&ALL_DATA[k]!==MASTER_EMPTY).length;
      const d = ALL_DATA[firstVenue];
      document.getElementById('server-status').textContent =
        `✅ ${loadedCount}会場読込済 — ${d.date || ''} ${d.loaded_at || ''}`;
      document.getElementById('server-status').style.color = 'var(--green)';
    }
  } catch(e){
    document.getElementById('server-status').textContent = '⚠️ サーバーに接続できません — CSVをドロップして手動読み込み';
    document.getElementById('server-status').style.color = 'var(--gold)';
  }
}

// player_id_map を先に読み込んでから初期化（タイミング問題を解消）
(async () => {
  await loadPlayerIdMap();

  if (IS_SERVER) {
    document.getElementById('server-bar').style.display = 'flex';
    document.getElementById('upload-area').style.display = 'none';
    loadAllVenuesFromServer();
    fetchMasterStats();
    // テン展示: 起動時プリフェッチ＆ポーリング開始
    if(IS_SERVER){ prefetchAllTenji().then(()=>{ if(selectedRace) renderDetail(selectedRace); }); startTenjiPolling(); }
    setInterval(loadAllVenuesFromServer, 60000); // 60秒ごとに更新チェック
    document.getElementById('file-selector').addEventListener('change', async function(){
      if(!this.value) return;
      const vname = venueFromFilename(this.value);
      if(vname){
        await (async()=>{
          const r = await fetch(`/api/load?file=${encodeURIComponent(this.value)}`);
          const j = await r.json();
          if(j.ok && j.data){ ALL_DATA[vname] = j.data; buildVenueTabs(); switchVenue(vname); }
        })();
      }
    });
  } else {
    // スタンドアロンモード: MASTERデータがある会場をそのまま表示
    const firstLoaded = VENUE_LIST.find(v=>ALL_DATA[v] && ALL_DATA[v] !== MASTER_EMPTY);
    if(firstLoaded){
      currentVenue = firstLoaded;
      DATA = ALL_DATA[firstLoaded];
      buildVenueTabs();
      buildVenueBar();
      buildRaceBar();
      selectRace(selectedRace);
      document.getElementById('upload-area').style.display = 'none';
    } else {
      buildVenueTabs();
    }
  }

  // ファイルモードのリロード後: sessionStorageで状態を復元
  const _rv = sessionStorage.getItem('refresh_venue');
  const _rr = parseInt(sessionStorage.getItem('refresh_race') || '');
  const _rt = sessionStorage.getItem('refresh_tab');
  if(_rv || _rr || _rt) {
    sessionStorage.removeItem('refresh_venue');
    sessionStorage.removeItem('refresh_race');
    sessionStorage.removeItem('refresh_tab');
    if(_rv && ALL_DATA[_rv] && ALL_DATA[_rv] !== MASTER_EMPTY) applyVenueData(_rv, ALL_DATA[_rv]);
    if(_rr && DATA && DATA.races && DATA.races[_rr]) selectRace(_rr);
    if(_rt) switchTab(_rt);
  }
})();

// ── 更新処理（タブ・会場・レースを維持） ──────────────────────────
async function doRefresh() {
  const btn = document.getElementById('refresh-btn');
  if(btn) { btn.classList.add('spinning'); }

  const savedVenue = currentVenue;
  const savedRace  = selectedRace;
  const savedTab   = currentTabName();

  try {
    if(IS_SERVER) {
      await loadAllVenuesFromServer();
    } else {
      // ファイルモードはリロードでタブ状態を保存してから
      sessionStorage.setItem('refresh_venue', savedVenue || '');
      sessionStorage.setItem('refresh_race',  String(savedRace || ''));
      sessionStorage.setItem('refresh_tab',   savedTab || '');
      location.reload();
      return;
    }

    // 会場を復元
    if(savedVenue && ALL_DATA[savedVenue] && ALL_DATA[savedVenue] !== MASTER_EMPTY) {
      applyVenueData(savedVenue, ALL_DATA[savedVenue]);
    }

    // レースを復元
    if(savedRace && DATA && DATA.races && DATA.races[savedRace]) {
      selectRace(savedRace);
    }

    // タブを復元
    if(savedTab) switchTab(savedTab);

    showToast('更新しました');
  } catch(e) {
    showToast('更新に失敗しました');
  } finally {
    if(btn) { btn.classList.remove('spinning'); }
  }
}

// ── Pull-to-Refresh ────────────────────────────────────────────────
(function() {
  const THRESHOLD = 65; // px — この距離引っ張ったら更新
  let startY = 0;
  let pulling = false;
  let refreshing = false;

  const indicator = document.getElementById('ptr-indicator');
  const label     = document.getElementById('ptr-label');

  function canPull() {
    return window.scrollY === 0 && !refreshing;
  }

  document.addEventListener('touchstart', e => {
    if(!canPull()) return;
    startY = e.touches[0].clientY;
    pulling = false;
  }, { passive: true });

  document.addEventListener('touchmove', e => {
    if(!canPull()) return;
    const dist = e.touches[0].clientY - startY;
    if(dist <= 0) return;
    pulling = true;
    const pct = Math.min(dist / THRESHOLD, 1);
    indicator.classList.toggle('pulling', true);
    label.textContent = pct >= 1 ? '✓ 離して更新' : '↓ 引っ張って更新';
  }, { passive: true });

  document.addEventListener('touchend', async () => {
    if(!pulling) return;
    const dist_enough = label.textContent.includes('離して');
    indicator.classList.remove('pulling');
    pulling = false;
    if(!dist_enough) return;

    refreshing = true;
    indicator.classList.add('refreshing');
    label.textContent = '更新中...';

    await doRefresh();

    indicator.classList.remove('refreshing');
    label.textContent = '↓ 引っ張って更新';
    refreshing = false;
  });
})();
